<!-- js_main.html: Client-side JavaScript Controller, Kanban & Chart.js Engine -->
<script>
/**
 * State Management Global Aplikasi Sisi Klien
 */
const app_state = {
  current_user: null,
  active_project_id: 'PRJ-001',
  active_sprint_id: 'SPR-001',
  current_view: 'dashboard',
  projects: [],
  tasks: [],
  backlog_tasks: [],
  sprints: [],
  insights: null,
  users_list: [],
  is_loading: false,
  burndown_chart_instance: null,
  kanban_group_by: 'parent',
  collapsed_swimlanes: {},
  pending_parent_done: null
};

/**
 * Event Listener saat DOM siap dimuat
 */
document.addEventListener('DOMContentLoaded', () => {
  init_application();
});

/**
 * Inisialisasi awal aplikasi SPA
 */
function init_application() {
  fetch_user_session();
}

/**
 * Mengambil profil & role pengguna aktif dari backend GAS
 */
function fetch_user_session() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (response && response.success) {
          app_state.current_user = response.data;
          render_user_profile(response.data);
          apply_rbac_permissions(response.data.role);
          load_projects_list();
          load_sprint_tasks();
          load_sprint_insights();
        } else {
          show_notification('Gagal memuat profil pengguna.', 'error');
        }
      })
      .withFailureHandler(err => {
        show_notification('Error koneksi backend: ' + err.message, 'error');
      })
      .get_user_role();
  } else {
    // Mode simulasi lokal untuk pengujian browser
    const mock_user = {
      id: 'USR-002',
      name: 'Budi PM',
      email: 'pm@example.com',
      role: 'PM'
    };
    app_state.current_user = mock_user;
    render_user_profile(mock_user);
    apply_rbac_permissions(mock_user.role);
    init_mock_projects();
    init_mock_tasks();
    init_mock_insights();
  }
}

/**
 * Merender profil pengguna di sidebar
 */
function render_user_profile(user) {
  const avatar_el = document.getElementById('user-avatar');
  const name_el = document.getElementById('nav-user-name');
  const email_el = document.getElementById('nav-user-email');
  const role_badge_el = document.getElementById('nav-user-role-badge');
  const welcome_name_el = document.getElementById('dash-welcome-name');

  if (welcome_name_el) welcome_name_el.textContent = user.name || user.email || 'Pengguna';
  if (avatar_el && user.name) avatar_el.textContent = user.name.charAt(0).toUpperCase();
  if (name_el) name_el.textContent = user.name || user.email || 'Pengguna';
  if (email_el) email_el.textContent = user.email || '';
  if (role_badge_el) {
    role_badge_el.textContent = user.role;
    if (user.role === 'ADMIN' || user.role === 'PM') {
      role_badge_el.className = 'inline-block px-1.5 py-0.5 rounded text-[10px] font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30';
    } else if (user.role === 'MEMBER') {
      role_badge_el.className = 'inline-block px-1.5 py-0.5 rounded text-[10px] font-bold bg-blue-500/20 text-blue-300 border border-blue-500/30';
    } else {
      role_badge_el.className = 'inline-block px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30';
    }
  }
}

/**
 * Menyesuaikan kontrol UI berdasarkan RBAC dan Granular Permissions
 */
function apply_rbac_permissions(role) {
  const user = app_state.current_user || {};
  const perms = user.permissions || {
    can_create_project: role === 'ADMIN' || role === 'PM',
    can_manage_sprint: role === 'ADMIN' || role === 'PM',
    can_create_task: role === 'ADMIN' || role === 'PM',
    can_move_task: role !== 'CLIENT',
    can_view_insights: true,
    can_view_cycle_time: true,
    can_test_initiative: role !== 'CLIENT',
    can_manage_demand: role === 'ADMIN' || role === 'PM',
    can_manage_users: role === 'ADMIN'
  };

  const rbac_tag = document.getElementById('rbac-permission-tag');
  const btn_add_task = document.getElementById('btn-add-task');
  const nav_btn_users = document.getElementById('nav-btn-users');
  const nav_btn_cycle_time = document.getElementById('nav-btn-cycle-time');
  const nav_btn_initiative_test = document.getElementById('nav-btn-initiative-test');
  const nav_btn_demand = document.getElementById('nav-btn-demand');
  const btn_add_project = document.getElementById('btn-add-project');
  const btn_header_add_task = document.getElementById('btn-header-add-task');
  const btn_backlog_add_task = document.getElementById('btn-backlog-add-task');
  const btn_header_add_sprint = document.getElementById('btn-header-add-sprint');
  const btn_end_sprint = document.getElementById('btn-end-sprint');

  if (rbac_tag) {
    if (role === 'ADMIN') {
      rbac_tag.textContent = 'Mode: ADMIN (Akses Penuh)';
      rbac_tag.className = 'text-xs font-semibold text-purple-700 bg-purple-50 border border-purple-200 px-2.5 py-1 rounded-full';
    } else if (role === 'PM') {
      rbac_tag.textContent = 'Mode: PM (Project Manager)';
      rbac_tag.className = 'text-xs font-semibold text-indigo-700 bg-indigo-50 border border-indigo-200 px-2.5 py-1 rounded-full';
    } else if (role === 'MEMBER') {
      rbac_tag.textContent = 'Mode: Team Member';
      rbac_tag.className = 'text-xs font-semibold text-blue-700 bg-blue-50 border border-blue-200 px-2.5 py-1 rounded-full';
    } else {
      rbac_tag.textContent = 'Mode: External Client (Read-only)';
      rbac_tag.className = 'text-xs font-semibold text-amber-700 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-full';
    }
  }

  // Kontrol visibilitas tombol berdasarkan granular permissions
  if (btn_add_task) {
    if (perms.can_create_task) btn_add_task.classList.remove('hidden');
    else btn_add_task.classList.add('hidden');
  }
  if (btn_header_add_task) {
    if (perms.can_create_task) btn_header_add_task.classList.remove('hidden');
    else btn_header_add_task.classList.add('hidden');
  }
  if (btn_backlog_add_task) {
    if (perms.can_create_task) btn_backlog_add_task.classList.remove('hidden');
    else btn_backlog_add_task.classList.add('hidden');
  }
  if (btn_header_add_sprint) {
    if (perms.can_manage_sprint) btn_header_add_sprint.classList.remove('hidden');
    else btn_header_add_sprint.classList.add('hidden');
  }
  if (btn_end_sprint) {
    if (perms.can_manage_sprint) btn_end_sprint.classList.remove('hidden');
    else btn_end_sprint.classList.add('hidden');
  }
  if (btn_add_project) {
    if (perms.can_create_project) btn_add_project.classList.remove('hidden');
    else btn_add_project.classList.add('hidden');
  }

  // Menu Cycle Time
  if (nav_btn_cycle_time) {
    if (perms.can_view_cycle_time !== false) {
      nav_btn_cycle_time.classList.remove('hidden');
    } else {
      nav_btn_cycle_time.classList.add('hidden');
    }
  }

  // Menu Uji Inisiatif AI
  if (nav_btn_initiative_test) {
    if (perms.can_test_initiative !== false) {
      nav_btn_initiative_test.classList.remove('hidden');
    } else {
      nav_btn_initiative_test.classList.add('hidden');
    }
  }

  // Menu Demand Management
  if (nav_btn_demand) {
    if (perms.can_manage_demand !== false) {
      nav_btn_demand.classList.remove('hidden');
    } else {
      nav_btn_demand.classList.add('hidden');
    }
  }

  // Menu Manajemen Pengguna hanya muncul jika can_manage_users = true
  if (nav_btn_users) {
    if (perms.can_manage_users) {
      nav_btn_users.classList.remove('hidden');
    } else {
      nav_btn_users.classList.add('hidden');
    }
  }
}

/**
 * Memuat task sprint dari backend
 */
function load_sprint_tasks() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    set_loading_state(true);
    google.script.run
      .withSuccessHandler(response => {
        set_loading_state(false);
        if (response && response.success) {
          app_state.tasks = response.data || [];
          render_kanban_board();
        } else {
          show_notification('Gagal mengambil daftar task: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        set_loading_state(false);
        show_notification('Error koneksi task: ' + err.message, 'error');
      })
      .get_sprint_tasks(app_state.active_sprint_id);
  }
}

/**
 * Memuat ringkasan insight & metrik dari backend
 * @param {string} [target_sprint_id]
 */
function load_sprint_insights(target_sprint_id) {
  const sprint_id = target_sprint_id || app_state.selected_insight_sprint_id || app_state.active_sprint_id;
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (response && response.success) {
          app_state.insights = response.data;
          render_insights_dashboard(response.data);
        } else {
          show_notification('Gagal memuat insight sprint: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        show_notification('Error koneksi insight: ' + err.message, 'error');
      })
      .get_sprint_insights(sprint_id);
  } else {
    // Mode offline / mock
    init_mock_insights();
  }
}

/**
 * Handler pergantian sprint pada dropdown Actionable Insights
 * @param {string} sprint_id
 */
function handle_insight_sprint_change(sprint_id) {
  if (!sprint_id) return;
  app_state.selected_insight_sprint_id = sprint_id;
  load_sprint_insights(sprint_id);
}

/**
 * Toggle collapse/expand widget pada dasbor insight (Sprint Progress & Sprint Burndown)
 * @param {string} body_id
 */
function toggle_insight_widget_collapse(body_id) {
  const body_el = document.getElementById(body_id);
  const chevron_el = document.getElementById('chevron-' + body_id);
  if (!body_el) return;

  const is_collapsed = body_el.classList.contains('hidden');
  if (is_collapsed) {
    body_el.classList.remove('hidden');
    if (chevron_el) chevron_el.classList.remove('-rotate-90');
  } else {
    body_el.classList.add('hidden');
    if (chevron_el) chevron_el.classList.add('-rotate-90');
  }
}

/**
 * Render Dasbor Insight: Sprint Progress, Sprint Burndown, KPI Cards, dan Blocker List
 * @param {Object} data - Payload metrik
 */
function render_insights_dashboard(data) {
  if (!data) return;

  // 1. Populate Sprint Selector Dropdown
  const sprint_select = document.getElementById('insight-sprint-select');
  if (sprint_select && data.sprints && data.sprints.length > 0) {
    const cur_val = (data.sprint && data.sprint.id) || app_state.selected_insight_sprint_id || sprint_select.value;
    sprint_select.innerHTML = '';
    data.sprints.forEach(sp => {
      const opt = document.createElement('option');
      opt.value = sp.id;
      opt.textContent = `${sp.name} (${sp.id})` + (sp.status === 'ACTIVE' ? ' ★ Aktif' : (sp.status === 'COMPLETED' ? ' ✓ Selesai' : ''));
      if (sp.id === cur_val) opt.selected = true;
      sprint_select.appendChild(opt);
    });
  }

  // 2. Render Sprint Progress Card (Story Points)
  const sp_data = data.sprint_progress || {
    total_points: 0,
    done_points: 0,
    in_progress_points: 0,
    todo_points: 0,
    done_percent: 0,
    in_progress_percent: 0,
    todo_percent: 0,
    points_done_text: '0 points done, 0 points to go'
  };

  const bar_done = document.getElementById('progress-bar-done');
  const bar_inprogress = document.getElementById('progress-bar-inprogress');
  const bar_todo = document.getElementById('progress-bar-todo');
  const lbl_done = document.getElementById('progress-percent-done-label');

  if (bar_done) bar_done.style.width = sp_data.done_percent + '%';
  if (bar_inprogress) bar_inprogress.style.width = sp_data.in_progress_percent + '%';
  if (bar_todo) bar_todo.style.width = sp_data.todo_percent + '%';
  if (lbl_done) lbl_done.textContent = sp_data.done_percent + '% done';

  const stat_done = document.getElementById('progress-stat-done');
  const stat_inprogress = document.getElementById('progress-stat-inprogress');
  const stat_todo = document.getElementById('progress-stat-todo');
  const pts_done = document.getElementById('progress-pts-done');
  const pts_inprogress = document.getElementById('progress-pts-inprogress');
  const pts_todo = document.getElementById('progress-pts-todo');
  const total_scope = document.getElementById('progress-total-scope');

  if (stat_done) stat_done.textContent = sp_data.done_percent + '%';
  if (stat_inprogress) stat_inprogress.textContent = sp_data.in_progress_percent + '%';
  if (stat_todo) stat_todo.textContent = sp_data.todo_percent + '%';

  if (pts_done) pts_done.textContent = sp_data.done_points + ' pts';
  if (pts_inprogress) pts_inprogress.textContent = sp_data.in_progress_points + ' pts';
  if (pts_todo) pts_todo.textContent = sp_data.todo_points + ' pts';
  if (total_scope) total_scope.textContent = 'Total Scope: ' + sp_data.total_points + ' pts';

  // 3. Render Sprint Burndown Subtitle & Date range
  const burndown_summary = document.getElementById('burndown-points-summary');
  if (burndown_summary) {
    burndown_summary.textContent = (data.burndown && data.burndown.points_done_text) || (sp_data.points_done_text || '0 points done, 0 points to go');
  }
  const start_lbl = document.getElementById('burndown-start-date');
  const end_lbl = document.getElementById('burndown-end-date');
  if (start_lbl && data.sprint) start_lbl.textContent = 'Mulai: ' + (data.sprint.start_date || '-');
  if (end_lbl && data.sprint) end_lbl.textContent = 'Target Selesai: ' + (data.sprint.end_date || '-');

  // 4. Render Burndown Chart via Chart.js
  render_burndown_chart(data.burndown);

  // 5. KPI Cards
  const el_lead = document.getElementById('metric-lead-time');
  const el_cycle = document.getElementById('metric-cycle-time');
  const el_blocker = document.getElementById('metric-blocker-count');

  if (el_lead && data.summary) el_lead.textContent = data.summary.avg_lead_time_hours;
  if (el_cycle && data.summary) el_cycle.textContent = data.summary.avg_cycle_time_hours;
  if (el_blocker && data.summary) el_blocker.textContent = data.summary.blocker_count;

  // 6. Blocker Highlights List
  const blocker_container = document.getElementById('blocker-list-container');
  if (blocker_container) {
    blocker_container.innerHTML = '';
    if (!data.blockers || data.blockers.length === 0) {
      blocker_container.innerHTML = `
        <div class="p-4 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg text-xs text-center font-medium">
          ✓ Tidak ada blocker terdeteksi saat ini.
        </div>
      `;
    } else {
      data.blockers.forEach(b => {
        const item = document.createElement('div');
        item.className = 'p-3 bg-rose-50/70 border border-rose-200 rounded-lg text-xs flex flex-col space-y-1.5';
        item.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-rose-800">${b.task_id}</span>
            <span class="px-1.5 py-0.5 rounded bg-rose-200 text-rose-900 font-semibold text-[10px]">
              Macet ${b.stuck_hours} Jam
            </span>
          </div>
          <p class="font-medium text-slate-800">${b.title}</p>
          <div class="flex justify-between items-center text-[10px] text-slate-500 pt-1 border-t border-rose-100">
            <span>Status: <strong class="text-rose-700">${b.status}</strong></span>
            <span>PIC: <strong>${b.assignee}</strong></span>
          </div>
        `;
        blocker_container.appendChild(item);
      });
    }
  }
}

/**
 * Merender grafik garis Burndown Chart dengan Chart.js (Persis bergaya Jira)
 * @param {Object} burndown
 */
function render_burndown_chart(burndown) {
  if (!burndown) return;

  const canvas = document.getElementById('burndownChart');
  const placeholder = document.getElementById('burndown-placeholder');
  if (!canvas || typeof Chart === 'undefined') return;

  if (placeholder) placeholder.classList.add('hidden');

  // Hancurkan instance chart lama jika sudah ada
  if (app_state.burndown_chart_instance) {
    app_state.burndown_chart_instance.destroy();
  }

  const labels = (burndown.date_labels && burndown.date_labels.length > 0)
    ? burndown.date_labels
    : (burndown.labels || []);

  const actual_data = burndown.actual_percent !== undefined
    ? burndown.actual_percent
    : (burndown.actual_hours || []);

  const ideal_data = burndown.ideal_percent !== undefined
    ? burndown.ideal_percent
    : (burndown.ideal_hours || []);

  const ctx = canvas.getContext('2d');
  app_state.burndown_chart_instance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'Remaining work',
          data: actual_data,
          borderColor: '#2563eb',
          backgroundColor: 'rgba(37, 99, 235, 0.08)',
          fill: true,
          borderWidth: 2.5,
          pointRadius: 4,
          pointHoverRadius: 6,
          pointBackgroundColor: '#ffffff',
          pointBorderColor: '#2563eb',
          pointBorderWidth: 2.5,
          tension: 0.1,
          spanGaps: false
        },
        {
          label: 'Guideline',
          data: ideal_data,
          borderColor: '#64748b',
          backgroundColor: 'transparent',
          fill: false,
          borderWidth: 2,
          pointRadius: 0,
          pointHoverRadius: 4,
          tension: 0.0,
          spanGaps: true
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false
      },
      plugins: {
        legend: {
          display: false // Menggunakan custom legend HTML yang persis Jira
        },
        tooltip: {
          backgroundColor: '#1e293b',
          titleColor: '#ffffff',
          bodyColor: '#e2e8f0',
          padding: 10,
          cornerRadius: 8,
          callbacks: {
            title: function(items) {
              return items.length > 0 ? items[0].label : '';
            },
            label: function(context) {
              const val = context.raw;
              if (val === null || val === undefined) return null;
              const idx = context.dataIndex;
              if (context.dataset.label === 'Remaining work') {
                const pts = burndown.actual_points && burndown.actual_points[idx] !== undefined
                  ? burndown.actual_points[idx]
                  : (burndown.actual_hours ? burndown.actual_hours[idx] : val);
                return `Remaining: ${pts} pts (${val}%)`;
              } else {
                const pts = burndown.ideal_points && burndown.ideal_points[idx] !== undefined
                  ? burndown.ideal_points[idx]
                  : (burndown.ideal_hours ? burndown.ideal_hours[idx] : val);
                return `Guideline: ${pts} pts (${val}%)`;
              }
            }
          }
        }
      },
      scales: {
        y: {
          min: 0,
          max: 100,
          ticks: {
            stepSize: 20,
            callback: function(value) {
              return value + '%';
            },
            font: { size: 10, weight: '500' },
            color: '#64748b'
          },
          grid: {
            color: '#f1f5f9'
          },
          border: {
            display: false
          }
        },
        x: {
          grid: {
            display: false
          },
          ticks: {
            font: { size: 10, weight: '500' },
            color: '#64748b',
            maxRotation: 0,
            autoSkip: true,
            maxTicksLimit: 8
          },
          border: {
            color: '#cbd5e1'
          }
        }
      }
    }
  });
}

/**
 * Toggle collapse / expand baris swimlane
 * @param {string} group_id
 */
function toggle_swimlane_collapse(group_id) {
  if (!group_id) return;
  app_state.collapsed_swimlanes[group_id] = !app_state.collapsed_swimlanes[group_id];
  render_kanban_board();
}

/**
 * Membuka Modal Konfirmasi saat semua subtask parent berstatus DONE (Tahap 15)
 * @param {Object} parent
 */
function open_parent_done_modal(parent) {
  if (!parent) return;
  app_state.pending_parent_done = parent;

  const title_el = document.getElementById('parent-done-modal-title');
  if (title_el) {
    let type_name = 'Work Item';
    const wt = String(parent.work_type || '').toUpperCase();
    if (wt === 'USER_STORY') type_name = 'Story';
    else if (wt === 'TASK') type_name = 'Task';
    else if (wt === 'BUG') type_name = 'Bug';
    else if (wt === 'INITIATIVE') type_name = 'Inisiatif';

    title_el.innerHTML = `Update ${type_name} ${escape_html(parent.id)}`;
  }

  const modal = document.getElementById('modal-parent-done-confirm');
  if (modal) {
    modal.classList.remove('hidden');
  }
}

/**
 * Menutup Modal Konfirmasi Parent Done
 */
function close_parent_done_modal() {
  app_state.pending_parent_done = null;
  const modal = document.getElementById('modal-parent-done-confirm');
  if (modal) {
    modal.classList.add('hidden');
  }
}

/**
 * Menangani klik tombol "Update" pada modal konfirmasi parent done
 */
function handle_confirm_parent_done() {
  const parent = app_state.pending_parent_done;
  if (!parent) {
    close_parent_done_modal();
    return;
  }
  const parent_id = parent.id;
  close_parent_done_modal();
  handle_task_status_change(parent_id, 'DONE');
}

/**
 * Memeriksa apakah seluruh subtask dari parent tertentu berstatus DONE
 * dan jika ya, membuka dialog konfirmasi update parent
 * @param {string} parent_id
 */
function check_and_prompt_parent_completion(parent_id) {
  if (!parent_id) return;
  const parent = app_state.tasks.find(t => t.id === parent_id);
  if (!parent || parent.status === 'DONE') return;

  const child_subtasks = app_state.tasks.filter(t => t.parent_id === parent_id);
  if (child_subtasks.length === 0) return;

  const all_done = child_subtasks.every(s => s.status === 'DONE');
  if (all_done) {
    open_parent_done_modal(parent);
  }
}

/**
 * Merender Swimlanes berdasarkan Parent & Subtask (Default Sesuai Screenshot Lampiran)
 */
function render_parent_swimlanes(container, can_edit, statuses) {
  const subtasks = app_state.tasks.filter(t => Boolean(t.parent_id));
  const subtask_parent_ids = new Set(subtasks.map(s => s.parent_id));

  const parent_items = [];
  const standalone_items = [];

  app_state.tasks.forEach(t => {
    if (!t.parent_id) {
      if (subtask_parent_ids.has(t.id) || (t.subtask_count && t.subtask_count > 0)) {
        parent_items.push(t);
      } else {
        standalone_items.push(t);
      }
    }
  });

  // Sintesis data jika ada subtask dengan parent di luar sprint
  subtask_parent_ids.forEach(pid => {
    if (!parent_items.some(p => p.id === pid)) {
      parent_items.push({
        id: pid,
        title: 'Parent ' + pid,
        work_type: 'TASK',
        status: 'IN_PROGRESS',
        is_synthetic: true
      });
    }
  });

  if (parent_items.length === 0 && standalone_items.length === 0) {
    const empty_msg = document.createElement('div');
    empty_msg.className = 'p-8 text-center text-slate-400 text-sm bg-white rounded-xl border border-dashed border-slate-200';

/**
 * Merender Swimlanes berdasarkan Inisiatif (Level 1)
 */
function render_initiative_swimlanes(container, can_edit, statuses) {
  const initiatives = app_state.tasks.filter(t => t.work_type === 'INITIATIVE' || t.hierarchy_level === 1);
  const initiative_ids = new Set(initiatives.map(i => i.id));

  const items_by_initiative = {};
  initiatives.forEach(i => { items_by_initiative[i.id] = []; });
  const unlinked_items = [];

  app_state.tasks.forEach(t => {
    if (t.work_type === 'INITIATIVE') return;
    if (t.parent_id && initiative_ids.has(t.parent_id)) {
      items_by_initiative[t.parent_id].push(t);
    } else {
      const parent = app_state.tasks.find(p => p.id === t.parent_id);
      if (parent && parent.parent_id && initiative_ids.has(parent.parent_id)) {
        items_by_initiative[parent.parent_id].push(t);
      } else {
        unlinked_items.push(t);
      }
    }
  });

  initiatives.forEach(init => {
    const items = items_by_initiative[init.id] || [];
    render_generic_swimlane(container, init.id, '🟣 ' + init.id + ' ' + init.title, items, can_edit, statuses, init.status);
  });

  if (unlinked_items.length > 0) {
    render_generic_swimlane(container, 'unlinked-initiative', 'Item Tanpa Inisiatif', unlinked_items, can_edit, statuses);
  }
}

/**
 * Merender Swimlanes berdasarkan Assignee (PIC)
 */
function render_assignee_swimlanes(container, can_edit, statuses) {
  const assignees_map = {};
  const unassigned_items = [];

  app_state.tasks.forEach(t => {
    if (t.assignee_id || t.assignee_name) {
      const key = t.assignee_id || t.assignee_name;
      const name = t.assignee_name || t.assignee_id;
      if (!assignees_map[key]) {
        assignees_map[key] = { name: name, items: [] };
      }
      assignees_map[key].items.push(t);
    } else {
      unassigned_items.push(t);
    }
  });

  Object.keys(assignees_map).forEach(key => {
    const group = assignees_map[key];
    render_generic_swimlane(container, key, '👤 ' + group.name, group.items, can_edit, statuses);
  });

  if (unassigned_items.length > 0) {
    render_generic_swimlane(container, 'unassigned', '👤 Unassigned / Belum Ditugaskan', unassigned_items, can_edit, statuses);
  }
}

/**

 */
function render_generic_swimlane(container, group_key, title, items, can_edit, statuses, status_badge_text) {
  const is_collapsed = Boolean(app_state.collapsed_swimlanes[group_key]);
  const card = document.createElement('div');
  card.className = 'bg-white rounded-xl border border-slate-200/90 shadow-2xs overflow-hidden transition-all';
  card.id = 'swimlane-' + group_key;

  const header_el = document.createElement('div');
  header_el.className = 'px-4 py-2.5 bg-slate-50/80 border-b border-slate-200/80 flex items-center justify-between gap-3';
  header_el.innerHTML = `
    <div class="flex items-center space-x-2.5 min-w-0">
      <button 
        type="button" 
        onclick="toggle_swimlane_collapse('${escape_html(group_key)}')" 
        class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-slate-700 transition-transform ${is_collapsed ? '-rotate-90' : ''} cursor-pointer"
        title="${is_collapsed ? 'Buka swimlane' : 'Tutup swimlane'}">

      ${status_badge_text ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-200">${status_badge_text}</span>` : ''}
    </div>
  `;
  card.appendChild(header_el);

  if (!is_collapsed) {
    const grid_el = document.createElement('div');
    grid_el.className = 'p-3 grid grid-cols-1 md:grid-cols-4 gap-3 bg-slate-50/40';

    statuses.forEach(st => {
      const col_div = document.createElement('div');
      col_div.setAttribute('data-status', st);
      col_div.setAttribute('data-group-id', group_key);
      col_div.ondragover = handle_drag_over;
      col_div.ondragleave = handle_drag_leave;
      col_div.ondrop = (e) => handle_drop(e, st);
      col_div.className = 'kanban-drop-column bg-white rounded-lg p-2.5 border border-slate-200/80 min-h-[110px] space-y-2.5 transition-colors';

      const items_in_status = items.filter(s => s.status === st);
      if (items_in_status.length > 0) {
        items_in_status.forEach(item => {
          col_div.appendChild(create_task_card_element(item, can_edit));
        });
      } else {
        const empty_text = document.createElement('div');
        empty_text.className = 'py-3 text-center text-[11px] text-slate-300 italic';
        empty_text.textContent = 'Belum ada task';
        col_div.appendChild(empty_text);
      }

      grid_el.appendChild(col_div);
    });
    card.appendChild(grid_el);
  }

  container.appendChild(card);
}

/**
 * Event Handlers HTML5 Drag and Drop
 */
let dragged_task_id = null;

function handle_drag_start(e, task_id) {
  dragged_task_id = task_id;
  e.dataTransfer.setData('text/plain', task_id);
  e.dataTransfer.effectAllowed = 'move';
  const target = e.target;
  setTimeout(() => {
    target.classList.add('opacity-40', 'scale-95');
  }, 0);
}

function handle_drag_end(e) {
  const target = e.target;
  if (target && target.classList) {
    target.classList.remove('opacity-40', 'scale-95');
  }
  dragged_task_id = null;
  // Bersihkan highlight dari semua kolom
  ['column-todo', 'column-in_progress', 'column-review', 'column-done'].forEach(col_id => {
    const el = document.getElementById(col_id);
    if (el) el.classList.remove('bg-indigo-50/70', 'ring-2', 'ring-indigo-400');
  });
  document.querySelectorAll('.kanban-drop-column').forEach(el => {
    el.classList.remove('bg-indigo-50/70', 'ring-2', 'ring-indigo-400');
  });
}

function handle_drag_over(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const current_col = e.currentTarget;
  current_col.classList.add('bg-indigo-50/70', 'ring-2', 'ring-indigo-400');
}

function handle_drag_leave(e) {
  const current_col = e.currentTarget;
  current_col.classList.remove('bg-indigo-50/70', 'ring-2', 'ring-indigo-400');
}

function handle_drop(e, target_status) {
  e.preventDefault();
  const current_col = e.currentTarget;
  current_col.classList.remove('bg-indigo-50/70', 'ring-2', 'ring-indigo-400');

  const task_id = e.dataTransfer.getData('text/plain') || dragged_task_id;
  if (!task_id || !target_status) return;

  handle_task_status_change(task_id, target_status);
}

/**
 * Menangani pergeseran status task dan me-refresh insight secara otomatis
 */
function handle_task_status_change(task_id, new_status) {
  const target_task = app_state.tasks.find(t => t.id === task_id);
  if (!target_task) return;

  const old_status = target_task.status;
  if (old_status === new_status) return;

  // Optimistic UI update
  target_task.status = new_status;
  target_task.updated_at = new Date().toISOString();
  render_kanban_board();

  // Jika subtask dipindahkan ke DONE, periksa apakah seluruh subtask dari parent telah selesai (Tahap 15)
  if (new_status === 'DONE' && target_task.parent_id) {
    check_and_prompt_parent_completion(target_task.parent_id);
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (response && response.success) {
          show_notification('Status task ' + task_id + ' berhasil diubah ke ' + new_status, 'success');
          // Refresh insight data pasca pergeseran status
          load_sprint_insights();
        } else {
          target_task.status = old_status;
          render_kanban_board();
          show_notification('Gagal mengubah status: ' + (response ? response.message : 'Ditolak backend'), 'error');
        }
      })
      .withFailureHandler(err => {
        target_task.status = old_status;
        render_kanban_board();
        show_notification('Error pergeseran status: ' + err.message, 'error');
      })
      .update_task_status(task_id, new_status);
  } else {
    show_notification('[Simulasi] Status task ' + task_id + ' berpindah: ' + old_status + ' -> ' + new_status, 'info');
  }
}

/**
 * Berpindah tab antara Kanban Board dan Sprint Planning di dalam menu Project
 * @param {'board'|'planning'} tab_name
 */
function switch_project_tab(tab_name) {
  const tab_board_btn = document.getElementById('tab-btn-board');
  const tab_planning_btn = document.getElementById('tab-btn-planning');
  const board_content = document.getElementById('view-board');
  const planning_content = document.getElementById('view-scrum-planning');

  if (tab_name === 'planning') {
    if (board_content) {
      board_content.classList.remove('block');
      board_content.classList.add('hidden');
    }
    if (planning_content) {
      planning_content.classList.remove('hidden');
      planning_content.classList.add('block');
    }
    if (tab_planning_btn) {
      tab_planning_btn.className = 'px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-sm bg-white text-indigo-700 cursor-pointer flex items-center space-x-1.5';
    }
    if (tab_board_btn) {
      tab_board_btn.className = 'px-4 py-2 rounded-lg text-xs font-bold transition-all text-slate-600 hover:text-slate-900 cursor-pointer flex items-center space-x-1.5';
    }
    app_state.current_project_tab = 'planning';
    load_scrum_planning_data();
  } else {
    // Default: 'board'
    if (planning_content) {
      planning_content.classList.remove('block');
      planning_content.classList.add('hidden');
    }
    if (board_content) {
      board_content.classList.remove('hidden');
      board_content.classList.add('block');
    }
    if (tab_board_btn) {
      tab_board_btn.className = 'px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-sm bg-white text-indigo-700 cursor-pointer flex items-center space-x-1.5';
    }
    if (tab_planning_btn) {
      tab_planning_btn.className = 'px-4 py-2 rounded-lg text-xs font-bold transition-all text-slate-600 hover:text-slate-900 cursor-pointer flex items-center space-x-1.5';
    }
    app_state.current_project_tab = 'board';
    load_sprint_tasks();
  }
}

/**
 * Logika SPA Navigasi antar tampilan tanpa reload browser
 */
function switch_view(target_view) {
  // Normalisasi target view: jika memanggil 'board' atau 'scrum-planning', arahkan ke 'project'
  let normalized_view = target_view;
  if (target_view === 'board') {
    normalized_view = 'project';
    switch_project_tab('board');
  } else if (target_view === 'scrum-planning') {
    normalized_view = 'project';
    switch_project_tab('planning');
  } else if (target_view === 'project') {
    switch_project_tab(app_state.current_project_tab || 'board');
  }

  const views = ['dashboard', 'project', 'insights', 'cycle-time', 'initiative-test', 'demand', 'settings', 'users'];
  
  views.forEach(view_name => {
    const section_el = document.getElementById('view-' + view_name);
    const nav_btn_el = document.getElementById('nav-btn-' + view_name);

    if (section_el) {
      if (view_name === normalized_view) {
        section_el.classList.remove('hidden');
        section_el.classList.add('block');
        if (view_name === 'insights') {
          if (app_state.insights) {
            render_insights_dashboard(app_state.insights);
          }
          load_sprint_insights();
        }
        if (view_name === 'cycle-time') {
          load_cycle_time_report();
        }
        if (view_name === 'initiative-test') {
          load_initiatives_list();
        }
        if (view_name === 'demand') {
          load_demands_list();
        }
        if (view_name === 'dashboard') {
          load_projects_list();
        }
        if (view_name === 'users') {
          load_users_management();
        }
      } else {
        section_el.classList.remove('block');
        section_el.classList.add('hidden');
      }
    }

    if (nav_btn_el) {
      if (view_name === normalized_view) {
        nav_btn_el.className = 'nav-tab-btn flex items-center w-full px-3 py-2.5 text-sm font-medium rounded-lg text-white bg-indigo-600/90 shadow-sm transition-colors group';

    }
  });

  app_state.current_view = target_view;
}

  if (found_task && found_task.sprint_id) {
    parent_sprint = found_task.sprint_id;
  }
  if (target_input) target_input.value = parent_sprint;

  const type_select = document.getElementById('input-task-work-type');
  if (type_select) type_select.value = 'SUBTASK';

  handle_work_type_change(parent_id);

}

/**
 * Mengelola perubahan pilihan Work Type di Modal Task:
 * - INITIATIVE (1): Sembunyikan selector parent (Inisiatif tidak punya parent).
 * - TASK / USER_STORY / BUG (0): Tampilkan selector parent Inisiatif (Level 1) - Opsional.
 * - SUBTASK (-1): Tampilkan selector parent Level 0 (Task/Story/Bug) - WAJIB.
 * @param {string} [preselected_parent_id] - ID parent yang otomatis terpilih
 */
function handle_work_type_change(preselected_parent_id) {
  const type_el = document.getElementById('input-task-work-type');
  const container_parent = document.getElementById('container-task-parent-select');
  const label_parent = document.getElementById('label-task-parent');
  const hint_parent = document.getElementById('hint-task-parent');
  const select_parent = document.getElementById('input-task-parent-id');

  if (!type_el || !container_parent) return;

  const work_type = type_el.value;

  if (work_type === 'INITIATIVE') {
    // Level 1: Inisiatif tidak boleh memiliki parent
    container_parent.classList.add('hidden');
    if (select_parent) {
      select_parent.required = false;
      select_parent.value = '';
    }
  } else if (work_type === 'SUBTASK') {
    // Level -1: Subtask WAJIB memiliki parent Level 0
    container_parent.classList.remove('hidden');
    if (label_parent) label_parent.innerHTML = 'Pilih Parent Work Item (Level 0: Task / Story / Bug) <span class="text-rose-500 font-bold">*</span>';
    if (hint_parent) hint_parent.textContent = 'Aturan Hirarki: 1 Subtask (-1) wajib memiliki 1 parent bertipe Task, User Story, atau Bug.';
    if (select_parent) select_parent.required = true;
    load_parent_dropdown_options('SUBTASK', preselected_parent_id);
  } else {
    // Level 0: Task, User Story, BUG - Opsional memiliki parent Inisiatif (Level 1)
    container_parent.classList.remove('hidden');
    if (label_parent) label_parent.textContent = 'Inisiatif Induk (Level 1: Sasaran Bisnis) - Opsional';
    if (hint_parent) hint_parent.textContent = 'Pilih inisiatif induk jika pekerjaan ini berhubungan langsung dengan inisiatif bisnis makro.';
    if (select_parent) select_parent.required = false;
    load_parent_dropdown_options('TASK', preselected_parent_id);
  }

  // Story Point hanya berlaku di work item hirarki 0 saja
  const story_points_group = document.getElementById('group-task-story-points');
  const story_points_input = document.getElementById('input-task-story-points');

  if (work_type === 'INITIATIVE' || work_type === 'SUBTASK') {
    if (story_points_group) story_points_group.classList.add('hidden');
    if (story_points_input) story_points_input.value = '';
  } else {
    // Level 0: Task, User Story, BUG -> Story Points aktif!
    if (story_points_group) story_points_group.classList.remove('hidden');
  }
}

/**
 * Mengambil daftar parent yang valid dari backend untuk dropdown modal
 */
function load_parent_dropdown_options(for_work_type, preselected_id) {
  const select_parent = document.getElementById('input-task-parent-id');
  if (!select_parent) return;

  select_parent.innerHTML = '<option value="">Memuat opsi parent...</option>';

  const prj_id = app_state.active_project_id || 'PRJ-001';

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (response && response.success && response.data) {
          populate_parent_select(response.data, for_work_type, preselected_id);
        } else {
          select_parent.innerHTML = '<option value="">Tidak ada parent yang memenuhi syarat</option>';
        }
      })
      .withFailureHandler(err => {
        select_parent.innerHTML = '<option value="">Gagal memuat: ' + err.message + '</option>';
      })
      .get_eligible_parents_for_task(prj_id, for_work_type);
  } else {
    // Mock simulation
    const mock_parents = [];
    if (for_work_type === 'SUBTASK') {
      (app_state.tasks || []).forEach(t => {
        if (!t.work_type || t.work_type === 'TASK' || t.work_type === 'USER_STORY' || t.work_type === 'BUG') {
          mock_parents.push({ id: t.id, title: t.title, work_type: t.work_type || 'TASK', hierarchy_level: 0 });
        }
      });
      (app_state.backlog_tasks || []).forEach(t => {
        if (!t.work_type || t.work_type === 'TASK' || t.work_type === 'USER_STORY' || t.work_type === 'BUG') {
          mock_parents.push({ id: t.id, title: t.title, work_type: t.work_type || 'TASK', hierarchy_level: 0 });
        }
      });
    } else {
      mock_parents.push({ id: 'TSK-000', title: 'Inisiatif Portal Delivery Multifinance', work_type: 'INITIATIVE', hierarchy_level: 1 });
    }
    populate_parent_select(mock_parents, for_work_type, preselected_id);
  }
}

function populate_parent_select(parents, for_work_type, preselected_id) {

/**
 * Menyisipkan HTML di posisi kursor aktif
 */
function insert_html_at_cursor(html_str) {
  const editor = document.getElementById('editor-task-description');
  if (!editor) return;
  editor.focus();

  const sel = window.getSelection();
  if (sel && sel.getRangeAt && sel.rangeCount) {
    let range = sel.getRangeAt(0);
    // Pastikan range berada di dalam editor
    if (!editor.contains(range.commonAncestorContainer)) {
      editor.focus();
      range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    }
    range.deleteContents();
    const temp_div = document.createElement('div');
    temp_div.innerHTML = html_str;
    const frag = document.createDocumentFragment();
    let node, last_node;
    while ((node = temp_div.firstChild)) {
      last_node = frag.appendChild(node);
    }
    range.insertNode(frag);
    if (last_node) {
      const new_range = range.cloneRange();
      new_range.setStartAfter(last_node);
      new_range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(new_range);
    }
  } else {
    document.execCommand('insertHTML', false, html_str);
  }
}

/**
 * Membuat tabel default NxM langsung ke dalam editor WYSIWYG
 */
function insert_editor_table(rows = 3, cols = 3) {
  let table_html = '<div class="overflow-x-auto my-2 border border-slate-200 rounded-lg"><table class="wysiwyg-table w-full border-collapse border border-slate-300 text-xs text-left"><thead><tr class="bg-slate-100 font-bold">';
  for (let c = 1; c <= cols; c++) {
    table_html += `<th class="border border-slate-300 px-3 py-1.5 text-slate-700 bg-slate-100">Kolom ${c}</th>`;
  }
  table_html += '</tr></thead><tbody>';
  for (let r = 1; r <= rows; r++) {
    table_html += '<tr class="even:bg-slate-50/50">';
    for (let c = 1; c <= cols; c++) {
      table_html += `<td class="border border-slate-300 px-3 py-1.5 text-slate-700 bg-white">Data ${r}-${c}</td>`;
    }
    table_html += '</tr>';
  }
  table_html += '</tbody></table></div><p><br></p>';
  insert_html_at_cursor(table_html);
}

/**
 * Manipulasi tabel aktif (Tambah baris, tambah kolom, hapus baris, hapus kolom)
 */
function editor_table_action(action) {
  const editor = document.getElementById('editor-task-description');
  if (!editor) return;

  const sel = window.getSelection();
  if (!sel || !sel.anchorNode) {
    show_notification('Arahkan kursor ke dalam salah satu sel tabel terlebih dahulu.', 'info');
    return;
  }

  let cell = sel.anchorNode;
  while (cell && cell !== editor && cell.nodeName !== 'TD' && cell.nodeName !== 'TH') {
    cell = cell.parentNode;
  }

  if (!cell || (cell.nodeName !== 'TD' && cell.nodeName !== 'TH')) {
    show_notification('Arahkan kursor ke dalam salah satu sel tabel terlebih dahulu.', 'info');
    return;
  }

  const row = cell.parentElement;
  const table = row ? row.closest('table') : null;
  if (!row || !table) return;

  const col_idx = Array.from(row.children).indexOf(cell);

  if (action === 'add-row') {
    const new_row = document.createElement('tr');
    new_row.className = 'even:bg-slate-50/50';
    const cell_count = row.children.length;
    for (let i = 0; i < cell_count; i++) {
      const new_td = document.createElement('td');
      new_td.className = 'border border-slate-300 px-3 py-1.5 text-slate-700 bg-white';
      new_td.innerHTML = '&nbsp;';
      new_row.appendChild(new_td);
    }
    row.insertAdjacentElement('afterend', new_row);
  } else if (action === 'del-row') {
    if (table.querySelectorAll('tr').length <= 1) {
      const container = table.closest('.overflow-x-auto') || table;
      container.remove();
    } else {
      row.remove();
    }
  } else if (action === 'add-col') {
    const all_rows = table.querySelectorAll('tr');
    all_rows.forEach(r => {
      const is_header = r.parentElement && r.parentElement.tagName === 'THEAD';
      const new_c = document.createElement(is_header ? 'th' : 'td');
      new_c.className = is_header 
        ? 'border border-slate-300 px-3 py-1.5 text-slate-700 bg-slate-100 font-bold'
        : 'border border-slate-300 px-3 py-1.5 text-slate-700 bg-white';
      new_c.innerHTML = is_header ? 'Kolom Baru' : '&nbsp;';
      if (col_idx >= 0 && col_idx < r.children.length) {
        r.children[col_idx].insertAdjacentElement('afterend', new_c);
      } else {
        r.appendChild(new_c);
      }
    });
  } else if (action === 'del-col') {
    const all_rows = table.querySelectorAll('tr');
    if (row.children.length <= 1) {
      const container = table.closest('.overflow-x-auto') || table;
      container.remove();
    } else {
      all_rows.forEach(r => {
        if (col_idx >= 0 && col_idx < r.children.length) {
          r.children[col_idx].remove();
        }
      });
    }
  }
}

/**
 * Pembersih HTML Tabel dari Microsoft Excel & Google Sheets
 * Menormalkan struktur tabel, menghapus namespace MSO berlebihan, dan membungkus dengan scroll responsif
 */
function sanitize_and_format_excel_html(raw_html) {
  if (!raw_html) return '';
  const parser = new DOMParser();
  const doc = parser.parseFromString(raw_html, 'text/html');
  const tables = doc.querySelectorAll('table');

  if (!tables || tables.length === 0) {
    return raw_html;
  }

  const container = document.createElement('div');

  tables.forEach(table => {
    const clean_table = document.createElement('table');
    clean_table.className = 'wysiwyg-table w-full border-collapse border border-slate-300 my-2 text-xs text-left';

    const trs = table.querySelectorAll('tr');
    const has_thead = table.querySelector('thead') !== null;
    const tbody = document.createElement('tbody');

    trs.forEach((tr, tr_idx) => {
      const clean_tr = document.createElement('tr');
      clean_tr.className = (tr_idx === 0 && !has_thead) ? 'bg-slate-100 font-bold' : 'even:bg-slate-50/50';

      const cells = tr.querySelectorAll('th, td');
      cells.forEach(c => {
        const is_th = c.tagName.toLowerCase() === 'th' || (tr_idx === 0 && !has_thead);
        const clean_c = document.createElement(is_th ? 'th' : 'td');
        clean_c.className = is_th
          ? 'border border-slate-300 bg-slate-100 px-3 py-1.5 font-bold text-slate-700 text-left'
          : 'border border-slate-300 px-3 py-1.5 text-slate-700 bg-white text-left';

        if (c.getAttribute('colspan')) clean_c.setAttribute('colspan', c.getAttribute('colspan'));
        if (c.getAttribute('rowspan')) clean_c.setAttribute('rowspan', c.getAttribute('rowspan'));

        clean_c.innerHTML = c.innerHTML.trim() || '&nbsp;';
        clean_tr.appendChild(clean_c);
      });

      tbody.appendChild(clean_tr);
    });

    clean_table.appendChild(tbody);

    const wrap = document.createElement('div');
    wrap.className = 'overflow-x-auto my-2 border border-slate-200 rounded-lg';
    wrap.appendChild(clean_table);
    container.appendChild(wrap);
  });

  return container.innerHTML;
}

/**
 * Konversi Plaintext TSV (Tab-Separated Values) dari Excel / Sheets menjadi HTML Table
 */
function convert_tsv_to_html_table(tsv_text) {
  if (!tsv_text) return '';
  const lines = tsv_text.split(/\r?\n/).filter(line => line.trim() !== '');
  if (lines.length === 0) return '';

  let table_html = '<div class="overflow-x-auto my-2 border border-slate-200 rounded-lg"><table class="wysiwyg-table w-full border-collapse border border-slate-300 text-xs text-left"><tbody>';

  lines.forEach((line, row_idx) => {
    const cols = line.split('\t');
    const is_head = (row_idx === 0);
    table_html += `<tr class="${is_head ? 'bg-slate-100 font-bold' : 'even:bg-slate-50/50'}">`;
    cols.forEach(col_val => {
      const clean_val = escape_html(col_val.trim()) || '&nbsp;';
      if (is_head) {
        table_html += `<th class="border border-slate-300 bg-slate-100 px-3 py-1.5 font-bold text-slate-700">${clean_val}</th>`;
      } else {
        table_html += `<td class="border border-slate-300 px-3 py-1.5 text-slate-700 bg-white">${clean_val}</td>`;
      }
    });
    table_html += '</tr>';
  });

  table_html += '</tbody></table></div><p><br></p>';
  return table_html;
}

/**
 * Pasang listener paste clipboard interceptor pada editor WYSIWYG
 */
function setup_wysiwyg_paste_listener() {
  const editor = document.getElementById('editor-task-description');
  if (!editor || editor.dataset.pasteListenerAttached === 'true') return;

  editor.dataset.pasteListenerAttached = 'true';

  editor.addEventListener('paste', function(e) {
    const clipboard_data = e.clipboardData || window.clipboardData;
    if (!clipboard_data) return;

    const html_data = clipboard_data.getData('text/html');
    const text_data = clipboard_data.getData('text/plain');

    // 1. Kasus Tabel HTML (dari Microsoft Excel Desktop, Excel Online, Google Sheets)
    if (html_data && (html_data.includes('<table') || html_data.includes('<tr'))) {
      e.preventDefault();
      const clean_html = sanitize_and_format_excel_html(html_data);
      insert_html_at_cursor(clean_html);
      return;
    }

    // 2. Kasus TSV Clipboard (Teks tab-delimited saat dicopy dari Excel / Sheets)
    if (text_data && text_data.includes('\t') && (text_data.includes('\n') || text_data.includes('\r'))) {
      e.preventDefault();
      const tsv_table = convert_tsv_to_html_table(text_data);
      insert_html_at_cursor(tsv_table);
      return;
    }

    // 3. Paste teks biasa tanpa tabel dibiarkan diproses secara native browser
  });
}

/**

 */

  if (!task_id) return;

    USER_STORY: '<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-700 border border-blue-200">🔵 Story (Level 0)</span>',
    TASK: '<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-sky-100 text-sky-700 border border-sky-200">🔷 Task (Level 0)</span>',
    BUG: '<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-rose-100 text-rose-700 border border-rose-200">🔴 Bug (Level 0)</span>',

    REVIEW: 'bg-amber-100 text-amber-700',

  };

      pts_el.textContent = task.story_points + ' pts';
      pts_container.classList.remove('hidden');

      pts_container.classList.add('hidden');

  if (updated_el) updated_el.textContent = task.updated_at ? task.updated_at.split('T')[0] : '-';

    edit_btn.style.display = can_edit ? 'inline-flex' : 'none';
  }

  modal.classList.remove('hidden');
}

  const task_id = app_state.current_detail_task_id;
  if (!task_id) return;

  let all_tasks = (app_state.tasks || []).concat(app_state.backlog_tasks || []);
  (app_state.sprints || []).forEach(sp => {
    all_tasks = all_tasks.concat(sp.tasks || []);
  });
  const task = all_tasks.find(t => String(t.id).trim() === String(task_id).trim());
  if (!task) return;

  close_task_detail_modal();
  open_task_modal_for_edit(task);
}

/**
 * Membuka Modal Task dalam Mode Edit Terisi Data Lengkap
 */
function open_task_modal_for_edit(task) {
  const modal = document.getElementById('modal-task');
  if (!modal) return;
  modal.classList.remove('hidden');

  setup_wysiwyg_paste_listener();

  const title_el = document.getElementById('modal-task-title');
  if (title_el) title_el.textContent = 'Edit Work Item (' + task.id + ')';

  const mode_badge = document.getElementById('modal-task-mode-badge');
  if (mode_badge) mode_badge.classList.remove('hidden');

  const id_input = document.getElementById('input-task-id');
  if (id_input) id_input.value = task.id;

  const target_input = document.getElementById('input-task-target-bucket');
  if (target_input) target_input.value = task.sprint_id || app_state.active_sprint_id;

  const title_input = document.getElementById('input-task-title');
  if (title_input) title_input.value = task.title || '';

  const est_input = document.getElementById('input-task-estimate');
  if (est_input) est_input.value = task.estimate_hours || 8;

  const pts_input = document.getElementById('input-task-story-points');
  if (pts_input) pts_input.value = task.story_points || '';

  const type_select = document.getElementById('input-task-work-type');
  if (type_select) type_select.value = String(task.work_type || 'TASK').toUpperCase();

  const editor = document.getElementById('editor-task-description');
  if (editor) editor.innerHTML = task.description || '';

  handle_work_type_change(task.parent_id);
  load_assignee_options();

  // Set selected assignee
  setTimeout(() => {
    const ass_select = document.getElementById('input-task-assignee');
    if (ass_select && task.assignee_id) ass_select.value = task.assignee_id;
  }, 100);

  const submit_btn = document.getElementById('btn-submit-task');
  if (submit_btn) submit_btn.textContent = 'Simpan Perubahan';
}

/**

function load_assignee_options() {

/**
 * Submit form pembuatan / update task ke Backend dengan validasi hirarki & deskripsi WYSIWYG
 */
function handle_submit_new_task(e) {
  e.preventDefault();
  const id_el = document.getElementById('input-task-id');
  const title_el = document.getElementById('input-task-title');
  const est_el = document.getElementById('input-task-estimate');
  const assignee_el = document.getElementById('input-task-assignee');
  const submit_btn = document.getElementById('btn-submit-task');
  const target_input = document.getElementById('input-task-target-bucket');
  const type_el = document.getElementById('input-task-work-type');
  const parent_el = document.getElementById('input-task-parent-id');
  const editor_el = document.getElementById('editor-task-description');
  const pts_el = document.getElementById('input-task-story-points');

  if (!title_el || !title_el.value.trim()) return;

  const is_edit = (id_el && id_el.value.trim() !== '');
  const task_id = is_edit ? id_el.value.trim() : '';
  const target_sprint = (target_input && target_input.value) ? target_input.value : app_state.active_sprint_id;
  const work_type = type_el ? type_el.value : 'TASK';
  const parent_id = parent_el ? parent_el.value.trim() : '';
  const description = editor_el ? editor_el.innerHTML.trim() : '';

  // Story Points hanya berlaku di work item hirarki 0 saja
  const is_level_0 = (work_type === 'USER_STORY' || work_type === 'TASK' || work_type === 'BUG');
  const story_points = (is_level_0 && pts_el) ? pts_el.value.trim() : '';

  // Validasi lokal sisi klien
  if (work_type === 'SUBTASK' && !parent_id) {
    show_notification('Validasi Gagal: Subtask (Level -1) wajib memiliki parent bertipe Task, User Story, atau Bug.', 'error');
    return;
  }

  const task_payload = {
    id: task_id,
    sprint_id: target_sprint,
    title: title_el.value.trim(),
    estimate_hours: Number(est_el ? est_el.value : 8) || 8,
    assignee_id: assignee_el ? assignee_el.value : '',
    work_type: work_type,
    parent_id: work_type === 'INITIATIVE' ? '' : parent_id,
    description: description,
    story_points: story_points
  };

  if (submit_btn) {
    submit_btn.disabled = true;
    submit_btn.textContent = is_edit ? 'Menyimpan Perubahan...' : 'Menyimpan...';
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    if (is_edit) {
      google.script.run
        .withSuccessHandler(response => {
          if (submit_btn) {
            submit_btn.disabled = false;
            submit_btn.textContent = 'Simpan Task';
          }
          if (response && response.success) {
            show_notification('Rincian work item (' + task_id + ') berhasil diperbarui!', 'success');
            close_task_modal();
            if (app_state.current_view === 'scrum-planning' || app_state.current_project_tab === 'planning') {
              load_scrum_planning_data();
            } else {
              load_sprint_tasks();
              load_sprint_insights();
            }
          } else {
            show_notification('Gagal memperbarui task: ' + (response ? response.message : ''), 'error');
          }
        })
        .withFailureHandler(err => {
          if (submit_btn) {
            submit_btn.disabled = false;
            submit_btn.textContent = 'Simpan Task';
          }
          show_notification('Error memperbarui task: ' + err.message, 'error');
        })
        .update_task_details(task_payload);
    } else {
      google.script.run
        .withSuccessHandler(response => {
          if (submit_btn) {
            submit_btn.disabled = false;
            submit_btn.textContent = 'Simpan Task';
          }
          if (response && response.success) {
            show_notification('Work item (' + work_type + ') berhasil dibuat!', 'success');
            close_task_modal();
            if (app_state.current_view === 'scrum-planning' || app_state.current_project_tab === 'planning') {
              load_scrum_planning_data();
            } else {
              load_sprint_tasks();
              load_sprint_insights();
            }
          } else {
            show_notification('Gagal membuat task: ' + (response ? response.message : ''), 'error');
          }
        })
        .withFailureHandler(err => {
          if (submit_btn) {
            submit_btn.disabled = false;
            submit_btn.textContent = 'Simpan Task';
          }
          show_notification('Error membuat task: ' + err.message, 'error');
        })
        .create_new_task(task_payload);
    }
  } else {
    // Mode simulasi lokal
    if (submit_btn) {
      submit_btn.disabled = false;
      submit_btn.textContent = 'Simpan Task';
    }
    if (is_edit) {
      let found = (app_state.tasks || []).find(t => t.id === task_id);
      if (!found) found = (app_state.backlog_tasks || []).find(t => t.id === task_id);
      (app_state.sprints || []).forEach(sp => {
        if (!found) found = (sp.tasks || []).find(t => t.id === task_id);
      });
      if (found) {
        found.title = task_payload.title;
        found.estimate_hours = task_payload.estimate_hours;
        found.work_type = task_payload.work_type;
        found.parent_id = task_payload.parent_id;
        found.description = task_payload.description;
        found.story_points = task_payload.story_points;
        found.updated_at = new Date().toISOString();
      }
      show_notification('Work item (' + task_id + ') berhasil diperbarui!', 'success');
    } else {
      const new_mock_task = {
        id: 'TSK-' + ('000' + (app_state.tasks.length + 1)).slice(-3),
        sprint_id: target_sprint,
        title: task_payload.title,
        status: 'TODO',
        assignee_name: 'Simulasi User',
        estimate_hours: task_payload.estimate_hours,
        work_type: work_type,
        hierarchy_level: work_type === 'INITIATIVE' ? 1 : (work_type === 'SUBTASK' ? -1 : 0),
        parent_id: task_payload.parent_id,
        description: task_payload.description,
        story_points: task_payload.story_points,
        subtask_count: 0,
        subtask_done_count: 0,
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      };

      if (task_payload.parent_id) {
        const parent_task = (app_state.tasks || []).find(t => t.id === task_payload.parent_id);
        if (parent_task) parent_task.subtask_count = (parent_task.subtask_count || 0) + 1;
      }

      if (target_sprint.startsWith('BACKLOG')) {
        app_state.backlog_tasks.push(new_mock_task);
      } else {
        app_state.tasks.push(new_mock_task);
      }
      show_notification('Work item (' + work_type + ') berhasil ditambahkan!', 'success');
    }

    if (app_state.current_view === 'scrum-planning' || app_state.current_project_tab === 'planning') {
      render_scrum_planning_view();
    } else {
      render_kanban_board();
    }
    close_task_modal();
  }
}

/**

function load_projects_list() {
  const container = document.getElementById('dashboard-project-list');
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (response && response.success) {
          app_state.projects = response.data || [];
          render_projects_dashboard(app_state.projects);
          update_header_project_dropdown(app_state.projects);

    render_projects_dashboard(app_state.projects || []);
    update_header_project_dropdown(app_state.projects || []);
  }
}

        <div class="flex items-center justify-between mb-2">

          <span class="text-[10px] font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">
            ${escape_html(prj.active_sprint_status === 'ACTIVE' ? 'Sprint Aktif' : (prj.active_sprint_status || 'Aktif'))}
          </span>
        </div>
        <h4 class="text-sm font-bold text-slate-800">${escape_html(prj.name || prj.id)}</h4>
        <p class="text-xs text-slate-500 mt-1">PIC: <strong>${escape_html(prj.pm_name || 'Project Manager')}</strong></p>
      </div>
      <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
        <span class="text-xs text-slate-500">Selesai: <strong>${prj.done_tasks || 0}/${prj.total_tasks || 0}</strong> Task</span>
        <div class="flex items-center space-x-1.5">
          <button type="button" class="btn-open-planning text-xs font-semibold text-indigo-700 hover:text-indigo-900 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1 rounded-md transition-colors cursor-pointer">
            Planning
          </button>
          <button type="button" class="btn-open-board text-xs font-bold text-slate-600 hover:text-slate-900 border border-slate-200 hover:bg-slate-50 px-2.5 py-1 rounded-md transition-colors cursor-pointer flex items-center space-x-1">
            <span>Board</span>
            <span>&rarr;</span>
          </button>
        </div>
      </div>
    `;

    // Pasang handler langsung tanpa rentan syntax error quote escaping
    const btn_plan = card.querySelector('.btn-open-planning');
    if (btn_plan) {
      btn_plan.onclick = () => select_project_and_open_planning(prj.id, prj.name, prj.active_sprint_id, prj.active_sprint_name);
    }
    const btn_board = card.querySelector('.btn-open-board');

    }

    container.appendChild(card);
  });
}

/**
 * Submit form inisialisasi project baru
 */
function handle_submit_new_project(e) {
  e.preventDefault();
  const name_el = document.getElementById('input-project-name');
  const sprint_el = document.getElementById('input-project-sprint');
  const duration_el = document.getElementById('input-sprint-duration');
  const goal_el = document.getElementById('input-sprint-goal');
  const mode_radio = document.querySelector('input[name="project_mode"]:checked');
  const submit_btn = document.getElementById('btn-submit-project');

  if (!name_el || !name_el.value.trim()) return;

  const mode = mode_radio ? mode_radio.value : 'KANBAN';
  const duration_weeks = duration_el ? Number(duration_el.value) : 2;

  const project_payload = {
    name: name_el.value.trim(),
    mode: mode,
    sprint_name: sprint_el && sprint_el.value.trim() ? sprint_el.value.trim() : 'Sprint 1 - Foundations',
    sprint_duration_weeks: duration_weeks,
    sprint_goal: goal_el ? goal_el.value.trim() : ''
  };

  if (submit_btn) {
    submit_btn.disabled = true;
    submit_btn.textContent = 'Membuat Project...';
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (submit_btn) {
          submit_btn.disabled = false;
          submit_btn.textContent = 'Buat & Buka Board';
        }
        if (response && response.success) {
          show_notification('Project ' + project_payload.name + ' (' + mode + ') berhasil dibuat!', 'success');
          close_project_modal();
          // Segarkan daftar project agar Dashboard Utama langsung terisi
          load_projects_list();
          if (mode === 'SCRUM') {
            select_project_and_open_planning(response.data.id, response.data.name, response.data.sprint_id, response.data.sprint_name);
          } else {
            select_project_and_open_board(response.data.id, response.data.name, response.data.sprint_id, response.data.sprint_name);
          }
        } else {
          show_notification('Gagal membuat project: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        if (submit_btn) {
          submit_btn.disabled = false;
          submit_btn.textContent = 'Buat & Buka Board';
        }
        show_notification('Error membuat project: ' + err.message, 'error');
      })
      .create_new_project(project_payload);
  } else {
    // Mode simulasi lokal
    if (submit_btn) {
      submit_btn.disabled = false;
      submit_btn.textContent = 'Buat & Buka Board';
    }
    const new_mock_prj = {
      id: 'PRJ-00' + (app_state.projects.length + 1),
      name: project_payload.name + (mode === 'SCRUM' ? ' (Scrum)' : ' (Kanban)'),
      pm_name: app_state.current_user ? app_state.current_user.name : 'PM',
      total_tasks: 0,
      done_tasks: 0
    };
    app_state.projects.push(new_mock_prj);
    close_project_modal();
    if (mode === 'SCRUM') {
      select_project_and_open_planning(new_mock_prj.id, new_mock_prj.name);
    } else {
      select_project_and_open_board(new_mock_prj.id, new_mock_prj.name);
    }
    show_notification('Project ' + mode + ' simulasi berhasil dibuat!', 'success');
  }
}

/**
 * Helper Sanitasi HTML String
 */
function escape_html(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/**
 * Memuat data Product Backlog dan daftar Sprint Buckets untuk proyek aktif
 */
function load_scrum_planning_data() {
  const prj_id = app_state.active_project_id || (app_state.projects && app_state.projects.length > 0 ? app_state.projects[0].id : 'PRJ-001');
  app_state.active_project_id = prj_id;

  // Jika sudah ada data sprint di memori, render langsung agar tidak blank saat menunggu respon backend
  if (app_state.sprints && app_state.sprints.length > 0) {
    render_scrum_planning_view();
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    set_loading_state(true);
    google.script.run
      .withSuccessHandler(response => {
        set_loading_state(false);
        if (response && response.success) {
          app_state.backlog_tasks = response.data.backlog_tasks || [];
          app_state.sprints = response.data.sprints || [];
          render_scrum_planning_view();
        } else {
          show_notification('Gagal memuat Scrum Backlog: ' + (response ? response.message : ''), 'error');
          render_scrum_planning_view();
        }
      })
      .withFailureHandler(err => {
        set_loading_state(false);
        show_notification('Error memuat Scrum Backlog: ' + err.message, 'error');
        render_scrum_planning_view();
      })
      .get_project_backlog_and_sprints(prj_id);
  } else {
    // Mode simulasi lokal
    app_state.backlog_tasks = [
      {
        id: 'TSK-B01',
        sprint_id: 'BACKLOG-' + prj_id,
        title: 'Desain Wireframe Product Backlog & Sprints',

        assignee_name: 'Siti Developer',
        estimate_hours: 6
      },
      {

    ];
