      }
    ];
    render_scrum_planning_view();
  }
}

/**
 * Helper Mengurutkan Task Berdasarkan Hirarki (Inisiatif 1 -> Story/Task/Bug 0 -> Subtask -1)
 * Memastikan Subtask selalu tampil menempel di bawah parent task-nya
 */
function sort_tasks_by_hierarchy(tasks) {
  if (!tasks || tasks.length <= 1) return tasks || [];

  const task_map = {};
  const children_map = {};
  const root_tasks = [];

  tasks.forEach(t => {
    task_map[t.id] = t;
  });

  tasks.forEach(t => {
    if (t.parent_id && task_map[t.parent_id]) {
      if (!children_map[t.parent_id]) children_map[t.parent_id] = [];
      children_map[t.parent_id].push(t);
    } else {
      root_tasks.push(t);
    }
  });

  // Urutkan root tasks: Level 1 (Inisiatif) dahulu, lalu Level 0
  root_tasks.sort((a, b) => {
    const lvl_a = Number(a.hierarchy_level !== undefined ? a.hierarchy_level : 0);
    const lvl_b = Number(b.hierarchy_level !== undefined ? b.hierarchy_level : 0);
    if (lvl_b !== lvl_a) return lvl_b - lvl_a;
    return String(a.id).localeCompare(String(b.id));
  });

  const result = [];
  function append_branch(item) {
    result.push(item);
    const children = children_map[item.id] || [];
    children.sort((a, b) => {
      const lvl_a = Number(a.hierarchy_level !== undefined ? a.hierarchy_level : 0);
      const lvl_b = Number(b.hierarchy_level !== undefined ? b.hierarchy_level : 0);
      if (lvl_b !== lvl_a) return lvl_b - lvl_a;
      return String(a.id).localeCompare(String(b.id));
    });
    children.forEach(child => append_branch(child));
  }

  root_tasks.forEach(rt => append_branch(rt));

  // Sertakan task sisa jika ada edge case
  tasks.forEach(t => {
    if (!result.includes(t)) result.push(t);
  });

  return result;
}

/**
 * Merender seluruh tampilan Scrum Planning (Wadah Backlog dan Sprints)
 */
function render_scrum_planning_view() {
  const current_user = app_state.current_user || {};
  const perms = current_user.permissions || (typeof DEFAULT_ROLE_PERMS !== 'undefined' ? DEFAULT_ROLE_PERMS[current_user.role] : {}) || {};
  const is_admin_or_pm = !current_user.role || current_user.role === 'ADMIN' || current_user.role === 'PM';
  const can_edit = is_admin_or_pm || perms.can_move_task !== false;

  const backlog_tasks = app_state.backlog_tasks || [];
  const sprints = app_state.sprints || [];

  // Hitung relasi subtask di seluruh bucket Scrum
  const all_planning_tasks = [...backlog_tasks];
  sprints.forEach(sp => (sp.tasks || []).forEach(t => all_planning_tasks.push(t)));
  const subtask_counts = {};
  const subtask_done_counts = {};
  all_planning_tasks.forEach(t => {
    if (t.parent_id) {
      subtask_counts[t.parent_id] = (subtask_counts[t.parent_id] || 0) + 1;
      if (String(t.status || '').toUpperCase() === 'DONE') {
        subtask_done_counts[t.parent_id] = (subtask_done_counts[t.parent_id] || 0) + 1;
      }
    }
  });

  all_planning_tasks.forEach(t => {
    t.subtask_count = subtask_counts[t.id] || 0;
    t.subtask_done_count = subtask_done_counts[t.id] || 0;
  });

  // 1. Render Product Backlog Bucket
  const backlog_container = document.getElementById('bucket-product-backlog');
  const backlog_count_el = document.getElementById('scrum-backlog-count');
  const backlog_hours_el = document.getElementById('scrum-backlog-hours');

  let total_backlog_hours = 0;
  backlog_tasks.forEach(t => total_backlog_hours += (Number(t.estimate_hours) || 0));

  if (backlog_count_el) backlog_count_el.textContent = backlog_tasks.length + ' task';
  if (backlog_hours_el) backlog_hours_el.textContent = total_backlog_hours + ' Jam Scope';

  if (backlog_container) {
    backlog_container.innerHTML = '';
    if (backlog_tasks.length === 0) {
      backlog_container.innerHTML = `
        <div class="p-8 text-center border-2 border-dashed border-slate-200 rounded-xl text-xs text-slate-400 flex flex-col items-center">
          <span class="mb-1 text-slate-600 font-medium">Belum ada task di Backlog.</span>
          <span class="text-slate-400 mb-3">Isi task perencanaan terlebih dahulu sebelum dimasukkan ke sprint.</span>
          <button 
            type="button" 
            onclick="open_backlog_task_modal()" 
            class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-xs transition-colors cursor-pointer flex items-center space-x-1.5">
            <span>+ Tambah Task ke Backlog</span>
          </button>
        </div>
      `;
    } else {
      const sorted_backlog = sort_tasks_by_hierarchy(backlog_tasks);
      sorted_backlog.forEach(task => {
        const card = create_bucket_task_card_element(task, 'BACKLOG', can_edit);
        backlog_container.appendChild(card);
      });
    }
  }

  // 2. Render Sprint Buckets
  const sprints_container = document.getElementById('scrum-sprint-buckets-container');
  if (!sprints_container) return;

  sprints_container.innerHTML = '';

  if (sprints.length === 0) {
    sprints_container.innerHTML = `
      <div class="p-8 bg-white border border-dashed border-slate-200 rounded-2xl text-center text-xs text-slate-400 flex flex-col items-center">
        <span class="mb-1 text-slate-600 font-medium">Belum ada bucket sprint untuk proyek ini.</span>
        <span class="text-slate-400 mb-3">Buat bucket sprint baru untuk mulai mendistribusikan task dari Backlog.</span>
        <button 
          type="button" 
          onclick="open_new_sprint_modal()" 
          class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-xs transition-colors cursor-pointer flex items-center space-x-1.5">
          <span>+ Buat Sprint Baru</span>
        </button>
      </div>
    `;
    return;
  }

  sprints.forEach(sp => {
    const sp_card = document.createElement('div');
    sp_card.className = 'bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden';
    
    let total_sp_hours = 0;
    (sp.tasks || []).forEach(t => total_sp_hours += (Number(t.estimate_hours) || 0));

    const sp_status = String(sp.status || 'PLANNING').toUpperCase();
    let status_badge_html = '';
    let action_btn_html = '';

    if (sp_status === 'ACTIVE') {
      status_badge_html = `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">● Aktif Berjalan</span>`;
      if (can_edit) {
        action_btn_html = `
          <button 
            type="button" 
            onclick="open_complete_sprint_modal('${sp.id}')" 
            class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow-sm transition-colors flex items-center space-x-1 cursor-pointer">
            <span>🏁 Selesaikan Sprint</span>
          </button>
        `;
      }
    } else if (sp_status === 'COMPLETED') {
      status_badge_html = `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-slate-200 text-slate-700 border border-slate-300">✓ Selesai</span>`;
      action_btn_html = '';
    } else {
      status_badge_html = `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-300">Draft Planning</span>`;
      if (can_edit) {
        action_btn_html = `
          <button 
            type="button" 
            onclick="open_start_sprint_modal('${sp.id}')" 
            class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold shadow-sm transition-colors flex items-center space-x-1 cursor-pointer">
            <span>🚀 Start Sprint</span>
          </button>
        `;
      }
    }

    sp_card.innerHTML = `
      <div class="p-4 bg-slate-50/90 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div class="flex items-center space-x-3">
          <span class="w-3 h-3 rounded-full ${sp_status === 'ACTIVE' ? 'bg-emerald-500' : (sp_status === 'COMPLETED' ? 'bg-slate-400' : 'bg-indigo-500')}"></span>
          <div>
            <div class="flex items-center space-x-2">
              <h4 class="text-sm font-bold text-slate-800">${escape_html(sp.name)}</h4>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 border border-indigo-200">${sp.id}</span>
              ${status_badge_html}
            </div>
            <p class="text-[11px] text-slate-400">${sp.start_date || '-'} s/d ${sp.end_date || '-'}</p>
          </div>
        </div>

        <div class="flex items-center space-x-3">
          <span class="text-xs font-semibold text-slate-600 bg-white px-2.5 py-1 rounded-lg border border-slate-200">
            ${(sp.tasks || []).length} Task • ${total_sp_hours} Jam
          </span>
          ${action_btn_html}
        </div>
      </div>

      <div 
        id="bucket-sprint-${sp.id}" 
        data-bucket-id="${sp.id}"
        ${sp_status !== 'COMPLETED' ? `
        ondragover="handle_bucket_drag_over(event)" 
        ondragleave="handle_bucket_drag_leave(event)" 
        ondrop="handle_bucket_drop(event, '${sp.id}')"
        ` : ''}
        class="bucket-droppable-area p-4 space-y-2.5 min-h-[120px] bg-slate-50/30 transition-colors">
      </div>
    `;

    sprints_container.appendChild(sp_card);

    const task_list_container = sp_card.querySelector('#bucket-sprint-' + sp.id);
    if (task_list_container) {
      if (!sp.tasks || sp.tasks.length === 0) {
        task_list_container.innerHTML = `
          <div class="p-5 text-center border border-dashed border-slate-200 rounded-xl text-xs text-slate-400">
            ${sp_status === 'COMPLETED' ? 'Tidak ada task di sprint yang telah selesai ini.' : 'Tarik (Drag) task dari Product Backlog ke sini, atau gunakan menu dropdown pada kartu task.'}
          </div>
        `;
      } else {
        const sorted_sp_tasks = sort_tasks_by_hierarchy(sp.tasks);
        sorted_sp_tasks.forEach(task => {
          const card = create_bucket_task_card_element(task, sp.id, can_edit && sp_status !== 'COMPLETED');
          task_list_container.appendChild(card);
        });
      }
    }
  });
}

/**
 * Membuat elemen kartu task pada Bucket Scrum
 * Tampilan Responsif 3-Baris Rapi (Header, Judul Bebas Bentrok, Footer Terstruktur)
 * Mendukung visual indentasi untuk Subtask (-1) dan border tebal untuk Inisiatif (1)
 */
function create_bucket_task_card_element(task, source_bucket_id, can_edit) {
  const card = document.createElement('div');
  card.id = 'bucket-task-' + task.id;

  const work_type = String(task.work_type || 'TASK').toUpperCase();
  const is_subtask = (work_type === 'SUBTASK' || Number(task.hierarchy_level) === -1);
  const is_initiative = (work_type === 'INITIATIVE' || Number(task.hierarchy_level) === 1);
  const is_level_0 = (!is_subtask && !is_initiative);

  // Styling kartu terstruktur tanpa tumpang tindih
  let card_classes = 'p-3 bg-white rounded-xl border border-slate-200 shadow-xs hover:shadow-md transition-all flex flex-col gap-2 relative';
  if (is_subtask) {
    // Indentasi visual untuk subtask agar tampak bersarang di bawah parent
    card_classes = 'p-2.5 bg-slate-50/80 rounded-xl border border-dashed border-slate-300 ml-4 sm:ml-6 border-l-4 border-l-indigo-400 hover:border-indigo-400 hover:bg-white shadow-none transition-all flex flex-col gap-2 relative';
  } else if (is_initiative) {
    // Kartu inisiatif makro
    card_classes = 'p-3 bg-purple-50/20 rounded-xl border-2 border-purple-200 hover:border-purple-300 shadow-xs hover:shadow-md transition-all flex flex-col gap-2 relative';
  }

  if (can_edit) {
    card_classes += ' cursor-grab active:cursor-grabbing hover:border-indigo-300';
    card.draggable = true;
    card.ondragstart = (e) => handle_bucket_drag_start(e, task.id, source_bucket_id);
    card.ondragend = (e) => handle_bucket_drag_end(e);
  }
  card.className = card_classes;

  // Work Type Badge
  const work_type_badge_map = {
    INITIATIVE: '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-purple-100 text-purple-700 border border-purple-200 flex-shrink-0">🟣 Inisiatif</span>',
    USER_STORY: '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-blue-100 text-blue-700 border border-blue-200 flex-shrink-0">🔵 Story</span>',
    TASK: '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-sky-100 text-sky-700 border border-sky-200 flex-shrink-0">🔷 Task</span>',
    BUG: '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-rose-100 text-rose-700 border border-rose-200 flex-shrink-0">🔴 Bug</span>',
    SUBTASK: '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-200 flex-shrink-0">⚪ Subtask</span>'
  };
  const work_type_badge = work_type_badge_map[work_type] || work_type_badge_map.TASK;

  // Parent Tag jika ini adalah subtask atau task bertaut
  let parent_tag_html = '';
  if (task.parent_id) {
    parent_tag_html = `
      <span class="text-[9px] font-mono text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200 flex items-center space-x-0.5 flex-shrink-0" title="Parent Work Item: ${escape_html(task.parent_id)}">
        <span class="text-indigo-500 font-bold">↳</span>
        <span>${escape_html(task.parent_id)}</span>
      </span>
    `;
  }

  // Quick "+ Subtask" button untuk item Level 0
  let quick_subtask_btn = '';
  if (can_edit && is_level_0) {
    quick_subtask_btn = `
      <button 
        type="button" 
        onclick="event.stopPropagation(); open_subtask_modal('${escape_html(task.id)}', '${escape_html(task.title)}')" 
        title="Tambah Subtask untuk ${escape_html(task.id)}"
        class="text-[10px] text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50 px-2 py-0.5 rounded border border-indigo-200 font-semibold transition-colors cursor-pointer flex items-center space-x-1 flex-shrink-0">
        <span>+ Subtask</span>
      </button>
    `;
  }

  // Subtask Progress Pill jika punya subtask
  let subtask_progress_pill = '';
  if (task.subtask_count && task.subtask_count > 0) {
    subtask_progress_pill = `
      <span class="text-[10px] font-semibold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-200 flex items-center space-x-1 flex-shrink-0" title="${task.subtask_count} subtask terhubung (akan ikut berpindah otomatis)">
        <span class="text-[9px]">📦</span>
        <span>${task.subtask_count} Subtask</span>
      </span>
    `;
  }

  // Quick Move Selector (Pindah dengan 1 Klik)
  let move_options_html = '';
  if (can_edit) {
    const available_sprints = app_state.sprints || [];
    let options = '<option value="" disabled selected>Pindahkan...</option>';
    if (source_bucket_id !== 'BACKLOG') {
      options += '<option value="BACKLOG">↩ Ke Backlog</option>';

    available_sprints.forEach(sp => {
      if (sp.id !== source_bucket_id && String(sp.status || '').toUpperCase() !== 'COMPLETED') {
        options += `<option value="${sp.id}">➔ ${escape_html(sp.name || sp.id)}</option>`;
      }
    });

    move_options_html = `
      <div class="flex items-center space-x-1 flex-shrink-0" onclick="event.stopPropagation()">
        <select 
          title="Pindahkan task beserta subtask-nya"
          onchange="handle_quick_move_task('${task.id}', '${source_bucket_id}', this.value)"
          class="text-[10px] bg-slate-50 hover:bg-slate-100 border border-slate-300 rounded px-2 py-1 text-slate-700 font-medium focus:ring-1 focus:ring-indigo-500 focus:outline-none cursor-pointer">
          ${options}
        </select>
      </div>
    `;
  }

  // Klik kartu untuk membuka detail & deskripsi WYSIWYG
  card.onclick = (e) => {
    if (!e.target.closest('button') && !e.target.closest('select')) {
      open_task_detail_modal(task.id);
    }
  };

  const has_desc = Boolean(task.description && String(task.description).trim() !== '');
  const desc_icon = has_desc 
    ? '<span class="text-[10px] text-indigo-500 font-semibold flex-shrink-0 cursor-pointer" title="Memiliki rincian spesifikasi / tabel">📝</span>' 
    : '';

  // Desain Kartu 3-Baris: Terisolasi, Lebar Bebas, Bersih dari Tumpang Tindih
  card.innerHTML = `
    <!-- Baris 1: Header (Drag Icon, ID, Work Type, Parent Tag, Quick Move Dropdown) -->
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center gap-1.5 flex-wrap min-w-0">
        <div class="text-slate-400 hover:text-slate-600 cursor-grab pointer-events-none p-0.5 flex-shrink-0" title="Geser kartu">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"/></svg>
        </div>
        <span class="text-[10px] font-bold font-mono text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-200 flex-shrink-0">
          ${task.id}
        </span>
        ${work_type_badge}
        ${parent_tag_html}
      </div>
      <div class="flex items-center gap-1 flex-shrink-0">
        ${move_options_html}
      </div>
    </div>

    <!-- Baris 2: Judul Tugas (Lebar penuh, mudah dibaca, tidak bertumpuk) -->
    <div class="pl-4 cursor-pointer">
      <h5 class="text-xs font-semibold text-slate-800 leading-snug line-clamp-2 hover:text-indigo-600 transition-colors flex items-center gap-1.5" title="Klik untuk melihat detail & deskripsi">
        <span>${escape_html(task.title)}</span>
        ${desc_icon}
      </h5>
    </div>

    <!-- Baris 3: Footer (PIC, Subtask Pill, + Subtask, Estimasi Jam & Detail) -->
    <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-100 pl-4 text-[11px]">
      <div class="flex items-center space-x-1.5 min-w-0 text-slate-500">
        <div class="w-4 h-4 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-[9px] font-bold flex-shrink-0">
          ${(task.assignee_name || 'U').charAt(0).toUpperCase()}
        </div>
        <span class="truncate max-w-[120px] text-[10px] text-slate-600" title="${escape_html(task.assignee_name || '')}">
          ${escape_html(task.assignee_name || 'Belum Ditugaskan')}
        </span>
      </div>

      <div class="flex items-center gap-1.5 flex-shrink-0">
        ${subtask_progress_pill}
        ${quick_subtask_btn}
        <button 
          type="button" 
          onclick="event.stopPropagation(); open_task_detail_modal('${escape_html(task.id)}')" 
          title="Buka rincian spesifikasi & tabel task"
          class="text-[10px] text-slate-500 hover:text-indigo-600 hover:bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200 transition-colors cursor-pointer">
          Detail ↗
        </button>
        ${task.story_points && is_level_0 ? `<span class="text-[10px] font-bold text-indigo-700 bg-indigo-50 border border-indigo-200 px-1.5 py-0.5 rounded" title="Story Point">${escape_html(task.story_points)} pts</span>` : ''}
        <span class="text-[10px] font-bold text-slate-700 bg-slate-100 px-2 py-0.5 rounded border border-slate-200 flex items-center gap-1 select-none">
          <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          ${task.estimate_hours || 0} Jam
        </span>
      </div>
    </div>
  `;

  return card;
}

/**
 * Logika HTML5 Drag & Drop Antar Bucket
 */
let current_bucket_drag_data = null;

function handle_bucket_drag_start(e, task_id, source_bucket_id) {
  current_bucket_drag_data = { task_id: task_id, source_bucket_id: source_bucket_id };
  e.dataTransfer.setData('text/plain', JSON.stringify(current_bucket_drag_data));
  e.dataTransfer.effectAllowed = 'move';
  const target_card = document.getElementById('bucket-task-' + task_id);
  if (target_card) target_card.classList.add('opacity-40');

  // Fade out juga kartu-kartu subtask yang bertaut agar user tahu mereka ikut dipindahkan
  const all_tasks = [...(app_state.backlog_tasks || [])];
  (app_state.sprints || []).forEach(sp => (sp.tasks || []).forEach(t => all_tasks.push(t)));
  all_tasks.forEach(t => {
    if (t.parent_id === task_id) {
      const sub_card = document.getElementById('bucket-task-' + t.id);
      if (sub_card) sub_card.classList.add('opacity-40');
    }
  });
}

function handle_bucket_drag_end(e) {
  document.querySelectorAll('[id^="bucket-task-"]').forEach(el => {
    el.classList.remove('opacity-40');
  });
  document.querySelectorAll('.bucket-droppable-area').forEach(el => {
    el.classList.remove('bg-indigo-50', 'ring-2', 'ring-indigo-300');
  });
  current_bucket_drag_data = null;
}

function handle_bucket_drag_over(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const drop_zone = e.currentTarget;
  if (drop_zone) {

/**
 * Eksekutor Pemindahan Task antar Bucket (Digunakan oleh Drag-and-Drop & Quick Select)
 * Mendukung Pemindahan Sepaket (Bundled Hierarchy Move):
 * Saat memindahkan task Level 0 atau 1, seluruh subtask (-1) ikut dipindahkan ke bucket tujuan
 */
function execute_move_task(task_id, source_bucket_id, target_bucket_id) {
  if (!task_id || !target_bucket_id || source_bucket_id === target_bucket_id) return;

  // Tentukan sprint_id di database sheet Tasks
  const target_sprint_id = (target_bucket_id === 'BACKLOG')
    ? ('BACKLOG-' + app_state.active_project_id)
    : target_bucket_id;

  // 1. Kumpulkan seluruh task dalam memori
  const all_tasks_pool = [
    ...(app_state.backlog_tasks || []),
    ...((app_state.sprints || []).flatMap(sp => sp.tasks || []))
  ];

  const main_task = all_tasks_pool.find(t => t.id === task_id);
  if (!main_task) return;

  // 2. Kumpulkan task utama beserta seluruh subtask/turunannya (sepaket)
  const tasks_to_move = [main_task];
  const main_level = Number(main_task.hierarchy_level !== undefined ? main_task.hierarchy_level : 0);

  if (main_level === 1) {
    // Level 1 (Inisiatif): kumpulkan semua anak Level 0 dan subtask Level -1
    const child_level_0 = all_tasks_pool.filter(t => t.parent_id === main_task.id);
    const child_l0_ids = child_level_0.map(t => t.id);
    const child_subtasks = all_tasks_pool.filter(t => t.parent_id && child_l0_ids.includes(t.parent_id));

    child_level_0.forEach(c => { if (!tasks_to_move.includes(c)) tasks_to_move.push(c); });
    child_subtasks.forEach(s => { if (!tasks_to_move.includes(s)) tasks_to_move.push(s); });
  } else if (main_level === 0) {
    // Level 0 (Story, Task, Bug): kumpulkan semua subtask (Level -1) yang bertaut padanya
    const subtasks = all_tasks_pool.filter(t => t.parent_id === main_task.id);
    subtasks.forEach(s => { if (!tasks_to_move.includes(s)) tasks_to_move.push(s); });
  }

  const moved_ids = tasks_to_move.map(t => t.id);

  // 3. Cabut semua tasks_to_move dari seluruh bucket asal (Backlog & Sprints)
  if (app_state.backlog_tasks) {
    app_state.backlog_tasks = app_state.backlog_tasks.filter(t => !moved_ids.includes(t.id));
  }
  (app_state.sprints || []).forEach(sp => {
    if (sp.tasks) {
      sp.tasks = sp.tasks.filter(t => !moved_ids.includes(t.id));
    }
  });

  // 4. Masukkan seluruh tasks_to_move ke bucket tujuan
  tasks_to_move.forEach(t => {
    t.sprint_id = target_sprint_id;
  });

  if (target_bucket_id === 'BACKLOG') {
    if (!app_state.backlog_tasks) app_state.backlog_tasks = [];
    app_state.backlog_tasks.push(...tasks_to_move);
  } else {
    const target_sp = (app_state.sprints || []).find(s => s.id === target_bucket_id);
    if (target_sp) {
      if (!target_sp.tasks) target_sp.tasks = [];
      target_sp.tasks.push(...tasks_to_move);
    }
  }

  // 5. Hitung ulang total_hours untuk seluruh sprint
  (app_state.sprints || []).forEach(sp => {
    let hrs = 0;
    (sp.tasks || []).forEach(t => hrs += (Number(t.estimate_hours) || 0));
    sp.total_hours = hrs;
  });

  // 6. Optimistic UI re-render
  render_scrum_planning_view();

  const subtask_count = tasks_to_move.length - 1;
  const target_name = target_bucket_id === 'BACKLOG' ? 'Product Backlog' : target_bucket_id;
  if (subtask_count > 0) {
    show_notification(`Task ${task_id} beserta ${subtask_count} subtask/turunan berhasil dipindahkan ke ${target_name}.`, 'success');
  } else {
    show_notification(`Task ${task_id} berhasil dipindahkan ke ${target_name}.`, 'success');
  }

  // 7. Sync ke Backend GAS
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (!response || !response.success) {
          show_notification('Gagal sinkron alokasi task: ' + (response ? response.message : ''), 'error');
          load_scrum_planning_data();
        }
      })
      .withFailureHandler(err => {
        show_notification('Error sinkron alokasi task: ' + err.message, 'error');
        load_scrum_planning_data();
      })
      .move_task_to_sprint(task_id, target_sprint_id);
  }
}

/**
 * Membuka Modal Selesaikan Sprint
 * @param {string} [sprint_id] - ID sprint yang akan diselesaikan
 */
function open_complete_sprint_modal(sprint_id) {
  const target_id = sprint_id || app_state.active_sprint_id;
  const modal = document.getElementById('modal-complete-sprint');
  if (!modal) return;

  const hidden_input = document.getElementById('complete-sprint-id');
  if (hidden_input) hidden_input.value = target_id;

  const subtitle = document.getElementById('complete-sprint-subtitle');
  if (subtitle) {
    let sp_display_name = target_id;
    if (app_state.sprints && app_state.sprints.length > 0) {
      const found = app_state.sprints.find(s => s.id === target_id);
      if (found && found.name) sp_display_name = found.name;
    } else {
      const header_sp = document.getElementById('header-sprint-name');
      if (header_sp) sp_display_name = header_sp.textContent;
    }
    subtitle.textContent = `Menyelesaikan ${sp_display_name} (${target_id}). Tinjau hasil dan alihkan task yang belum selesai.`;
  }

  // Hitung jumlah task DONE vs Belum Selesai (TODO, IN_PROGRESS, REVIEW)
  let done_count = 0;
  let incomplete_count = 0;

  let found_sp = null;
  if (app_state.sprints && app_state.sprints.length > 0) {
    found_sp = app_state.sprints.find(s => s.id === target_id);
  }

  if (found_sp && found_sp.tasks) {
    found_sp.tasks.forEach(t => {
      if (String(t.status).toUpperCase() === 'DONE') done_count++;
      else incomplete_count++;
    });
  } else if (app_state.tasks && app_state.tasks.length > 0) {
    app_state.tasks.forEach(t => {
      if (String(t.sprint_id).trim() === String(target_id).trim()) {
        if (String(t.status).toUpperCase() === 'DONE') done_count++;
        else incomplete_count++;
      }
    });
  }

  const done_el = document.getElementById('complete-sprint-done-count');
  const inc_el = document.getElementById('complete-sprint-incomplete-count');
  if (done_el) done_el.textContent = `${done_count} Task`;
  if (inc_el) inc_el.textContent = `${incomplete_count} Task`;

  // Isi pilihan dropdown Sprint Berikutnya
  const target_select = document.getElementById('complete-sprint-target-select');
  if (target_select) {
    target_select.innerHTML = '<option value="__NEW__">+ Buat Sprint Baru Otomatis</option>';
    if (app_state.sprints && app_state.sprints.length > 0) {
      app_state.sprints.forEach(sp => {
        if (sp.id !== target_id && String(sp.status || '').toUpperCase() !== 'COMPLETED') {
          const opt = document.createElement('option');
          opt.value = sp.id;
          opt.textContent = `${sp.name || sp.id} (${sp.id}) - ${sp.status || 'Draft'}`;
          target_select.appendChild(opt);
        }
      });
    }
  }

  // Reset radio dan opsi default
  const radio_next = document.querySelector('input[name="rollover_dest"][value="NEXT_SPRINT"]');
  if (radio_next) radio_next.checked = true;
  toggle_complete_sprint_dest_options();

  const name_input = document.getElementById('complete-sprint-new-name');
  if (name_input) {
    const next_num = (app_state.sprints ? app_state.sprints.length : 1) + 1;
    name_input.value = `Sprint ${next_num} (Planning)`;
  }
  toggle_complete_sprint_new_name_field();

  modal.classList.remove('hidden');
}

 */

  const sprint_id = document.getElementById('complete-sprint-id').value;
  if (!sprint_id) return;

  const selected_dest = document.querySelector('input[name="rollover_dest"]:checked');

  const payload = {

    rollover_destination: rollover_destination,
    target_sprint_id: target_sprint_id,
    new_sprint_name: new_sprint_name
  };

    submit_btn.disabled = true;
    submit_btn.innerHTML = '<span>Menyelesaikan Sprint...</span>';
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    set_loading_state(true);
    google.script.run
      .withSuccessHandler(response => {
        set_loading_state(false);
        if (submit_btn) {
          submit_btn.disabled = false;
          submit_btn.innerHTML = '<span>🏁 Selesaikan Sprint Sekarang</span>';
        }
        if (response && response.success) {
          show_notification(response.message, 'success');
          close_complete_sprint_modal();
          load_projects_list();
          if (app_state.active_project_id) {
            load_scrum_planning_data();
          }
          switch_view('scrum-planning');
        } else {
          show_notification('Gagal menyelesaikan sprint: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        set_loading_state(false);
        if (submit_btn) {
          submit_btn.disabled = false;
          submit_btn.innerHTML = '<span>🏁 Selesaikan Sprint Sekarang</span>';
        }
        show_notification('Error menyelesaikan sprint: ' + err.message, 'error');
      })
      .complete_sprint(payload);
  } else {
    // Mode simulasi lokal
    if (submit_btn) {
      submit_btn.disabled = false;
      submit_btn.innerHTML = '<span>🏁 Selesaikan Sprint Sekarang</span>';
    }
    if (app_state.sprints) {
      const sp = app_state.sprints.find(s => s.id === sprint_id);
      if (sp) sp.status = 'COMPLETED';
    }
    close_complete_sprint_modal();
    show_notification('Sprint ' + sprint_id + ' simulasi berhasil diselesaikan!', 'success');
    render_scrum_planning_view();
  }
}

  const formatted_role = String(role || 'MEMBER').toUpperCase().trim();
  const perms = DEFAULT_ROLE_PERMS[formatted_role] || DEFAULT_ROLE_PERMS.MEMBER;

  const cb_create_proj = document.getElementById('perm-can-create-project');
  const cb_manage_spr = document.getElementById('perm-can-manage-sprint');
  const cb_create_task = document.getElementById('perm-can-create-task');
  const cb_move_task = document.getElementById('perm-can-move-task');
  const cb_view_insights = document.getElementById('perm-can-view-insights');
  const cb_view_cycle_time = document.getElementById('perm-can-view-cycle-time');
  const cb_test_init = document.getElementById('perm-can-test-initiative');
  const cb_manage_dem = document.getElementById('perm-can-manage-demand');
  const cb_manage_users = document.getElementById('perm-can-manage-users');

  if (cb_create_proj) cb_create_proj.checked = perms.can_create_project;
  if (cb_manage_spr) cb_manage_spr.checked = perms.can_manage_sprint;
  if (cb_create_task) cb_create_task.checked = perms.can_create_task;
  if (cb_move_task) cb_move_task.checked = perms.can_move_task;
  if (cb_view_insights) cb_view_insights.checked = perms.can_view_insights;
  if (cb_view_cycle_time) cb_view_cycle_time.checked = perms.can_view_cycle_time !== false;

/**
 * Membuka Modal Tambah atau Edit Pengguna
 */
function open_user_modal(mode, user_id) {
  const modal = document.getElementById('modal-user-form');
  if (!modal) return;

  const mode_input = document.getElementById('input-user-mode');
  const id_input = document.getElementById('input-user-id');
  const name_input = document.getElementById('input-user-name');
  const email_input = document.getElementById('input-user-email');
  const role_select = document.getElementById('input-user-role');
  const title_el = document.getElementById('modal-user-form-title');
  const submit_label = document.getElementById('btn-submit-user-label');

  if (mode === 'create') {
    if (mode_input) mode_input.value = 'create';
    if (id_input) id_input.value = '';
    if (name_input) name_input.value = '';
    if (email_input) email_input.value = '';
    if (role_select) role_select.value = 'MEMBER';
    if (title_el) title_el.textContent = 'Tambah Pengguna Baru';
    if (submit_label) submit_label.textContent = 'Simpan Pengguna';
    handle_role_preset_change('MEMBER');
  } else if (mode === 'edit') {
    const target_user = (app_state.users_list || []).find(u => u.id === user_id);
    if (!target_user) {
      show_notification('Data pengguna tidak ditemukan.', 'error');
      return;
    }

    if (mode_input) mode_input.value = 'edit';
    if (id_input) id_input.value = target_user.id;
    if (name_input) name_input.value = target_user.name;
    if (email_input) email_input.value = target_user.email;
    if (role_select) role_select.value = target_user.role;
    if (title_el) title_el.textContent = 'Edit Pengguna: ' + target_user.name;
    if (submit_label) submit_label.textContent = 'Perbarui Pengguna';

    // Isi checkbox sesuai izin user
    const perms = target_user.permissions || DEFAULT_ROLE_PERMS[target_user.role] || DEFAULT_ROLE_PERMS.CLIENT;
    const cb_create_proj = document.getElementById('perm-can-create-project');
    const cb_manage_spr = document.getElementById('perm-can-manage-sprint');
    const cb_create_task = document.getElementById('perm-can-create-task');
    const cb_move_task = document.getElementById('perm-can-move-task');
    const cb_view_insights = document.getElementById('perm-can-view-insights');
    const cb_view_cycle_time = document.getElementById('perm-can-view-cycle-time');
    const cb_test_init = document.getElementById('perm-can-test-initiative');
    const cb_manage_dem = document.getElementById('perm-can-manage-demand');
    const cb_manage_users = document.getElementById('perm-can-manage-users');

    if (cb_create_proj) cb_create_proj.checked = !!perms.can_create_project;
    if (cb_manage_spr) cb_manage_spr.checked = !!perms.can_manage_sprint;
    if (cb_create_task) cb_create_task.checked = !!perms.can_create_task;
    if (cb_move_task) cb_move_task.checked = !!perms.can_move_task;
    if (cb_view_insights) cb_view_insights.checked = !!perms.can_view_insights;
    if (cb_view_cycle_time) cb_view_cycle_time.checked = perms.can_view_cycle_time !== false;
    if (cb_test_init) cb_test_init.checked = perms.can_test_initiative !== false;
    if (cb_manage_dem) cb_manage_dem.checked = !!perms.can_manage_demand;
    if (cb_manage_users) cb_manage_users.checked = !!perms.can_manage_users;
  }

  modal.classList.remove('hidden');
}

/**
 * Menutup Modal Pengguna
 */
function close_user_modal() {
  const modal = document.getElementById('modal-user-form');
  if (!modal) return;
  modal.classList.add('hidden');

/**
 * Submit form Tambah / Edit Pengguna
 */
function handle_submit_user(e) {
  e.preventDefault();
  const mode = document.getElementById('input-user-mode').value;
  const user_id = document.getElementById('input-user-id').value;
  const name = document.getElementById('input-user-name').value.trim();
  const email = document.getElementById('input-user-email').value.trim();
  const role = document.getElementById('input-user-role').value;

  const permissions = {
    can_create_project: document.getElementById('perm-can-create-project').checked,
    can_manage_sprint: document.getElementById('perm-can-manage-sprint').checked,
    can_create_task: document.getElementById('perm-can-create-task').checked,
    can_move_task: document.getElementById('perm-can-move-task').checked,
    can_view_insights: document.getElementById('perm-can-view-insights').checked,
    can_view_cycle_time: document.getElementById('perm-can-view-cycle-time') ? document.getElementById('perm-can-view-cycle-time').checked : true,
    can_test_initiative: document.getElementById('perm-can-test-initiative') ? document.getElementById('perm-can-test-initiative').checked : true,
    can_manage_demand: document.getElementById('perm-can-manage-demand') ? document.getElementById('perm-can-manage-demand').checked : false,
    can_manage_users: document.getElementById('perm-can-manage-users').checked
  };

  const payload = {
    id: user_id,
    name: name,
    email: email,
    role: role,
    permissions: permissions
  };

  const submit_btn = document.getElementById('btn-submit-user');
  const submit_label = document.getElementById('btn-submit-user-label');
  if (submit_btn) {
    submit_btn.disabled = true;
    if (submit_label) submit_label.textContent = 'Menyimpan...';
  }

  set_loading_state(true);

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    const success_handler = response => {
      set_loading_state(false);
      if (submit_btn) {
        submit_btn.disabled = false;
        if (submit_label) submit_label.textContent = (mode === 'create' ? 'Simpan Pengguna' : 'Perbarui Pengguna');
      }
      if (response && response.success) {
        show_notification(response.message || 'Operasi berhasil!', 'success');
        close_user_modal();
        load_users_management();
        // Update user session jika admin mengedit profilnya sendiri
        if (app_state.current_user && app_state.current_user.email.toLowerCase() === email.toLowerCase()) {
          fetch_user_session();
        }
      } else {
        show_notification('Gagal: ' + (response ? response.message : ''), 'error');
      }
    };

    const failure_handler = err => {
      set_loading_state(false);
      if (submit_btn) {
        submit_btn.disabled = false;
        if (submit_label) submit_label.textContent = (mode === 'create' ? 'Simpan Pengguna' : 'Perbarui Pengguna');
      }
      show_notification('Error: ' + err.message, 'error');
    };

    if (mode === 'create') {
      google.script.run
        .withSuccessHandler(success_handler)
        .withFailureHandler(failure_handler)
        .create_new_user(payload);
    } else {
      google.script.run
        .withSuccessHandler(success_handler)
        .withFailureHandler(failure_handler)
        .update_existing_user(payload);
    }
  } else {
    // Mode simulasi lokal
    set_loading_state(false);
    if (submit_btn) {
      submit_btn.disabled = false;
      if (submit_label) submit_label.textContent = (mode === 'create' ? 'Simpan Pengguna' : 'Perbarui Pengguna');
    }
    if (mode === 'create') {
      const new_user = {
        id: 'USR-' + ('000' + (app_state.users_list.length + 1)).slice(-3),
        name: name,
        email: email,
        role: role,
        permissions: permissions
      };
      app_state.users_list.push(new_user);
      show_notification('Pengguna ' + name + ' berhasil ditambahkan!', 'success');
    } else {
      const idx = app_state.users_list.findIndex(u => u.id === user_id);
      if (idx !== -1) {
        app_state.users_list[idx] = Object.assign({}, app_state.users_list[idx], payload);
        show_notification('Data pengguna ' + name + ' berhasil diperbarui!', 'success');
      }
    }
    close_user_modal();
    render_users_table(app_state.users_list);
  }
}

/**
 * Membuka Modal Konfirmasi Hapus Pengguna
 */
function open_delete_user_modal(id, name, email) {
  const active_email = (app_state.current_user ? app_state.current_user.email : '').toLowerCase().trim();
  const active_id = app_state.current_user ? app_state.current_user.id : '';

/**
 * Konfirmasi Penghapusan Pengguna ke Backend
 */
function confirm_delete_user() {
  const user_id = document.getElementById('delete-user-id').value;
  if (!user_id) return;

  const confirm_btn = document.getElementById('btn-confirm-delete-user');
  if (confirm_btn) {
    confirm_btn.disabled = true;
    confirm_btn.textContent = 'Menghapus...';
  }

  set_loading_state(true);

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        set_loading_state(false);
        if (confirm_btn) {
          confirm_btn.disabled = false;
          confirm_btn.textContent = 'Hapus Akun';
        }
        close_delete_user_modal();
        if (response && response.success) {
          show_notification(response.message || 'Pengguna berhasil dihapus.', 'success');
          load_users_management();
        } else {
          show_notification('Gagal menghapus pengguna: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        set_loading_state(false);
        if (confirm_btn) {
          confirm_btn.disabled = false;
          confirm_btn.textContent = 'Hapus Akun';
        }
        close_delete_user_modal();
        show_notification('Error menghapus pengguna: ' + err.message, 'error');
      })
      .delete_existing_user(user_id);
  } else {
    // Mode simulasi lokal
    set_loading_state(false);
    if (confirm_btn) {
      confirm_btn.disabled = false;
      confirm_btn.textContent = 'Hapus Akun';
    }
    close_delete_user_modal();
    app_state.users_list = app_state.users_list.filter(u => u.id !== user_id);
    render_users_table(app_state.users_list);
    show_notification('Pengguna simulasi berhasil dihapus.', 'success');
  }
}

function preload_cycle_time_metadata(callback) {

    if (typeof callback === 'function') callback();
    return;
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {

      .withSuccessHandler(response => {
        if (response && response.success && response.data) {
          app_state.cycle_time_metadata = response.data;
          populate_cycle_time_comboboxes(response.data);
        }
        if (typeof callback === 'function') callback();
      })
      .withFailureHandler(err => {
        console.warn('Metadata preload warning:', err);
        if (typeof callback === 'function') callback();
      })
      .get_cycle_time_metadata();
  } else {
    // Mode simulasi

/**
 * Mengisi opsi combobox filter secara dinamis dari metadata project/sprint/user
 * @param {Object} metadata
 */
function populate_cycle_time_comboboxes(metadata) {
  if (!metadata) return;

  const sel_project = document.getElementById('ct-filter-project');
  const sel_sprint = document.getElementById('ct-filter-sprint');
  const sel_assignee = document.getElementById('ct-filter-assignee');

  // 1. Projects Combobox
  if (sel_project && metadata.projects) {
    const cur_val = sel_project.value;
    sel_project.innerHTML = '<option value="">Semua Proyek</option>';
    metadata.projects.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name ? `${p.name} (${p.id})` : p.id;
      if (p.id === cur_val) opt.selected = true;
      sel_project.appendChild(opt);
    });
  }

  // 2. Sprints Combobox
  update_cycle_time_sprints_dropdown(sel_project ? sel_project.value : '');

  // 3. Assignee Combobox
  if (sel_assignee && metadata.users) {
    const cur_val = sel_assignee.value;
    sel_assignee.innerHTML = '<option value="">Semua Assignee</option>';
    metadata.users.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.id;
      opt.textContent = `${u.name} (${u.role})`;
      if (u.id === cur_val) opt.selected = true;
      sel_assignee.appendChild(opt);
    });
  }
}

/**

    if (tbody) {

    if (count_badge) count_badge.textContent = '0 tasks';
    if (stat_total) stat_total.textContent = '0';
    if (stat_todo) stat_todo.textContent = '-';
    if (stat_cycle) stat_cycle.textContent = '-';
    if (stat_lead) stat_lead.textContent = '-';

  let total_lead_ms = 0;

    total_todo_ms += (r.durations ? r.durations.todo_ms : 0);
    total_cycle_ms += (r.durations ? r.durations.cycle_time_ms : 0);
    total_lead_ms += (r.durations ? r.durations.lead_time_ms : 0);
  });

  const avg_todo_ms = Math.round(total_todo_ms / rows.length);
  const avg_cycle_ms = Math.round(total_cycle_ms / rows.length);
  const avg_lead_ms = Math.round(total_lead_ms / rows.length);

  if (stat_cycle) stat_cycle.textContent = format_duration_human_client(avg_cycle_ms);

        <!-- Key -->

        </td>
        
        <!-- Type Icon -->
        <td class="py-3 px-2 text-center whitespace-nowrap">
          ${(() => {
            const wt = String(task.work_type || 'TASK').toUpperCase();
            if (wt === 'INITIATIVE') return '<span class="inline-flex items-center justify-center w-5 h-5 rounded bg-purple-600 text-white text-[10px] font-bold" title="Inisiatif (Level 1)">🟣</span>';
            if (wt === 'USER_STORY') return '<span class="inline-flex items-center justify-center w-5 h-5 rounded bg-blue-600 text-white text-[10px] font-bold" title="User Story (Level 0)">🔵</span>';
            if (wt === 'BUG') return '<span class="inline-flex items-center justify-center w-5 h-5 rounded bg-rose-600 text-white text-[10px] font-bold" title="BUG (Level 0)">🔴</span>';
            if (wt === 'SUBTASK') return '<span class="inline-flex items-center justify-center w-5 h-5 rounded bg-slate-500 text-white text-[10px] font-bold" title="Subtask (Level -1)">⚪</span>';
            return '<span class="inline-flex items-center justify-center w-5 h-5 rounded bg-sky-600 text-white text-[10px] font-bold" title="Task (Level 0)">🔷</span>';

        </td>

        <!-- Summary -->

/**
 * Format durasi ms ke human-readable string di browser
 * @param {number} ms
 * @return {string}
 */
function format_duration_human_client(ms) {
  if (!ms || ms <= 0 || isNaN(ms)) return '-';
  const total_minutes = Math.round(ms / (1000 * 60));
  if (total_minutes <= 0) return '< 1m';

  const days = Math.floor(total_minutes / (24 * 60));
  const hours = Math.floor((total_minutes % (24 * 60)) / 60);
  const minutes = total_minutes % 60;

  const parts = [];
  if (days > 0) parts.push(days + 'd');
  if (hours > 0) parts.push(hours + 'h');
  if (minutes > 0 || parts.length === 0) parts.push(minutes + 'm');

  return parts.join(' ');
}

}

/**
 * Membuka detail sesi inisiatif dan merender obrolan
 */
function open_initiative_session(session_id) {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (response && response.success) {
          app_state.active_initiative_session = response.data;
          render_active_initiative_chat(response.data);
          load_initiatives_list();
        } else {
          show_notification('Gagal memuat sesi: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        show_notification('Error server: ' + err.message, 'error');
      })
      .get_initiative_session_details(session_id);
  } else {
    // Offline simulation
    const item = (app_state.initiatives_list || []).find(i => i.id === session_id);
    if (item) {
      app_state.active_initiative_session = item;
      render_active_initiative_chat(item);
    }
  }
}

/**
 * Render percakapan sesi aktif di area chat tengah
 */
function render_active_initiative_chat(session) {
  if (!session) return;

  const title_el = document.getElementById('chat-session-title');
  const id_el = document.getElementById('chat-session-id');
  const status_badge = document.getElementById('chat-session-status-badge');
  const attempt_badge = document.getElementById('chat-attempt-badge');
  const mini_banner = document.getElementById('chat-approved-banner-mini');
  const alert_approved = document.getElementById('chat-alert-approved');
  const alert_rejected = document.getElementById('chat-alert-rejected');
  const alert_appr_note = document.getElementById('chat-alert-approved-note');
  const alert_rej_note = document.getElementById('chat-alert-rejected-note');
  const messages_container = document.getElementById('initiative-chat-messages');
  const input_msg = document.getElementById('input-initiative-message');
  const btn_send = document.getElementById('btn-send-initiative');

  if (title_el) title_el.textContent = session.title || session.initiative_title || 'Inisiatif';
  if (id_el) id_el.textContent = session.id;
  if (attempt_badge) attempt_badge.textContent = 'Percobaan: ' + (session.attempt_count || 0) + 'x';

  // Status Styling
  if (status_badge) {
    if (session.status === 'APPROVED') {
      status_badge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300';
      status_badge.textContent = '✓ APPROVED';
    } else if (session.status === 'REJECTED') {
      status_badge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-rose-100 text-rose-800 border border-rose-300';
      status_badge.textContent = '✕ DITOLAK (NO VALUE)';
    } else {
      status_badge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-300';
      status_badge.textContent = 'DALAM EVALUASI';
    }
  }

  // Mini Banner & Decision Alerts
  if (session.status === 'APPROVED') {
    if (mini_banner) mini_banner.classList.remove('hidden');
    if (alert_approved) alert_approved.classList.remove('hidden');
    if (alert_rejected) alert_rejected.classList.add('hidden');
    if (alert_appr_note) alert_appr_note.textContent = session.ai_summary_note || 'Inisiatif disetujui & otomatis diteruskan ke Demand Management.';
  } else if (session.status === 'REJECTED') {
    if (mini_banner) mini_banner.classList.add('hidden');
    if (alert_approved) alert_approved.classList.add('hidden');
    if (alert_rejected) alert_rejected.classList.remove('hidden');
    if (alert_rej_note) alert_rej_note.textContent = session.ai_summary_note || 'AI Challenger menyatakan inisiatif ini tidak memiliki value bisnis yang memadai.';
  } else {
    if (mini_banner) mini_banner.classList.add('hidden');
    if (alert_approved) alert_approved.classList.add('hidden');
    if (alert_rejected) alert_rejected.classList.add('hidden');
  }

  // Render Messages
  if (messages_container) {
    const msgs = session.messages || [];
    if (msgs.length === 0) {
      messages_container.innerHTML = `
        <div class="text-center py-12 text-slate-400 text-xs">
          Mulai sesi dengan menuliskan ringkasan inisiatif Anda di bawah.
        </div>
      `;
    } else {
      messages_container.innerHTML = '';
      msgs.forEach(msg => {
        const is_model = msg.role === 'model';
        const bubble_wrapper = document.createElement('div');
        bubble_wrapper.className = `flex items-start space-x-3 ${is_model ? '' : 'flex-row-reverse space-x-reverse'}`;

        const avatar = is_model
          ? `<div class="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-xs shadow-sm flex-shrink-0">AI</div>`
          : `<div class="w-8 h-8 rounded-xl bg-slate-800 text-white flex items-center justify-center font-bold text-xs shadow-sm flex-shrink-0">PO</div>`;

        const bubble = `
          <div class="max-w-[85%] md:max-w-[80%] rounded-2xl p-4 shadow-sm text-xs leading-relaxed ${is_model ? 'bg-white border border-slate-200 text-slate-800' : 'bg-gradient-to-r from-indigo-600 to-indigo-700 text-white'}">
            <div class="flex items-center justify-between mb-1 text-[10px] ${is_model ? 'text-slate-400' : 'text-indigo-200'}">
              <span class="font-bold">${is_model ? 'Product Challenger (ex-CPO)' : 'Product Owner'}</span>
              <span>${msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}</span>
            </div>
            <div class="whitespace-pre-wrap ${is_model ? 'font-sans' : ''}">${escape_html(msg.text)}</div>
          </div>
        `;

        bubble_wrapper.innerHTML = avatar + bubble;
        messages_container.appendChild(bubble_wrapper);
      });

      // Auto-scroll ke pesan terbawah
      messages_container.scrollTop = messages_container.scrollHeight;
    }
  }

  if (input_msg) {
    input_msg.disabled = false;
    input_msg.value = '';
    input_msg.focus();
  }
  if (btn_send) btn_send.disabled = false;
}

/**
 * Mengirim pesan argumen user ke Challenger AI
 */
function handle_send_initiative_message(e) {
  e.preventDefault();
  if (!app_state.active_initiative_session) {
    show_notification('Silakan pilih atau buat sesi inisiatif terlebih dahulu.', 'warning');
    return;
  }

  const session_id = app_state.active_initiative_session.id;
  const input_msg = document.getElementById('input-initiative-message');
  const user_text = input_msg ? input_msg.value.trim() : '';
  if (!user_text) return;

  const btn_send = document.getElementById('btn-send-initiative');
  const typing_indicator = document.getElementById('chat-typing-indicator');
  const messages_container = document.getElementById('initiative-chat-messages');

  // Segera tampilkan pesan user di UI
  if (messages_container) {
    const user_wrapper = document.createElement('div');
    user_wrapper.className = 'flex items-start space-x-3 flex-row-reverse space-x-reverse';
    user_wrapper.innerHTML = `
      <div class="w-8 h-8 rounded-xl bg-slate-800 text-white flex items-center justify-center font-bold text-xs shadow-sm flex-shrink-0">PO</div>
      <div class="max-w-[85%] md:max-w-[80%] rounded-2xl p-4 shadow-sm text-xs leading-relaxed bg-gradient-to-r from-indigo-600 to-indigo-700 text-white">
        <div class="flex items-center justify-between mb-1 text-[10px] text-indigo-200">
          <span class="font-bold">Product Owner</span>
          <span>Baru saja</span>
        </div>
        <div class="whitespace-pre-wrap">${escape_html(user_text)}</div>
      </div>
    `;
    messages_container.appendChild(user_wrapper);
    messages_container.scrollTop = messages_container.scrollHeight;
  }

  // Disable form input selama analisis AI
  if (input_msg) {
    input_msg.value = '';
    input_msg.disabled = true;
  }
  if (btn_send) btn_send.disabled = true;
  if (typing_indicator) typing_indicator.classList.remove('hidden');

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (input_msg) input_msg.disabled = false;
        if (btn_send) btn_send.disabled = false;
        if (typing_indicator) typing_indicator.classList.add('hidden');

        if (response && response.success) {
          app_state.active_initiative_session = {
            id: response.data.session_id,
            initiative_title: app_state.active_initiative_session.initiative_title,
            user_email: app_state.active_initiative_session.user_email,
            attempt_count: response.data.attempt_count,
            status: response.data.status,
            ai_summary_note: response.data.note,
            messages: response.data.messages
          };
          render_active_initiative_chat(app_state.active_initiative_session);
          load_initiatives_list();

          if (response.data.status === 'APPROVED') {
            show_notification('🎉 Inisiatif Disetujui! Telah masuk ke menu Demand Management.', 'success');
          } else if (response.data.status === 'REJECTED') {
            show_notification('⚠️ Inisiatif Ditolak oleh AI Challenger (Tidak Ada Value).', 'warning');
          }
        } else {
          show_notification(response ? response.message : 'Gagal mengirim pesan.', 'error');
          if (input_msg) input_msg.value = user_text;
          if (messages_container) {
            const err_wrapper = document.createElement('div');
            err_wrapper.className = 'p-3.5 bg-rose-50 border border-rose-200 rounded-2xl text-rose-800 text-xs flex items-start space-x-2.5 my-2';
            err_wrapper.innerHTML = `
              <span class="text-base flex-shrink-0">⚠️</span>
              <div>
                <strong class="block font-bold text-rose-900">Gagal Menghubungi Challenger AI:</strong>
                <p class="text-[11px] text-rose-700 mt-0.5 leading-relaxed">${escape_html(response ? response.message : 'Terjadi kendala pada backend.')}</p>
              </div>
            `;
            messages_container.appendChild(err_wrapper);
            messages_container.scrollTop = messages_container.scrollHeight;
          }
        }
      })
      .withFailureHandler(err => {
        if (input_msg) {
          input_msg.disabled = false;
          input_msg.value = user_text;
        }
        if (btn_send) btn_send.disabled = false;
        if (typing_indicator) typing_indicator.classList.add('hidden');
        show_notification('Error server: ' + err.message, 'error');
        if (messages_container) {
          const err_wrapper = document.createElement('div');
          err_wrapper.className = 'p-3.5 bg-rose-50 border border-rose-200 rounded-2xl text-rose-800 text-xs flex items-start space-x-2.5 my-2';
          err_wrapper.innerHTML = `
            <span class="text-base flex-shrink-0">⚠️</span>
            <div>
              <strong class="block font-bold text-rose-900">Error Koneksi ke Challenger AI:</strong>
              <p class="text-[11px] text-rose-700 mt-0.5 leading-relaxed">${escape_html(err.message)}</p>
            </div>
          `;
          messages_container.appendChild(err_wrapper);
          messages_container.scrollTop = messages_container.scrollHeight;
        }
      })
      .send_initiative_message(session_id, user_text);
  } else {
    // Mock simulation for offline test
    setTimeout(() => {
      if (input_msg) input_msg.disabled = false;
      if (btn_send) btn_send.disabled = false;
      if (typing_indicator) typing_indicator.classList.add('hidden');

      const mock_decision = user_text.toLowerCase().includes('approve') ? 'APPROVED' : (user_text.toLowerCase().includes('reject') ? 'REJECTED' : 'IN_PROGRESS');
      const mock_reply = mock_decision === 'APPROVED' 
        ? 'Inisiatif ini telah tervalidasi dengan baik dan memiliki proyeksi ROI yang solid. Berikut ringkasan PRD & FSD:\n\n### PRD Ringkas:\n- Tujuan: Otomasi alur verifikasi\n- Scope: Integrasi OCR & E-KYC\n\n### FSD Ringkas:\n- Workflow: Input -> Validasi -> Webhook\n\n<<<DECISION: APPROVED>>>\n<<<EST_ENGINEERS: 3>>>\n<<<EST_DAYS: 25>>>\n<<<NOTE: Inisiatif sangat solid dan terukur.>>>'
        : (mock_decision === 'REJECTED' ? 'Inisiatif ini tidak memiliki diferensiasi dan biaya pengembangannya tidak sebanding dengan value efisiensi yang ditawarkan.\n\n<<<DECISION: REJECTED>>>\n<<<NOTE: Tidak ada value nyata.>>>' : 'Dari sisi operasional multifinance, bagaimana mitigasi risiko jika data pihak ketiga mengalami downtime? Seberapa besar efisiensi biaya nyata yang dihemat? Jelaskan dalam angka konkret.\n\n<<<DECISION: IN_PROGRESS>>>');

      const clean_reply = mock_reply.replace(/<<<(DECISION|NOTE|EST_ENGINEERS|EST_DAYS):[\s\S]*?>>>/gi, '').trim();
      const current_history = app_state.active_initiative_session.messages || [];
      current_history.push({ role: 'user', text: user_text, timestamp: new Date().toISOString() });
      current_history.push({ role: 'model', text: clean_reply, timestamp: new Date().toISOString() });

      app_state.active_initiative_session.attempt_count = (app_state.active_initiative_session.attempt_count || 0) + 1;
      app_state.active_initiative_session.status = mock_decision;
      app_state.active_initiative_session.messages = current_history;

      render_active_initiative_chat(app_state.active_initiative_session);
      load_initiatives_list();
    }, 600);
  }
}

/**
 * Update kartu ringkasan metrik Demand dan Inisiatif Tertolak
 */
function update_demands_statistics(demands, stats, rejected_initiatives) {
  const total_el = document.getElementById('stat-total-demands');
  const pending_el = document.getElementById('stat-pending-demands');
  const planned_el = document.getElementById('stat-planned-demands');
  const converted_el = document.getElementById('stat-converted-demands');
  const rejected_el = document.getElementById('stat-rejected-demands');
  const badge_app = document.getElementById('badge-approved-count');
  const badge_rej = document.getElementById('badge-rejected-count');

  const demands_arr = demands || [];
  const rejected_arr = rejected_initiatives || app_state.rejected_initiatives_list || [];

  const total = stats ? stats.total_demands : demands_arr.length;
  const pending = stats ? stats.pending : demands_arr.filter(d => d.capacity_status === 'PENDING_CAPACITY').length;
  const planned = stats ? stats.planned : demands_arr.filter(d => d.capacity_status === 'CAPACITY_PLANNED').length;
  const converted = stats ? stats.converted : demands_arr.filter(d => d.capacity_status === 'CONVERTED_TO_PROJECT').length;
  const rejected = stats ? stats.rejected : rejected_arr.length;

  if (total_el) total_el.textContent = total;
  if (pending_el) pending_el.textContent = pending;
  if (planned_el) planned_el.textContent = planned;
  if (converted_el) converted_el.textContent = converted;
  if (rejected_el) rejected_el.textContent = rejected;

  if (badge_app) badge_app.textContent = total;
  if (badge_rej) badge_rej.textContent = rejected;
}

      btn_rej.className = 'px-4 py-2.5 text-xs font-bold border-b-2 border-rose-600 text-rose-600 flex items-center space-x-2 transition-all cursor-pointer';

    if (c_app) c_app.classList.add('hidden');

      <td class="py-3 px-4 text-center">
        <span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-700">
          ${item.attempt_count || 1}x
        </span>
      </td>
      <td class="py-3 px-4 max-w-xs">
        <div class="text-xs text-rose-700 bg-rose-50/80 p-2 rounded-lg border border-rose-100 leading-relaxed">
          ${escape_html(item.ai_summary_note || 'Inisiatif ditolak oleh Challenger AI karena nilai bisnis tidak mencukupi.')}
        </div>
      </td>
      <td class="py-3 px-4 whitespace-nowrap text-xs text-slate-500">
        ${formatted_date}
      </td>
      <td class="py-3 px-4 text-center whitespace-nowrap">
        <button 
          type="button" 
          onclick="open_rejected_initiative_session('${escape_html(item.id)}')" 
          class="px-2.5 py-1 text-[11px] font-semibold text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50 rounded-lg transition-colors border border-indigo-200 cursor-pointer">
          Lihat Chat Sesi &rarr;
        </button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

/**
 * Membuka sesi inisiatif yang ditolak langsung dari tabel Demand Management
 */
function open_rejected_initiative_session(session_id) {
  switch_view('initiative-test');
  open_initiative_session(session_id);
}

/**
 * Render baris tabel Demand
 */
function render_demands_table(demands) {
  const tbody = document.getElementById('demands-table-body');
  if (!tbody) return;

  if (!demands || demands.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="py-12 text-center text-slate-400 italic">
          Belum ada inisiatif yang lolos evaluasi Challenger AI ke Demand Pipeline.<br>
          <span class="text-[11px] text-slate-500 mt-1 inline-block">Uji inisiatif produk Anda di menu <strong>Uji Inisiatif AI</strong> untuk mendapatkan approval.</span>
        </td>
      </tr>
    `;
    return;
  }

  const user = app_state.current_user || {};
  const perms = user.permissions || DEFAULT_ROLE_PERMS[user.role] || DEFAULT_ROLE_PERMS.CLIENT;

  tbody.innerHTML = '';
  demands.forEach(d => {
    let status_badge = 'bg-amber-100 text-amber-800 border-amber-200';
    let status_text = 'Menunggu Kapasitas';
    if (d.capacity_status === 'CAPACITY_PLANNED') {
      status_badge = 'bg-emerald-100 text-emerald-800 border-emerald-200';
      status_text = 'Kapasitas Terencana';
    } else if (d.capacity_status === 'CONVERTED_TO_PROJECT') {
      status_badge = 'bg-purple-100 text-purple-800 border-purple-200';
      status_text = '✓ Aktif Sebagai Proyek';
    }

    const tr = document.createElement('tr');
    tr.className = 'hover:bg-slate-50/60 transition-colors border-b border-slate-100';

    tr.innerHTML = `
      <td class="py-3 px-4">
        <div>
          <div class="font-bold text-slate-900">${escape_html(d.title)}</div>
          <div class="text-[10px] text-slate-400 font-mono mt-0.5 flex items-center space-x-2">
            <span>${escape_html(d.id)}</span>
            <span>&bull;</span>
            <button type="button" onclick="open_demand_prd_modal('${escape_html(d.id)}')" class="text-indigo-600 hover:text-indigo-800 underline font-semibold">
              Buka PRD/FSD &rarr;
            </button>
          </div>
        </div>
      </td>
      <td class="py-3 px-4">
        <span class="text-xs text-slate-600 font-mono">${escape_html(d.submitter_email)}</span>
      </td>
      <td class="py-3 px-4">
        <div class="text-xs text-slate-700">
          <span class="font-bold text-indigo-700">${d.est_engineers || 3} Engineers</span>
          <span class="text-slate-400 block text-[10px]">${d.est_duration_days || 20} Hari Kerja</span>
        </div>
      </td>
      <td class="py-3 px-4">
        <div>
          <span class="font-bold text-sm ${d.allocated_capacity_hours > 0 ? 'text-emerald-700' : 'text-slate-400'}">
            ${d.allocated_capacity_hours > 0 ? d.allocated_capacity_hours + ' Jam' : 'Belum Dihitung'}
          </span>
          ${d.capacity_notes ? `<span class="block text-[10px] text-slate-500 truncate max-w-xs mt-0.5">"${escape_html(d.capacity_notes)}"</span>` : ''}
        </div>
      </td>
      <td class="py-3 px-4">
        <span class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${status_badge}">
          ${status_text}
        </span>
      </td>
      <td class="py-3 px-4 text-center">
        <div class="flex items-center justify-center space-x-2">
          ${perms.can_manage_demand !== false ? `
            <button 
              type="button" 
              onclick="open_demand_capacity_modal('${escape_html(d.id)}')" 
              class="px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-xs font-semibold transition-colors flex items-center space-x-1 cursor-pointer">
              <span>Hitung Kapasitas</span>
            </button>
          ` : ''}

          ${(perms.can_create_project && d.capacity_status !== 'CONVERTED_TO_PROJECT') ? `
            <button 
              type="button" 
              onclick="handle_convert_demand_to_project('${escape_html(d.id)}')" 
              class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold transition-colors shadow-sm flex items-center space-x-1 cursor-pointer">
              <span>Jadikan Proyek</span>
            </button>
          ` : ''}
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

/**
 * Membuka Modal Input Alokasi Kapasitas
 */
function open_demand_capacity_modal(demand_id) {
  const demand = (app_state.demands_list || []).find(d => d.id === demand_id);
  if (!demand) {
    show_notification('Data demand tidak ditemukan.', 'error');
    return;
  }

  const modal = document.getElementById('modal-demand-capacity');
  const title_el = document.getElementById('modal-capacity-demand-title');
  const id_input = document.getElementById('input-demand-id');
  const hours_input = document.getElementById('input-capacity-hours');
  const notes_input = document.getElementById('input-capacity-notes');
  const eng_el = document.getElementById('modal-capacity-est-eng');
  const days_el = document.getElementById('modal-capacity-est-days');

  if (title_el) title_el.textContent = demand.title;
  if (id_input) id_input.value = demand.id;
  if (hours_input) hours_input.value = demand.allocated_capacity_hours || '';
  if (notes_input) notes_input.value = demand.capacity_notes || '';
  if (eng_el) eng_el.textContent = (demand.est_engineers || 3) + ' Engineers';
  if (days_el) days_el.textContent = (demand.est_duration_days || 20) + ' Hari Kerja';

  if (modal) modal.classList.remove('hidden');
}

/**
 * Menutup Modal Input Kapasitas
 */
function close_demand_capacity_modal() {
  const modal = document.getElementById('modal-demand-capacity');
  if (modal) modal.classList.add('hidden');
}

/**
 * Submit Alokasi Kapasitas Demand
 */
function handle_submit_demand_capacity(e) {
  e.preventDefault();
  const demand_id = document.getElementById('input-demand-id').value;
  const hours = document.getElementById('input-capacity-hours').value;
  const notes = document.getElementById('input-capacity-notes').value;

  const btn = document.getElementById('btn-submit-capacity');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Menyimpan...';
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Simpan Alokasi Kapasitas';
        }
        if (response && response.success) {
          close_demand_capacity_modal();
          show_notification('Kapasitas berhasil dialokasikan!', 'success');
          load_demands_list();
        } else {
          show_notification(response ? response.message : 'Gagal menyimpan kapasitas.', 'error');
        }
      })
      .withFailureHandler(err => {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Simpan Alokasi Kapasitas';
        }
        show_notification('Error server: ' + err.message, 'error');
      })
      .update_demand_capacity(demand_id, hours, notes);
  } else {
    // Mock simulation
    setTimeout(() => {
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Simpan Alokasi Kapasitas';
      }
      close_demand_capacity_modal();
      const demand = (app_state.demands_list || []).find(d => d.id === demand_id);
      if (demand) {
        demand.allocated_capacity_hours = Number(hours);
        demand.capacity_notes = notes;
        demand.capacity_status = 'CAPACITY_PLANNED';
      }
      show_notification('Kapasitas berhasil dialokasikan (Mock)!', 'success');
      render_demands_table(app_state.demands_list);
      update_demands_statistics(app_state.demands_list);
    }, 300);
  }
}

/**
 * Membuka Modal Detail PRD & FSD Inisiatif
 */
function open_demand_prd_modal(demand_id) {
  const demand = (app_state.demands_list || []).find(d => d.id === demand_id);
  if (!demand) return;

  const modal = document.getElementById('modal-demand-prd-detail');
  const title_el = document.getElementById('modal-prd-title');
  const submitter_el = document.getElementById('modal-prd-submitter');
  const prd_el = document.getElementById('modal-prd-content');
  const fsd_el = document.getElementById('modal-fsd-content');

  if (title_el) title_el.textContent = demand.title;
  if (submitter_el) submitter_el.textContent = 'Diajukan oleh: ' + demand.submitter_email;
  if (prd_el) prd_el.textContent = demand.prd_summary || '-';
  if (fsd_el) fsd_el.textContent = demand.fsd_summary || '-';

  if (modal) modal.classList.remove('hidden');
}

/**
 * Menutup Modal Detail PRD & FSD
 */
function close_demand_prd_modal() {
  const modal = document.getElementById('modal-demand-prd-detail');
  if (modal) modal.classList.add('hidden');
}

/**
 * Konversi Demand yang sudah direncanakan menjadi Proyek Aktif
 */
function handle_convert_demand_to_project(demand_id) {
  const demand = (app_state.demands_list || []).find(d => d.id === demand_id);
  if (!demand) return;

  if (!confirm(`Konversikan demand "${demand.title}" menjadi Proyek baru di Alternate Project Delivery?`)) {
    return;
  }

  set_loading_state(true);
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        set_loading_state(false);
        if (response && response.success) {
          show_notification('Berhasil! Proyek baru telah dibuat dari Demand.', 'success');
          load_demands_list();
          load_projects_list();
        } else {
          show_notification(response ? response.message : 'Gagal konversi demand.', 'error');
        }
      })
      .withFailureHandler(err => {
        set_loading_state(false);
        show_notification('Error server: ' + err.message, 'error');
      })
      .convert_demand_to_project(demand_id);
  } else {
    // Mock simulation
    setTimeout(() => {
      set_loading_state(false);
      demand.capacity_status = 'CONVERTED_TO_PROJECT';
      show_notification('Berhasil konversi (Mock)!', 'success');
      render_demands_table(app_state.demands_list);
      update_demands_statistics(app_state.demands_list);
    }, 400);
  }
}
</script>
