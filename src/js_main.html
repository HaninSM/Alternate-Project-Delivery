<script>
/**
 * State Management Global Aplikasi Sisi Klien
 */
const app_state = {
  current_user: null,
  active_project_id: 'PRJ-001',
  active_sprint_id: 'SPR-001',
  current_view: 'dashboard',
  projects: [],
  tasks: [],
  backlog_tasks: [],
  sprints: [],
  insights: null,
  users_list: [],
  is_loading: false,
  burndown_chart_instance: null
};

/**
 * Event Listener saat DOM siap dimuat
 */
document.addEventListener('DOMContentLoaded', () => {
  init_application();
});

/**
 * Inisialisasi awal aplikasi SPA
 */
function init_application() {
  fetch_user_session();
}

/**
 * Mengambil profil & role pengguna aktif dari backend GAS
 */
function fetch_user_session() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (response && response.success) {
          app_state.current_user = response.data;
          render_user_profile(response.data);
          apply_rbac_permissions(response.data.role);
          load_projects_list();
          load_sprint_tasks();
          load_sprint_insights();
        } else {
          show_notification('Gagal memuat profil pengguna.', 'error');
        }
      })
      .withFailureHandler(err => {
        show_notification('Error koneksi backend: ' + err.message, 'error');
      })
      .get_user_role();
  } else {
    // Mode simulasi lokal untuk pengujian browser
    const mock_user = {
      id: 'USR-002',
      name: 'Budi PM',
      email: 'pm@example.com',
      role: 'PM'
    };
    app_state.current_user = mock_user;
    render_user_profile(mock_user);
    apply_rbac_permissions(mock_user.role);
    init_mock_projects();
    init_mock_tasks();
    init_mock_insights();
  }
}

/**
 * Merender profil pengguna di sidebar
 */
function render_user_profile(user) {
  const avatar_el = document.getElementById('user-avatar');
  const name_el = document.getElementById('nav-user-name');
  const email_el = document.getElementById('nav-user-email');
  const role_badge_el = document.getElementById('nav-user-role-badge');
  const welcome_name_el = document.getElementById('dash-welcome-name');

  if (welcome_name_el) welcome_name_el.textContent = user.name || user.email || 'Pengguna';
  if (avatar_el && user.name) avatar_el.textContent = user.name.charAt(0).toUpperCase();
  if (name_el) name_el.textContent = user.name || user.email || 'Pengguna';
  if (email_el) email_el.textContent = user.email || '';
  if (role_badge_el) {
    role_badge_el.textContent = user.role;
    if (user.role === 'ADMIN' || user.role === 'PM') {
      role_badge_el.className = 'inline-block px-1.5 py-0.5 rounded text-[10px] font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30';
    } else if (user.role === 'MEMBER') {
      role_badge_el.className = 'inline-block px-1.5 py-0.5 rounded text-[10px] font-bold bg-blue-500/20 text-blue-300 border border-blue-500/30';
    } else {
      role_badge_el.className = 'inline-block px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30';
    }
  }
}

/**
 * Menyesuaikan kontrol UI berdasarkan RBAC dan Granular Permissions
 */
function apply_rbac_permissions(role) {
  const user = app_state.current_user || {};
  const perms = user.permissions || {
    can_create_project: role === 'ADMIN' || role === 'PM',
    can_manage_sprint: role === 'ADMIN' || role === 'PM',
    can_create_task: role === 'ADMIN' || role === 'PM',
    can_move_task: role !== 'CLIENT',
    can_view_insights: true,
    can_manage_users: role === 'ADMIN'
  };

  const rbac_tag = document.getElementById('rbac-permission-tag');
  const btn_add_task = document.getElementById('btn-add-task');
  const nav_btn_users = document.getElementById('nav-btn-users');
  const btn_add_project = document.getElementById('btn-add-project');
  const btn_header_add_task = document.getElementById('btn-header-add-task');
  const btn_backlog_add_task = document.getElementById('btn-backlog-add-task');
  const btn_header_add_sprint = document.getElementById('btn-header-add-sprint');
  const btn_end_sprint = document.getElementById('btn-end-sprint');

  if (rbac_tag) {
    if (role === 'ADMIN') {
      rbac_tag.textContent = 'Mode: ADMIN (Akses Penuh)';
      rbac_tag.className = 'text-xs font-semibold text-purple-700 bg-purple-50 border border-purple-200 px-2.5 py-1 rounded-full';
    } else if (role === 'PM') {
      rbac_tag.textContent = 'Mode: PM (Project Manager)';
      rbac_tag.className = 'text-xs font-semibold text-indigo-700 bg-indigo-50 border border-indigo-200 px-2.5 py-1 rounded-full';
    } else if (role === 'MEMBER') {
      rbac_tag.textContent = 'Mode: Team Member';
      rbac_tag.className = 'text-xs font-semibold text-blue-700 bg-blue-50 border border-blue-200 px-2.5 py-1 rounded-full';
    } else {
      rbac_tag.textContent = 'Mode: External Client (Read-only)';
      rbac_tag.className = 'text-xs font-semibold text-amber-700 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-full';
    }
  }

  // Kontrol visibilitas tombol berdasarkan granular permissions
  if (btn_add_task) {
    if (perms.can_create_task) btn_add_task.classList.remove('hidden');
    else btn_add_task.classList.add('hidden');
  }
  if (btn_header_add_task) {
    if (perms.can_create_task) btn_header_add_task.classList.remove('hidden');
    else btn_header_add_task.classList.add('hidden');
  }
  if (btn_backlog_add_task) {
    if (perms.can_create_task) btn_backlog_add_task.classList.remove('hidden');
    else btn_backlog_add_task.classList.add('hidden');
  }
  if (btn_header_add_sprint) {
    if (perms.can_manage_sprint) btn_header_add_sprint.classList.remove('hidden');
    else btn_header_add_sprint.classList.add('hidden');
  }
  if (btn_end_sprint) {
    if (perms.can_manage_sprint) btn_end_sprint.classList.remove('hidden');
    else btn_end_sprint.classList.add('hidden');
  }
  if (btn_add_project) {
    if (perms.can_create_project) btn_add_project.classList.remove('hidden');
    else btn_add_project.classList.add('hidden');
  }

  // Menu Manajemen Pengguna hanya muncul jika can_manage_users = true
  if (nav_btn_users) {
    if (perms.can_manage_users) {
      nav_btn_users.classList.remove('hidden');
    } else {
      nav_btn_users.classList.add('hidden');
    }
  }
}

/**
 * Memuat task sprint dari backend
 */
function load_sprint_tasks() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    set_loading_state(true);
    google.script.run
      .withSuccessHandler(response => {
        set_loading_state(false);
        if (response && response.success) {
          app_state.tasks = response.data || [];
          render_kanban_board();
        } else {
          show_notification('Gagal mengambil daftar task: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        set_loading_state(false);
        show_notification('Error koneksi task: ' + err.message, 'error');
      })
      .get_sprint_tasks(app_state.active_sprint_id);
  }
}

/**
 * Memuat ringkasan insight & metrik dari backend
 */
function load_sprint_insights() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (response && response.success) {
          app_state.insights = response.data;
          render_insights_dashboard(response.data);
        } else {
          show_notification('Gagal memuat insight sprint: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        show_notification('Error koneksi insight: ' + err.message, 'error');
      })
      .get_sprint_insights(app_state.active_sprint_id);
  }
}

/**
 * Render Dasbor Insight: KPI Cards, Blocker List, dan Burndown Chart
 * @param {Object} data - Payload metrik
 */
function render_insights_dashboard(data) {
  if (!data) return;

  // 1. KPI Cards
  const el_lead = document.getElementById('metric-lead-time');
  const el_cycle = document.getElementById('metric-cycle-time');
  const el_blocker = document.getElementById('metric-blocker-count');

  if (el_lead && data.summary) el_lead.textContent = data.summary.avg_lead_time_hours;
  if (el_cycle && data.summary) el_cycle.textContent = data.summary.avg_cycle_time_hours;
  if (el_blocker && data.summary) el_blocker.textContent = data.summary.blocker_count;

  // 2. Blocker Highlights List
  const blocker_container = document.getElementById('blocker-list-container');
  if (blocker_container) {
    blocker_container.innerHTML = '';
    if (!data.blockers || data.blockers.length === 0) {
      blocker_container.innerHTML = `
        <div class="p-4 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg text-xs text-center font-medium">
          ✓ Tidak ada blocker terdeteksi saat ini.
        </div>
      `;
    } else {
      data.blockers.forEach(b => {
        const item = document.createElement('div');
        item.className = 'p-3 bg-rose-50/70 border border-rose-200 rounded-lg text-xs flex flex-col space-y-1.5';
        item.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-rose-800">${b.task_id}</span>
            <span class="px-1.5 py-0.5 rounded bg-rose-200 text-rose-900 font-semibold text-[10px]">
              Macet ${b.stuck_hours} Jam
            </span>
          </div>
          <p class="font-medium text-slate-800">${b.title}</p>
          <div class="flex justify-between items-center text-[10px] text-slate-500 pt-1 border-t border-rose-100">
            <span>Status: <strong class="text-rose-700">${b.status}</strong></span>
            <span>PIC: <strong>${b.assignee}</strong></span>
          </div>
        `;
        blocker_container.appendChild(item);
      });
    }
  }

  // 3. Render Burndown Chart via Chart.js
  render_burndown_chart(data.burndown);
}

/**
 * Merender grafik garis Burndown Chart dengan Chart.js
 * @param {Object} burndown - { labels, ideal_hours, actual_hours }
 */
function render_burndown_chart(burndown) {
  if (!burndown) return;

  const canvas = document.getElementById('burndownChart');
  const placeholder = document.getElementById('burndown-placeholder');
  if (!canvas || typeof Chart === 'undefined') return;

  if (placeholder) placeholder.classList.add('hidden');

  // Hancurkan instance chart lama jika sudah ada
  if (app_state.burndown_chart_instance) {
    app_state.burndown_chart_instance.destroy();
  }

  const ctx = canvas.getContext('2d');
  app_state.burndown_chart_instance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: burndown.labels,
      datasets: [
        {
          label: 'Ideal Burndown (Jam)',
          data: burndown.ideal_hours,
          borderColor: '#94a3b8',
          borderDash: [5, 5],
          backgroundColor: 'transparent',
          borderWidth: 2,
          pointRadius: 3,
          tension: 0.1
        },
        {
          label: 'Aktual Tersisa (Jam)',
          data: burndown.actual_hours,
          borderColor: '#4f46e5',
          backgroundColor: 'rgba(79, 70, 229, 0.08)',
          fill: true,
          borderWidth: 3,
          pointRadius: 4,
          pointBackgroundColor: '#4f46e5',
          tension: 0.2
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false
      },
      plugins: {
        legend: {
          position: 'top',
          labels: {
            boxWidth: 12,
            font: { size: 11 }
          }
        },
        tooltip: {
          padding: 8
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          title: {
            display: true,
            text: 'Estimasi Jam Tersisa',
            font: { size: 11 }
          },
          grid: {
            color: '#f1f5f9'
          }
        },
        x: {
          grid: {
            display: false
          }
        }
      }
    }
  });
}

/**
 * Merender kartu-kartu task ke dalam 4 kolom Kanban Board
 */
function render_kanban_board() {
  const columns = {
    TODO: document.getElementById('column-todo'),
    IN_PROGRESS: document.getElementById('column-in_progress'),
    REVIEW: document.getElementById('column-review'),
    DONE: document.getElementById('column-done')
  };

  const counters = {
    TODO: document.getElementById('count-todo'),
    IN_PROGRESS: document.getElementById('count-in_progress'),
    REVIEW: document.getElementById('count-review'),
    DONE: document.getElementById('count-done')
  };

  Object.keys(columns).forEach(status => {
    if (columns[status]) columns[status].innerHTML = '';
    if (counters[status]) counters[status].textContent = '0';
  });

  const column_counts = { TODO: 0, IN_PROGRESS: 0, REVIEW: 0, DONE: 0 };
  const can_edit = app_state.current_user && app_state.current_user.role !== 'CLIENT';

  app_state.tasks.forEach(task => {
    const status = task.status;
    if (columns[status]) {
      column_counts[status]++;
      const card = create_task_card_element(task, can_edit);
      columns[status].appendChild(card);
    }
  });

  Object.keys(column_counts).forEach(status => {
    if (counters[status]) counters[status].textContent = column_counts[status];
    if (columns[status] && column_counts[status] === 0) {
      columns[status].innerHTML = `
        <div class="p-4 bg-white/60 border border-dashed border-slate-200 rounded-lg text-xs text-slate-400 italic text-center">
          Tidak ada task
        </div>
      `;
    }
  });
}

/**
 * Membuat elemen kartu task dengan dukungan HTML5 Drag and Drop
 */
function create_task_card_element(task, can_edit) {
  const card = document.createElement('div');
  card.id = 'task-card-' + task.id;

  if (can_edit) {
    card.draggable = true;
    card.ondragstart = (e) => handle_drag_start(e, task.id);
    card.ondragend = (e) => handle_drag_end(e);
    card.className = 'p-3.5 bg-white rounded-xl border border-slate-200/90 shadow-sm hover:shadow-md hover:border-indigo-300 transition-all cursor-grab active:cursor-grabbing flex flex-col justify-between space-y-2.5';
  } else {
    card.className = 'p-3.5 bg-white rounded-xl border border-slate-200/90 shadow-sm flex flex-col justify-between space-y-2.5';
  }

  // Badge status kecil di kartu tanpa dropdown/combobox
  const status_color_map = {
    TODO: 'bg-slate-100 text-slate-600',
    IN_PROGRESS: 'bg-blue-100 text-blue-700',
    REVIEW: 'bg-amber-100 text-amber-700',
    DONE: 'bg-emerald-100 text-emerald-700'
  };
  const status_badge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded ${status_color_map[task.status] || 'bg-slate-100 text-slate-600'}">${task.status}</span>`;

  card.innerHTML = `
    <div>
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-[10px] font-bold tracking-wider text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-100">
          ${task.id}
        </span>
        <span class="text-[11px] font-medium text-slate-500 flex items-center">
          <svg class="w-3.5 h-3.5 mr-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          ${task.estimate_hours}h
        </span>
      </div>
      <h4 class="text-xs font-semibold text-slate-800 line-clamp-2 leading-snug">
        ${task.title}
      </h4>
    </div>

    <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
      <div class="flex items-center space-x-1.5">
        <div class="w-5 h-5 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-[10px] font-bold">
          ${(task.assignee_name || 'U').charAt(0).toUpperCase()}
        </div>
        <span class="text-[11px] text-slate-600 truncate max-w-[90px]" title="${task.assignee_name}">
          ${task.assignee_name || 'Unassigned'}
        </span>
      </div>
      <div>
        ${status_badge}
      </div>
    </div>
  `;

  return card;
}

/**
 * Event Handlers HTML5 Drag and Drop
 */
let dragged_task_id = null;

function handle_drag_start(e, task_id) {
  dragged_task_id = task_id;
  e.dataTransfer.setData('text/plain', task_id);
  e.dataTransfer.effectAllowed = 'move';
  const target = e.target;
  setTimeout(() => {
    target.classList.add('opacity-40', 'scale-95');
  }, 0);
}

function handle_drag_end(e) {
  const target = e.target;
  target.classList.remove('opacity-40', 'scale-95');
  dragged_task_id = null;
  // Bersihkan highlight dari semua kolom
  ['column-todo', 'column-in_progress', 'column-review', 'column-done'].forEach(col_id => {
    const el = document.getElementById(col_id);
    if (el) el.classList.remove('bg-indigo-50/70', 'ring-2', 'ring-indigo-400');
  });
}

function handle_drag_over(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const current_col = e.currentTarget;
  current_col.classList.add('bg-indigo-50/70', 'ring-2', 'ring-indigo-400');
}

function handle_drag_leave(e) {
  const current_col = e.currentTarget;
  current_col.classList.remove('bg-indigo-50/70', 'ring-2', 'ring-indigo-400');
}

function handle_drop(e, target_status) {
  e.preventDefault();
  const current_col = e.currentTarget;
  current_col.classList.remove('bg-indigo-50/70', 'ring-2', 'ring-indigo-400');

  const task_id = e.dataTransfer.getData('text/plain') || dragged_task_id;
  if (!task_id || !target_status) return;

  handle_task_status_change(task_id, target_status);
}

/**
 * Menangani pergeseran status task dan me-refresh insight secara otomatis
 */
function handle_task_status_change(task_id, new_status) {
  const target_task = app_state.tasks.find(t => t.id === task_id);
  if (!target_task) return;

  const old_status = target_task.status;
  if (old_status === new_status) return;

  // Optimistic UI update
  target_task.status = new_status;
  target_task.updated_at = new Date().toISOString();
  render_kanban_board();

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (response && response.success) {
          show_notification('Status task ' + task_id + ' berhasil diubah ke ' + new_status, 'success');
          // Refresh insight data pasca pergeseran status
          load_sprint_insights();
        } else {
          target_task.status = old_status;
          render_kanban_board();
          show_notification('Gagal mengubah status: ' + (response ? response.message : 'Ditolak backend'), 'error');
        }
      })
      .withFailureHandler(err => {
        target_task.status = old_status;
        render_kanban_board();
        show_notification('Error pergeseran status: ' + err.message, 'error');
      })
      .update_task_status(task_id, new_status);
  } else {
    show_notification('[Simulasi] Status task ' + task_id + ' berpindah: ' + old_status + ' -> ' + new_status, 'info');
  }
}

/**
 * Berpindah tab antara Kanban Board dan Sprint Planning di dalam menu Project
 * @param {'board'|'planning'} tab_name
 */
function switch_project_tab(tab_name) {
  const tab_board_btn = document.getElementById('tab-btn-board');
  const tab_planning_btn = document.getElementById('tab-btn-planning');
  const board_content = document.getElementById('view-board');
  const planning_content = document.getElementById('view-scrum-planning');

  if (tab_name === 'planning') {
    if (board_content) {
      board_content.classList.remove('block');
      board_content.classList.add('hidden');
    }
    if (planning_content) {
      planning_content.classList.remove('hidden');
      planning_content.classList.add('block');
    }
    if (tab_planning_btn) {
      tab_planning_btn.className = 'px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-sm bg-white text-indigo-700 cursor-pointer flex items-center space-x-1.5';
    }
    if (tab_board_btn) {
      tab_board_btn.className = 'px-4 py-2 rounded-lg text-xs font-bold transition-all text-slate-600 hover:text-slate-900 cursor-pointer flex items-center space-x-1.5';
    }

  } else {

      tab_board_btn.className = 'px-4 py-2 rounded-lg text-xs font-bold transition-all shadow-sm bg-white text-indigo-700 cursor-pointer flex items-center space-x-1.5';

/**
 * Logika SPA Navigasi antar tampilan tanpa reload browser
 */
function switch_view(target_view) {
  // Normalisasi target view: jika memanggil 'board' atau 'scrum-planning', arahkan ke 'project'
  let normalized_view = target_view;
  if (target_view === 'board') {
    normalized_view = 'project';
    switch_project_tab('board');
  } else if (target_view === 'scrum-planning') {
    normalized_view = 'project';
    switch_project_tab('planning');
  } else if (target_view === 'project') {
    switch_project_tab(app_state.current_project_tab || 'board');
  }

  const views = ['dashboard', 'project', 'insights', 'settings', 'users'];
  
  views.forEach(view_name => {
    const section_el = document.getElementById('view-' + view_name);
    const nav_btn_el = document.getElementById('nav-btn-' + view_name);

    if (section_el) {
      if (view_name === normalized_view) {
        section_el.classList.remove('hidden');
        section_el.classList.add('block');
        // Render ulang chart jika beralih ke view insights agar responsive
        if (view_name === 'insights' && app_state.insights) {
          render_insights_dashboard(app_state.insights);
        }
        if (view_name === 'dashboard') {
          load_projects_list();
        }
        if (view_name === 'users') {
          load_users_management();
        }
      } else {
        section_el.classList.remove('block');
        section_el.classList.add('hidden');
      }
    }

    if (nav_btn_el) {
      if (view_name === normalized_view) {
        nav_btn_el.className = 'nav-tab-btn flex items-center w-full px-3 py-2.5 text-sm font-medium rounded-lg text-white bg-indigo-600/90 shadow-sm transition-colors group';
      } else {
        nav_btn_el.className = 'nav-tab-btn flex items-center w-full px-3 py-2.5 text-sm font-medium rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition-colors group';
      }
    }
  });

  app_state.current_view = target_view;
}

/**
 * Submit form pembuatan task baru ke Backend
 */
function handle_submit_new_task(e) {
  e.preventDefault();
  const title_el = document.getElementById('input-task-title');
  const est_el = document.getElementById('input-task-estimate');
  const assignee_el = document.getElementById('input-task-assignee');
  const submit_btn = document.getElementById('btn-submit-task');
  const target_input = document.getElementById('input-task-target-bucket');

  if (!title_el || !title_el.value.trim()) return;

  const target_sprint = (target_input && target_input.value) ? target_input.value : app_state.active_sprint_id;

  const task_payload = {
    sprint_id: target_sprint,
    title: title_el.value.trim(),
    estimate_hours: Number(est_el ? est_el.value : 8) || 8,
    assignee_id: assignee_el ? assignee_el.value : ''
  };

  if (submit_btn) {
    submit_btn.disabled = true;
    submit_btn.textContent = 'Menyimpan...';
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (submit_btn) {
          submit_btn.disabled = false;
          submit_btn.textContent = 'Simpan Task';
        }
        if (response && response.success) {
          show_notification('Task berhasil dibuat!', 'success');
          close_task_modal();
          if (app_state.current_view === 'scrum-planning' || app_state.current_project_tab === 'planning') {
            load_scrum_planning_data();
          } else {
            load_sprint_tasks();
            load_sprint_insights();
          }
        } else {
          show_notification('Gagal membuat task: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        if (submit_btn) {
          submit_btn.disabled = false;
          submit_btn.textContent = 'Simpan Task';
        }
        show_notification('Error membuat task: ' + err.message, 'error');
      })
      .create_new_task(task_payload);
  } else {
    // Mode simulasi lokal
    if (submit_btn) {
      submit_btn.disabled = false;
      submit_btn.textContent = 'Simpan Task';
    }
    const new_mock_task = {
      id: 'TSK-' + ('000' + (app_state.tasks.length + 1)).slice(-3),
      sprint_id: target_sprint,
      title: task_payload.title,
      status: 'TODO',
      assignee_name: 'Simulasi User',
      estimate_hours: task_payload.estimate_hours,
      created_at: new Date().toISOString(),
      updated_at: new Date().toISOString()
    };
    if (target_sprint.startsWith('BACKLOG')) {
      app_state.backlog_tasks.push(new_mock_task);
      render_scrum_planning_view();
    } else {
      app_state.tasks.push(new_mock_task);
      render_kanban_board();
    }
    close_task_modal();
    show_notification('Task simulasi berhasil ditambahkan!', 'success');
  }
}

/**
 * Helper Sanitasi HTML String
 */
function escape_html(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/**
 * Merender seluruh tampilan Scrum Planning (Wadah Backlog dan Sprints)
 */
function render_scrum_planning_view() {
  const current_user = app_state.current_user || {};
  const perms = current_user.permissions || (typeof DEFAULT_ROLE_PERMS !== 'undefined' ? DEFAULT_ROLE_PERMS[current_user.role] : {}) || {};
  const is_admin_or_pm = !current_user.role || current_user.role === 'ADMIN' || current_user.role === 'PM';
  const can_edit = is_admin_or_pm || perms.can_move_task !== false;

  // 1. Render Product Backlog Bucket
  const backlog_container = document.getElementById('bucket-product-backlog');
  const backlog_count_el = document.getElementById('scrum-backlog-count');
  const backlog_hours_el = document.getElementById('scrum-backlog-hours');

  const backlog_tasks = app_state.backlog_tasks || [];
  let total_backlog_hours = 0;
  backlog_tasks.forEach(t => total_backlog_hours += (Number(t.estimate_hours) || 0));

  if (backlog_count_el) backlog_count_el.textContent = backlog_tasks.length + ' task';
  if (backlog_hours_el) backlog_hours_el.textContent = total_backlog_hours + ' Jam Scope';

  if (backlog_container) {
    backlog_container.innerHTML = '';
    if (backlog_tasks.length === 0) {
      backlog_container.innerHTML = `
        <div class="p-8 text-center border-2 border-dashed border-slate-200 rounded-xl text-xs text-slate-400 flex flex-col items-center">
          <span class="mb-1 text-slate-600 font-medium">Belum ada task di Backlog.</span>
          <span class="text-slate-400 mb-3">Isi task perencanaan terlebih dahulu sebelum dimasukkan ke sprint.</span>
          <button 
            type="button" 
            onclick="open_backlog_task_modal()" 
            class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-xs transition-colors cursor-pointer flex items-center space-x-1.5">
            <span>+ Tambah Task ke Backlog</span>
          </button>
        </div>
      `;
    } else {
      backlog_tasks.forEach(task => {
        const card = create_bucket_task_card_element(task, 'BACKLOG', can_edit);
        backlog_container.appendChild(card);
      });
    }
  }

  // 2. Render Sprint Buckets
  const sprints_container = document.getElementById('scrum-sprint-buckets-container');
  if (!sprints_container) return;

  sprints_container.innerHTML = '';
  const sprints = app_state.sprints || [];

  if (sprints.length === 0) {
    sprints_container.innerHTML = `
      <div class="p-8 bg-white border border-dashed border-slate-200 rounded-2xl text-center text-xs text-slate-400 flex flex-col items-center">
        <span class="mb-1 text-slate-600 font-medium">Belum ada bucket sprint untuk proyek ini.</span>
        <span class="text-slate-400 mb-3">Buat bucket sprint baru untuk mulai mendistribusikan task dari Backlog.</span>

        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"/></svg>
      </div>

        ${task.estimate_hours || 0} Jam
      </span>
      ${move_options_html}
    </div>
  `;

  return card;

/**
 * Logika HTML5 Drag & Drop Antar Bucket
 */
let current_bucket_drag_data = null;

function handle_bucket_drag_start(e, task_id, source_bucket_id) {
  current_bucket_drag_data = { task_id: task_id, source_bucket_id: source_bucket_id };
  e.dataTransfer.setData('text/plain', JSON.stringify(current_bucket_drag_data));
  e.dataTransfer.effectAllowed = 'move';
  const target_card = document.getElementById('bucket-task-' + task_id);
  if (target_card) target_card.classList.add('opacity-40');
}

function handle_bucket_drag_end(e) {
  if (current_bucket_drag_data && current_bucket_drag_data.task_id) {
    const target_card = document.getElementById('bucket-task-' + current_bucket_drag_data.task_id);
    if (target_card) target_card.classList.remove('opacity-40');
  }
  document.querySelectorAll('.bucket-droppable-area').forEach(el => {
    el.classList.remove('bg-indigo-50', 'ring-2', 'ring-indigo-300');
  });
  current_bucket_drag_data = null;
}

function handle_bucket_drag_over(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const drop_zone = e.currentTarget;
  if (drop_zone) {
    drop_zone.classList.add('bg-indigo-50', 'ring-2', 'ring-indigo-300');
  }
}

function handle_bucket_drag_leave(e) {
  const drop_zone = e.currentTarget;
  if (drop_zone) {
    drop_zone.classList.remove('bg-indigo-50', 'ring-2', 'ring-indigo-300');
  }
}

function handle_bucket_drop(e, target_bucket_id) {
  e.preventDefault();
  const drop_zone = e.currentTarget;
  if (drop_zone) {
    drop_zone.classList.remove('bg-indigo-50', 'ring-2', 'ring-indigo-300');
  }

  let drag_data = current_bucket_drag_data;
  if (!drag_data) {
    try {
      drag_data = JSON.parse(e.dataTransfer.getData('text/plain'));
    } catch (err) {
      return;
    }
  }

  if (!drag_data || !drag_data.task_id) return;
  execute_move_task(drag_data.task_id, drag_data.source_bucket_id, target_bucket_id);
}

/**
 * Handler Pemindahan Cepat (Quick Transfer Select)
 */
function handle_quick_move_task(task_id, source_bucket_id, target_bucket_id) {
  execute_move_task(task_id, source_bucket_id, target_bucket_id);
}

/**
 * Eksekutor Pemindahan Task antar Bucket (Digunakan oleh Drag-and-Drop & Quick Select)
 */
function execute_move_task(task_id, source_bucket_id, target_bucket_id) {
  if (!task_id || !target_bucket_id || source_bucket_id === target_bucket_id) return;

  // Tentukan sprint_id di database sheet Tasks
  const target_sprint_id = (target_bucket_id === 'BACKLOG')
    ? ('BACKLOG-' + app_state.active_project_id)
    : target_bucket_id;

  // Cari objek task di source bucket
  let moved_task = null;
  if (source_bucket_id === 'BACKLOG') {
    const idx = (app_state.backlog_tasks || []).findIndex(t => t.id === task_id);
    if (idx !== -1) {
      moved_task = app_state.backlog_tasks.splice(idx, 1)[0];
    }
  } else {
    const sp = (app_state.sprints || []).find(s => s.id === source_bucket_id);
    if (sp && sp.tasks) {
      const idx = sp.tasks.findIndex(t => t.id === task_id);
      if (idx !== -1) {
        moved_task = sp.tasks.splice(idx, 1)[0];
        sp.total_hours -= (Number(moved_task.estimate_hours) || 0);
      }
    }
  }

  if (!moved_task) return;

  // Masukkan ke target bucket
  moved_task.sprint_id = target_sprint_id;
  if (target_bucket_id === 'BACKLOG') {
    if (!app_state.backlog_tasks) app_state.backlog_tasks = [];
    app_state.backlog_tasks.push(moved_task);
  } else {
    const sp = (app_state.sprints || []).find(s => s.id === target_bucket_id);
    if (sp) {
      if (!sp.tasks) sp.tasks = [];
      sp.tasks.push(moved_task);
      sp.total_hours = (Number(sp.total_hours) || 0) + (Number(moved_task.estimate_hours) || 0);
    }
  }

  // Render perubahan segera (optimistic update)
  render_scrum_planning_view();
  show_notification(`Task ${task_id} berhasil dipindahkan ke ${target_bucket_id}.`, 'success');

  // Sync ke Backend GAS
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (!response || !response.success) {
          show_notification('Gagal sinkron alokasi task: ' + (response ? response.message : ''), 'error');
          load_scrum_planning_data();
        }
      })
      .withFailureHandler(err => {
        show_notification('Error sinkron alokasi task: ' + err.message, 'error');
        load_scrum_planning_data();
      })
      .move_task_to_sprint(task_id, target_sprint_id);
  }
}

function handle_submit_start_sprint(e) {
  e.preventDefault();
  const sprint_id = document.getElementById('start-sprint-id').value;
  const sprint_name = document.getElementById('start-sprint-name').value;
  const duration_weeks = document.getElementById('start-sprint-duration').value;
  const sprint_goal = document.getElementById('start-sprint-goal').value;
  const confirm_btn = document.getElementById('btn-confirm-start-sprint');

  if (!sprint_id || !sprint_name.trim()) return;

  const payload = {
    sprint_id: sprint_id,
    sprint_name: sprint_name.trim(),
    duration_weeks: Number(duration_weeks) || 2,
    sprint_goal: sprint_goal.trim()
  };

  if (confirm_btn) {
    confirm_btn.disabled = true;
    confirm_btn.textContent = 'Memulai Sprint...';
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {

      .withSuccessHandler(response => {

        if (response && response.success) {
          show_notification('Sprint ' + sprint_name + ' berhasil dimulai!', 'success');
          close_start_sprint_modal();
          // Update active sprint
          app_state.active_sprint_id = sprint_id;
          const header_sp = document.getElementById('header-sprint-name');
          if (header_sp) header_sp.textContent = response.data.sprint_name || sprint_name;

          confirm_btn.textContent = '🚀 Mulai Sprint Sekarang';
        }
        show_notification('Error memulai sprint: ' + err.message, 'error');
      })
      .start_sprint(payload);
  } else {
    // Mode simulasi lokal
    if (confirm_btn) {
      confirm_btn.disabled = false;
      confirm_btn.textContent = '🚀 Mulai Sprint Sekarang';
    }
    show_notification('Sprint ' + sprint_name + ' simulasi aktif!', 'success');
    close_start_sprint_modal();
    app_state.active_sprint_id = sprint_id;
    const header_sp = document.getElementById('header-sprint-name');
    if (header_sp) header_sp.textContent = sprint_name;
    switch_view('board');
  }
}

/**
 * Membuka Modal Selesaikan Sprint
 * @param {string} [sprint_id] - ID sprint yang akan diselesaikan
 */
function open_complete_sprint_modal(sprint_id) {
  const target_id = sprint_id || app_state.active_sprint_id;
  const modal = document.getElementById('modal-complete-sprint');
  if (!modal) return;

  const hidden_input = document.getElementById('complete-sprint-id');
  if (hidden_input) hidden_input.value = target_id;

  const subtitle = document.getElementById('complete-sprint-subtitle');
  if (subtitle) {
    let sp_display_name = target_id;
    if (app_state.sprints && app_state.sprints.length > 0) {
      const found = app_state.sprints.find(s => s.id === target_id);
      if (found && found.name) sp_display_name = found.name;
    } else {
      const header_sp = document.getElementById('header-sprint-name');
      if (header_sp) sp_display_name = header_sp.textContent;
    }
    subtitle.textContent = `Menyelesaikan ${sp_display_name} (${target_id}). Tinjau hasil dan alihkan task yang belum selesai.`;
  }

  // Hitung jumlah task DONE vs Belum Selesai (TODO, IN_PROGRESS, REVIEW)
  let done_count = 0;
  let incomplete_count = 0;

  let found_sp = null;
  if (app_state.sprints && app_state.sprints.length > 0) {
    found_sp = app_state.sprints.find(s => s.id === target_id);
  }

  if (found_sp && found_sp.tasks) {
    found_sp.tasks.forEach(t => {
      if (String(t.status).toUpperCase() === 'DONE') done_count++;
      else incomplete_count++;
    });
  } else if (app_state.tasks && app_state.tasks.length > 0) {
    app_state.tasks.forEach(t => {
      if (String(t.sprint_id).trim() === String(target_id).trim()) {
        if (String(t.status).toUpperCase() === 'DONE') done_count++;
        else incomplete_count++;
      }
    });
  }

  const done_el = document.getElementById('complete-sprint-done-count');
  const inc_el = document.getElementById('complete-sprint-incomplete-count');
  if (done_el) done_el.textContent = `${done_count} Task`;
  if (inc_el) inc_el.textContent = `${incomplete_count} Task`;

  // Isi pilihan dropdown Sprint Berikutnya
  const target_select = document.getElementById('complete-sprint-target-select');
  if (target_select) {
    target_select.innerHTML = '<option value="__NEW__">+ Buat Sprint Baru Otomatis</option>';
    if (app_state.sprints && app_state.sprints.length > 0) {
      app_state.sprints.forEach(sp => {
        if (sp.id !== target_id && String(sp.status || '').toUpperCase() !== 'COMPLETED') {
          const opt = document.createElement('option');
          opt.value = sp.id;
          opt.textContent = `${sp.name || sp.id} (${sp.id}) - ${sp.status || 'Draft'}`;
          target_select.appendChild(opt);
        }
      });
    }
  }

  // Reset radio dan opsi default
  const radio_next = document.querySelector('input[name="rollover_dest"][value="NEXT_SPRINT"]');
  if (radio_next) radio_next.checked = true;
  toggle_complete_sprint_dest_options();

  const name_input = document.getElementById('complete-sprint-new-name');
  if (name_input) {
    const next_num = (app_state.sprints ? app_state.sprints.length : 1) + 1;
    name_input.value = `Sprint ${next_num} (Planning)`;

/**
 * Handle submit selesaikan sprint
 */
function handle_submit_complete_sprint(e) {
  if (e) e.preventDefault();

  const sprint_id = document.getElementById('complete-sprint-id').value;
  if (!sprint_id) return;

  const selected_dest = document.querySelector('input[name="rollover_dest"]:checked');
  const rollover_destination = selected_dest ? selected_dest.value : 'NEXT_SPRINT';

  let target_sprint_id = '';
  let new_sprint_name = '';

  if (rollover_destination === 'NEXT_SPRINT') {
    const target_select = document.getElementById('complete-sprint-target-select');
    if (target_select && target_select.value !== '__NEW__') {
      target_sprint_id = target_select.value;
    } else {
      const name_input = document.getElementById('complete-sprint-new-name');
      new_sprint_name = name_input && name_input.value ? name_input.value.trim() : '';
    }
  }

  const payload = {
    sprint_id: sprint_id,
    rollover_destination: rollover_destination,
    target_sprint_id: target_sprint_id,
    new_sprint_name: new_sprint_name
  };

  const submit_btn = document.getElementById('btn-confirm-complete-sprint');
  if (submit_btn) {
    submit_btn.disabled = true;
    submit_btn.innerHTML = '<span>Menyelesaikan Sprint...</span>';
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    set_loading_state(true);
    google.script.run
      .withSuccessHandler(response => {
        set_loading_state(false);
        if (submit_btn) {
          submit_btn.disabled = false;
          submit_btn.innerHTML = '<span>🏁 Selesaikan Sprint Sekarang</span>';
        }
        if (response && response.success) {
          show_notification(response.message, 'success');
          close_complete_sprint_modal();
          load_projects_list();
          if (app_state.active_project_id) {
            load_scrum_planning_data();
          }
          switch_view('scrum-planning');
        } else {
          show_notification('Gagal menyelesaikan sprint: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        set_loading_state(false);
        if (submit_btn) {
          submit_btn.disabled = false;
          submit_btn.innerHTML = '<span>🏁 Selesaikan Sprint Sekarang</span>';
        }
        show_notification('Error menyelesaikan sprint: ' + err.message, 'error');
      })
      .complete_sprint(payload);
  } else {
    // Mode simulasi lokal
    if (submit_btn) {
      submit_btn.disabled = false;
      submit_btn.innerHTML = '<span>🏁 Selesaikan Sprint Sekarang</span>';
    }
    if (app_state.sprints) {
      const sp = app_state.sprints.find(s => s.id === sprint_id);
      if (sp) sp.status = 'COMPLETED';
    }
    close_complete_sprint_modal();
    show_notification('Sprint ' + sprint_id + ' simulasi berhasil diselesaikan!', 'success');
    render_scrum_planning_view();
  }
}

/**
 * Membuka Modal Tambah atau Edit Pengguna
 */
function open_user_modal(mode, user_id) {
  const modal = document.getElementById('modal-user-form');
  if (!modal) return;

  const mode_input = document.getElementById('input-user-mode');
  const id_input = document.getElementById('input-user-id');
  const name_input = document.getElementById('input-user-name');
  const email_input = document.getElementById('input-user-email');
  const role_select = document.getElementById('input-user-role');
  const title_el = document.getElementById('modal-user-form-title');
  const submit_label = document.getElementById('btn-submit-user-label');

  if (mode === 'create') {
    if (mode_input) mode_input.value = 'create';
    if (id_input) id_input.value = '';
    if (name_input) name_input.value = '';
    if (email_input) email_input.value = '';
    if (role_select) role_select.value = 'MEMBER';
    if (title_el) title_el.textContent = 'Tambah Pengguna Baru';
    if (submit_label) submit_label.textContent = 'Simpan Pengguna';
    handle_role_preset_change('MEMBER');
  } else if (mode === 'edit') {
    const target_user = (app_state.users_list || []).find(u => u.id === user_id);
    if (!target_user) {
      show_notification('Data pengguna tidak ditemukan.', 'error');
      return;
    }

    if (mode_input) mode_input.value = 'edit';
    if (id_input) id_input.value = target_user.id;
    if (name_input) name_input.value = target_user.name;
    if (email_input) email_input.value = target_user.email;
    if (role_select) role_select.value = target_user.role;
    if (title_el) title_el.textContent = 'Edit Pengguna: ' + target_user.name;
    if (submit_label) submit_label.textContent = 'Perbarui Pengguna';

    // Isi checkbox sesuai izin user
    const perms = target_user.permissions || DEFAULT_ROLE_PERMS[target_user.role] || DEFAULT_ROLE_PERMS.CLIENT;
    const cb_create_proj = document.getElementById('perm-can-create-project');
    const cb_manage_spr = document.getElementById('perm-can-manage-sprint');
    const cb_create_task = document.getElementById('perm-can-create-task');
    const cb_move_task = document.getElementById('perm-can-move-task');
    const cb_view_insights = document.getElementById('perm-can-view-insights');
    const cb_manage_users = document.getElementById('perm-can-manage-users');

    if (cb_create_proj) cb_create_proj.checked = !!perms.can_create_project;
    if (cb_manage_spr) cb_manage_spr.checked = !!perms.can_manage_sprint;
    if (cb_create_task) cb_create_task.checked = !!perms.can_create_task;
    if (cb_move_task) cb_move_task.checked = !!perms.can_move_task;
    if (cb_view_insights) cb_view_insights.checked = !!perms.can_view_insights;
    if (cb_manage_users) cb_manage_users.checked = !!perms.can_manage_users;
  }

  modal.classList.remove('hidden');
}

/**
 * Menutup Modal Pengguna
 */
function close_user_modal() {
  const modal = document.getElementById('modal-user-form');
  if (!modal) return;
  modal.classList.add('hidden');
  const form = document.getElementById('form-user-management');
  if (form) form.reset();
}

/**
 * Submit form Tambah / Edit Pengguna
 */
function handle_submit_user(e) {
  e.preventDefault();
  const mode = document.getElementById('input-user-mode').value;
  const user_id = document.getElementById('input-user-id').value;
  const name = document.getElementById('input-user-name').value.trim();
  const email = document.getElementById('input-user-email').value.trim();
  const role = document.getElementById('input-user-role').value;

  const permissions = {
    can_create_project: document.getElementById('perm-can-create-project').checked,
    can_manage_sprint: document.getElementById('perm-can-manage-sprint').checked,
    can_create_task: document.getElementById('perm-can-create-task').checked,
    can_move_task: document.getElementById('perm-can-move-task').checked,
    can_view_insights: document.getElementById('perm-can-view-insights').checked,
    can_manage_users: document.getElementById('perm-can-manage-users').checked
  };

  const payload = {
    id: user_id,
    name: name,
    email: email,
    role: role,
    permissions: permissions
  };

  const submit_btn = document.getElementById('btn-submit-user');
  const submit_label = document.getElementById('btn-submit-user-label');
  if (submit_btn) {
    submit_btn.disabled = true;
    if (submit_label) submit_label.textContent = 'Menyimpan...';
  }

  set_loading_state(true);

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    const success_handler = response => {
      set_loading_state(false);
      if (submit_btn) {
        submit_btn.disabled = false;
        if (submit_label) submit_label.textContent = (mode === 'create' ? 'Simpan Pengguna' : 'Perbarui Pengguna');
      }
      if (response && response.success) {
        show_notification(response.message || 'Operasi berhasil!', 'success');
        close_user_modal();
        load_users_management();
        // Update user session jika admin mengedit profilnya sendiri
        if (app_state.current_user && app_state.current_user.email.toLowerCase() === email.toLowerCase()) {
          fetch_user_session();
        }
      } else {
        show_notification('Gagal: ' + (response ? response.message : ''), 'error');
      }
    };

    const failure_handler = err => {
      set_loading_state(false);
      if (submit_btn) {
        submit_btn.disabled = false;
        if (submit_label) submit_label.textContent = (mode === 'create' ? 'Simpan Pengguna' : 'Perbarui Pengguna');
      }
      show_notification('Error: ' + err.message, 'error');
    };

    if (mode === 'create') {
      google.script.run
        .withSuccessHandler(success_handler)
        .withFailureHandler(failure_handler)
        .create_new_user(payload);
    } else {
      google.script.run
        .withSuccessHandler(success_handler)
        .withFailureHandler(failure_handler)
        .update_existing_user(payload);
    }
  } else {
    // Mode simulasi lokal
    set_loading_state(false);
    if (submit_btn) {
      submit_btn.disabled = false;
      if (submit_label) submit_label.textContent = (mode === 'create' ? 'Simpan Pengguna' : 'Perbarui Pengguna');
    }
    if (mode === 'create') {
      const new_user = {
        id: 'USR-' + ('000' + (app_state.users_list.length + 1)).slice(-3),
        name: name,
        email: email,
        role: role,
        permissions: permissions
      };
      app_state.users_list.push(new_user);
      show_notification('Pengguna ' + name + ' berhasil ditambahkan!', 'success');
    } else {
      const idx = app_state.users_list.findIndex(u => u.id === user_id);
      if (idx !== -1) {
        app_state.users_list[idx] = Object.assign({}, app_state.users_list[idx], payload);
        show_notification('Data pengguna ' + name + ' berhasil diperbarui!', 'success');
      }
    }
    close_user_modal();
    render_users_table(app_state.users_list);
  }
}

      .withSuccessHandler(response => {
        set_loading_state(false);
        if (confirm_btn) {
          confirm_btn.disabled = false;
          confirm_btn.textContent = 'Hapus Akun';
        }
        close_delete_user_modal();
        if (response && response.success) {
          show_notification(response.message || 'Pengguna berhasil dihapus.', 'success');
          load_users_management();
        } else {
          show_notification('Gagal menghapus pengguna: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        set_loading_state(false);
        if (confirm_btn) {
          confirm_btn.disabled = false;
          confirm_btn.textContent = 'Hapus Akun';
        }
        close_delete_user_modal();
        show_notification('Error menghapus pengguna: ' + err.message, 'error');
      })
      .delete_existing_user(user_id);
  } else {
    // Mode simulasi lokal
    set_loading_state(false);
    if (confirm_btn) {
      confirm_btn.disabled = false;
      confirm_btn.textContent = 'Hapus Akun';
    }
    close_delete_user_modal();
    app_state.users_list = app_state.users_list.filter(u => u.id !== user_id);
    render_users_table(app_state.users_list);
    show_notification('Pengguna simulasi berhasil dihapus.', 'success');
  }
}
</script>
