  is_loading: false,
  burndown_chart_instance: null

/**
 * Event Listener saat DOM siap dimuat
 */
document.addEventListener('DOMContentLoaded', () => {
  init_application();
});

/**
 * Inisialisasi awal aplikasi SPA
 */
function init_application() {
  fetch_user_session();
}

/**
 * Mengambil profil & role pengguna aktif dari backend GAS
 */
function fetch_user_session() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (response && response.success) {
          app_state.current_user = response.data;
          render_user_profile(response.data);
          apply_rbac_permissions(response.data.role);
          load_projects_list();
          load_sprint_tasks();
          load_sprint_insights();
        } else {
          show_notification('Gagal memuat profil pengguna.', 'error');
        }
      })
      .withFailureHandler(err => {
        show_notification('Error koneksi backend: ' + err.message, 'error');
      })
      .get_user_role();
  } else {
    // Mode simulasi lokal untuk pengujian browser
    const mock_user = {
      id: 'USR-002',
      name: 'Budi PM',
      email: 'pm@example.com',
      role: 'PM'
    };
    app_state.current_user = mock_user;
    render_user_profile(mock_user);
    apply_rbac_permissions(mock_user.role);
    init_mock_projects();
    init_mock_tasks();
    init_mock_insights();
  }
}

/**
 * Merender profil pengguna di sidebar
 */
function render_user_profile(user) {
  const avatar_el = document.getElementById('user-avatar');
  const name_el = document.getElementById('nav-user-name');
  const email_el = document.getElementById('nav-user-email');
  const role_badge_el = document.getElementById('nav-user-role-badge');
  const welcome_name_el = document.getElementById('dash-welcome-name');

  if (welcome_name_el) welcome_name_el.textContent = user.name || user.email || 'Pengguna';
  if (avatar_el && user.name) avatar_el.textContent = user.name.charAt(0).toUpperCase();
  if (name_el) name_el.textContent = user.name || user.email || 'Pengguna';
  if (email_el) email_el.textContent = user.email || '';
  if (role_badge_el) {
    role_badge_el.textContent = user.role;
    if (user.role === 'ADMIN' || user.role === 'PM') {
      role_badge_el.className = 'inline-block px-1.5 py-0.5 rounded text-[10px] font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30';
    } else if (user.role === 'MEMBER') {
      role_badge_el.className = 'inline-block px-1.5 py-0.5 rounded text-[10px] font-bold bg-blue-500/20 text-blue-300 border border-blue-500/30';
    } else {
      role_badge_el.className = 'inline-block px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30';
    }
  }
}

/**
 * Menyesuaikan kontrol UI berdasarkan RBAC
 */
function apply_rbac_permissions(role) {
  const rbac_tag = document.getElementById('rbac-permission-tag');
  const btn_add_task = document.getElementById('btn-add-task');

  if (rbac_tag) {
    if (role === 'ADMIN' || role === 'PM') {
      rbac_tag.textContent = 'Mode: ' + role + ' (Akses Penuh)';
      rbac_tag.className = 'text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-full';
      if (btn_add_task) btn_add_task.classList.remove('hidden');
    } else if (role === 'MEMBER') {
      rbac_tag.textContent = 'Mode: Team Member';
      rbac_tag.className = 'text-xs font-semibold text-blue-700 bg-blue-50 border border-blue-200 px-2.5 py-1 rounded-full';
      if (btn_add_task) btn_add_task.classList.add('hidden');
    } else {
      rbac_tag.textContent = 'Mode: External Client (Read-only)';
      rbac_tag.className = 'text-xs font-semibold text-amber-700 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-full';
      if (btn_add_task) btn_add_task.classList.add('hidden');
    }
  }
}

/**
 * Memuat task sprint dari backend
 */
function load_sprint_tasks() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    set_loading_state(true);
    google.script.run
      .withSuccessHandler(response => {
        set_loading_state(false);
        if (response && response.success) {
          app_state.tasks = response.data || [];
          render_kanban_board();
        } else {
          show_notification('Gagal mengambil daftar task: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        set_loading_state(false);
        show_notification('Error koneksi task: ' + err.message, 'error');
      })
      .get_sprint_tasks(app_state.active_sprint_id);
  }
}

/**
 * Memuat ringkasan insight & metrik dari backend
 */
function load_sprint_insights() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (response && response.success) {
          app_state.insights = response.data;
          render_insights_dashboard(response.data);
        } else {
          show_notification('Gagal memuat insight sprint: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        show_notification('Error koneksi insight: ' + err.message, 'error');
      })
      .get_sprint_insights(app_state.active_sprint_id);
  }
}

/**
 * Render Dasbor Insight: KPI Cards, Blocker List, dan Burndown Chart
 * @param {Object} data - Payload metrik
 */
function render_insights_dashboard(data) {
  if (!data) return;

  // 1. KPI Cards
  const el_lead = document.getElementById('metric-lead-time');
  const el_cycle = document.getElementById('metric-cycle-time');
  const el_blocker = document.getElementById('metric-blocker-count');

  if (el_lead && data.summary) el_lead.textContent = data.summary.avg_lead_time_hours;
  if (el_cycle && data.summary) el_cycle.textContent = data.summary.avg_cycle_time_hours;
  if (el_blocker && data.summary) el_blocker.textContent = data.summary.blocker_count;

  // 2. Blocker Highlights List
  const blocker_container = document.getElementById('blocker-list-container');
  if (blocker_container) {
    blocker_container.innerHTML = '';
    if (!data.blockers || data.blockers.length === 0) {
      blocker_container.innerHTML = `
        <div class="p-4 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg text-xs text-center font-medium">
          ✓ Tidak ada blocker terdeteksi saat ini.
        </div>
      `;
    } else {
      data.blockers.forEach(b => {
        const item = document.createElement('div');
        item.className = 'p-3 bg-rose-50/70 border border-rose-200 rounded-lg text-xs flex flex-col space-y-1.5';
        item.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-rose-800">${b.task_id}</span>
            <span class="px-1.5 py-0.5 rounded bg-rose-200 text-rose-900 font-semibold text-[10px]">
              Macet ${b.stuck_hours} Jam
            </span>
          </div>
          <p class="font-medium text-slate-800">${b.title}</p>
          <div class="flex justify-between items-center text-[10px] text-slate-500 pt-1 border-t border-rose-100">
            <span>Status: <strong class="text-rose-700">${b.status}</strong></span>
            <span>PIC: <strong>${b.assignee}</strong></span>
          </div>
        `;
        blocker_container.appendChild(item);
      });
    }
  }

  // 3. Render Burndown Chart via Chart.js
  render_burndown_chart(data.burndown);
}

/**
 * Merender grafik garis Burndown Chart dengan Chart.js
 * @param {Object} burndown - { labels, ideal_hours, actual_hours }
 */
function render_burndown_chart(burndown) {
  if (!burndown) return;

  const canvas = document.getElementById('burndownChart');
  const placeholder = document.getElementById('burndown-placeholder');
  if (!canvas || typeof Chart === 'undefined') return;

  if (placeholder) placeholder.classList.add('hidden');

  // Hancurkan instance chart lama jika sudah ada
  if (app_state.burndown_chart_instance) {
    app_state.burndown_chart_instance.destroy();
  }

  const ctx = canvas.getContext('2d');
  app_state.burndown_chart_instance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: burndown.labels,
      datasets: [
        {
          label: 'Ideal Burndown (Jam)',
          data: burndown.ideal_hours,
          borderColor: '#94a3b8',
          borderDash: [5, 5],
          backgroundColor: 'transparent',
          borderWidth: 2,
          pointRadius: 3,
          tension: 0.1
        },
        {
          label: 'Aktual Tersisa (Jam)',
          data: burndown.actual_hours,
          borderColor: '#4f46e5',
          backgroundColor: 'rgba(79, 70, 229, 0.08)',
          fill: true,
          borderWidth: 3,
          pointRadius: 4,
          pointBackgroundColor: '#4f46e5',
          tension: 0.2
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false
      },
      plugins: {
        legend: {
          position: 'top',
          labels: {
            boxWidth: 12,
            font: { size: 11 }
          }
        },
        tooltip: {
          padding: 8
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          title: {
            display: true,
            text: 'Estimasi Jam Tersisa',
            font: { size: 11 }
          },
          grid: {
            color: '#f1f5f9'
          }
        },
        x: {
          grid: {
            display: false
          }
        }
      }
    }
  });
}

/**
 * Merender kartu-kartu task ke dalam 4 kolom Kanban Board
 */
function render_kanban_board() {
  const columns = {
    TODO: document.getElementById('column-todo'),
    IN_PROGRESS: document.getElementById('column-in_progress'),
    REVIEW: document.getElementById('column-review'),
    DONE: document.getElementById('column-done')
  };

  const counters = {
    TODO: document.getElementById('count-todo'),
    IN_PROGRESS: document.getElementById('count-in_progress'),
    REVIEW: document.getElementById('count-review'),
    DONE: document.getElementById('count-done')
  };

  Object.keys(columns).forEach(status => {
    if (columns[status]) columns[status].innerHTML = '';
    if (counters[status]) counters[status].textContent = '0';
  });

  const column_counts = { TODO: 0, IN_PROGRESS: 0, REVIEW: 0, DONE: 0 };
  const can_edit = app_state.current_user && app_state.current_user.role !== 'CLIENT';

  app_state.tasks.forEach(task => {
    const status = task.status;
    if (columns[status]) {
      column_counts[status]++;
      const card = create_task_card_element(task, can_edit);
      columns[status].appendChild(card);
    }
  });

  Object.keys(column_counts).forEach(status => {
    if (counters[status]) counters[status].textContent = column_counts[status];
    if (columns[status] && column_counts[status] === 0) {
      columns[status].innerHTML = `
        <div class="p-4 bg-white/60 border border-dashed border-slate-200 rounded-lg text-xs text-slate-400 italic text-center">
          Tidak ada task
        </div>
      `;
    }
  });
}

/**
 * Membuat elemen kartu task dengan dukungan HTML5 Drag and Drop
 */
function create_task_card_element(task, can_edit) {
  const card = document.createElement('div');
  card.id = 'task-card-' + task.id;

  if (can_edit) {
    card.draggable = true;
    card.ondragstart = (e) => handle_drag_start(e, task.id);
    card.ondragend = (e) => handle_drag_end(e);
    card.className = 'p-3.5 bg-white rounded-xl border border-slate-200/90 shadow-sm hover:shadow-md hover:border-indigo-300 transition-all cursor-grab active:cursor-grabbing flex flex-col justify-between space-y-2.5';
  } else {
    card.className = 'p-3.5 bg-white rounded-xl border border-slate-200/90 shadow-sm flex flex-col justify-between space-y-2.5';
  }

  // Badge status kecil di kartu tanpa dropdown/combobox
  const status_color_map = {
    TODO: 'bg-slate-100 text-slate-600',
    IN_PROGRESS: 'bg-blue-100 text-blue-700',
    REVIEW: 'bg-amber-100 text-amber-700',
    DONE: 'bg-emerald-100 text-emerald-700'
  };
  const status_badge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded ${status_color_map[task.status] || 'bg-slate-100 text-slate-600'}">${task.status}</span>`;

  card.innerHTML = `
    <div>
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-[10px] font-bold tracking-wider text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-100">
          ${task.id}
        </span>
        <span class="text-[11px] font-medium text-slate-500 flex items-center">
          <svg class="w-3.5 h-3.5 mr-1 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          ${task.estimate_hours}h
        </span>
      </div>
      <h4 class="text-xs font-semibold text-slate-800 line-clamp-2 leading-snug">
        ${task.title}
      </h4>
    </div>

    <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
      <div class="flex items-center space-x-1.5">
        <div class="w-5 h-5 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-[10px] font-bold">
          ${(task.assignee_name || 'U').charAt(0).toUpperCase()}
        </div>
        <span class="text-[11px] text-slate-600 truncate max-w-[90px]" title="${task.assignee_name}">
          ${task.assignee_name || 'Unassigned'}
        </span>
      </div>
      <div>
        ${status_badge}
      </div>
    </div>
  `;

  return card;
}

/**
 * Event Handlers HTML5 Drag and Drop
 */
let dragged_task_id = null;

function handle_drag_start(e, task_id) {
  dragged_task_id = task_id;
  e.dataTransfer.setData('text/plain', task_id);
  e.dataTransfer.effectAllowed = 'move';
  const target = e.target;
  setTimeout(() => {
    target.classList.add('opacity-40', 'scale-95');
  }, 0);
}

function handle_drag_end(e) {
  const target = e.target;
  target.classList.remove('opacity-40', 'scale-95');
  dragged_task_id = null;
  // Bersihkan highlight dari semua kolom
  ['column-todo', 'column-in_progress', 'column-review', 'column-done'].forEach(col_id => {
    const el = document.getElementById(col_id);
    if (el) el.classList.remove('bg-indigo-50/70', 'ring-2', 'ring-indigo-400');
  });
}

function handle_drag_over(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const current_col = e.currentTarget;
  current_col.classList.add('bg-indigo-50/70', 'ring-2', 'ring-indigo-400');
}

function handle_drag_leave(e) {
  const current_col = e.currentTarget;
  current_col.classList.remove('bg-indigo-50/70', 'ring-2', 'ring-indigo-400');
}

function handle_drop(e, target_status) {
  e.preventDefault();
  const current_col = e.currentTarget;
  current_col.classList.remove('bg-indigo-50/70', 'ring-2', 'ring-indigo-400');

  const task_id = e.dataTransfer.getData('text/plain') || dragged_task_id;
  if (!task_id || !target_status) return;

  handle_task_status_change(task_id, target_status);
}

/**
 * Menangani pergeseran status task dan me-refresh insight secara otomatis
 */
function handle_task_status_change(task_id, new_status) {
  const target_task = app_state.tasks.find(t => t.id === task_id);
  if (!target_task) return;

  const old_status = target_task.status;
  if (old_status === new_status) return;

  // Optimistic UI update
  target_task.status = new_status;
  target_task.updated_at = new Date().toISOString();
  render_kanban_board();

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (response && response.success) {
          show_notification('Status task ' + task_id + ' berhasil diubah ke ' + new_status, 'success');
          // Refresh insight data pasca pergeseran status
          load_sprint_insights();
        } else {
          target_task.status = old_status;
          render_kanban_board();
          show_notification('Gagal mengubah status: ' + (response ? response.message : 'Ditolak backend'), 'error');
        }
      })
      .withFailureHandler(err => {
        target_task.status = old_status;
        render_kanban_board();
        show_notification('Error pergeseran status: ' + err.message, 'error');
      })
      .update_task_status(task_id, new_status);
  } else {
    show_notification('[Simulasi] Status task ' + task_id + ' berpindah: ' + old_status + ' -> ' + new_status, 'info');
  }
}

/**
 * Logika SPA Navigasi antar tampilan tanpa reload browser
 */
function switch_view(target_view) {
  const views = ['dashboard', 'board', 'scrum-planning', 'insights', 'settings'];
  
  views.forEach(view_name => {
    const section_el = document.getElementById('view-' + view_name);
    const nav_btn_el = document.getElementById('nav-btn-' + view_name);

    if (section_el) {
      if (view_name === target_view) {
        section_el.classList.remove('hidden');
        section_el.classList.add('block');
        // Render ulang chart jika beralih ke view insights agar responsive
        if (view_name === 'insights' && app_state.insights) {
          render_insights_dashboard(app_state.insights);
        }
        if (view_name === 'dashboard') {
          load_projects_list();
        }
        if (view_name === 'scrum-planning') {
          load_scrum_planning_data();
        }
        if (view_name === 'board') {
          load_sprint_tasks();
        }
      } else {
        section_el.classList.remove('block');
        section_el.classList.add('hidden');
      }
    }

    if (nav_btn_el) {
      if (view_name === target_view) {
        nav_btn_el.className = 'nav-tab-btn flex items-center w-full px-3 py-2.5 text-sm font-medium rounded-lg text-white bg-indigo-600/90 shadow-sm transition-colors group';
      } else {
        nav_btn_el.className = 'nav-tab-btn flex items-center w-full px-3 py-2.5 text-sm font-medium rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition-colors group';
      }
    }
  });

  app_state.current_view = target_view;
}

    }
  }
}

/**
 * Submit form pembuatan task baru ke Backend
 */
function handle_submit_new_task(e) {
  e.preventDefault();
  const title_el = document.getElementById('input-task-title');
  const est_el = document.getElementById('input-task-estimate');
  const assignee_el = document.getElementById('input-task-assignee');
  const submit_btn = document.getElementById('btn-submit-task');
  const target_input = document.getElementById('input-task-target-bucket');

  if (!title_el || !title_el.value.trim()) return;

  const target_sprint = (target_input && target_input.value) ? target_input.value : app_state.active_sprint_id;

  const task_payload = {
    sprint_id: target_sprint,
    title: title_el.value.trim(),
    estimate_hours: Number(est_el ? est_el.value : 8) || 8,
    assignee_id: assignee_el ? assignee_el.value : ''
  };

  if (submit_btn) {
    submit_btn.disabled = true;
    submit_btn.textContent = 'Menyimpan...';
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (submit_btn) {
          submit_btn.disabled = false;
          submit_btn.textContent = 'Simpan Task';
        }
        if (response && response.success) {
          show_notification('Task berhasil dibuat!', 'success');
          close_task_modal();
          if (app_state.current_view === 'scrum-planning') {
            load_scrum_planning_data();
          } else {
            load_sprint_tasks();
            load_sprint_insights();
          }
        } else {
          show_notification('Gagal membuat task: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        if (submit_btn) {
          submit_btn.disabled = false;
          submit_btn.textContent = 'Simpan Task';
        }
        show_notification('Error membuat task: ' + err.message, 'error');
      })
      .create_new_task(task_payload);
  } else {
    // Mode simulasi lokal
    if (submit_btn) {
      submit_btn.disabled = false;
      submit_btn.textContent = 'Simpan Task';
    }
    const new_mock_task = {
      id: 'TSK-' + ('000' + (app_state.tasks.length + 1)).slice(-3),
      sprint_id: target_sprint,
      title: task_payload.title,
      status: 'TODO',
      assignee_name: 'Simulasi User',
      estimate_hours: task_payload.estimate_hours,
      created_at: new Date().toISOString(),
      updated_at: new Date().toISOString()
    };
    if (target_sprint.startsWith('BACKLOG')) {
      app_state.backlog_tasks.push(new_mock_task);
      render_scrum_planning_view();
    } else {
      app_state.tasks.push(new_mock_task);
      render_kanban_board();
    }
    close_task_modal();
    show_notification('Task simulasi berhasil ditambahkan!', 'success');
  }
}

/**

 */
function escape_html(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/**
 * Membuat elemen kartu task pada Bucket Scrum
 */
function create_bucket_task_card_element(task, source_bucket_id, can_edit) {
  const card = document.createElement('div');
  card.id = 'bucket-task-' + task.id;
  card.className = 'p-3 bg-white rounded-xl border border-slate-200 shadow-xs hover:shadow-md hover:border-indigo-300 transition-all flex items-center justify-between space-x-3' + (can_edit ? ' cursor-grab active:cursor-grabbing' : '');
  
  if (can_edit) {
    card.draggable = true;
    card.ondragstart = (e) => handle_bucket_drag_start(e, task.id, source_bucket_id);
    card.ondragend = (e) => handle_bucket_drag_end(e);
  }

  card.innerHTML = `
    <div class="flex items-center space-x-3 min-w-0">
      <div class="text-slate-400 flex-shrink-0 cursor-grab">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"/></svg>
      </div>
      <div class="min-w-0">
        <div class="flex items-center space-x-2">
          <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded">${task.id}</span>
          <h5 class="text-xs font-bold text-slate-800 truncate">${escape_html(task.title)}</h5>
        </div>
        <p class="text-[10px] text-slate-400 mt-0.5">PIC: <span class="font-medium text-slate-600">${escape_html(task.assignee_name || 'Belum Ditugaskan')}</span></p>
      </div>
    </div>
    <div class="flex-shrink-0 flex items-center space-x-2">
      <span class="text-[10px] font-bold text-slate-700 bg-slate-100 px-2 py-0.5 rounded-full border border-slate-200">
        ${task.estimate_hours || 0} Jam
      </span>
    </div>
  `;

  return card;
}

/**
 * Logika HTML5 Drag & Drop Antar Bucket
 */
let current_bucket_drag_data = null;

function handle_bucket_drag_start(e, task_id, source_bucket_id) {
  current_bucket_drag_data = { task_id: task_id, source_bucket_id: source_bucket_id };
  e.dataTransfer.setData('text/plain', JSON.stringify(current_bucket_drag_data));
  e.dataTransfer.effectAllowed = 'move';
  const target_card = document.getElementById('bucket-task-' + task_id);
  if (target_card) target_card.classList.add('opacity-40');
}

function handle_bucket_drag_end(e) {
  if (current_bucket_drag_data && current_bucket_drag_data.task_id) {
    const target_card = document.getElementById('bucket-task-' + current_bucket_drag_data.task_id);
    if (target_card) target_card.classList.remove('opacity-40');
  }
  document.querySelectorAll('.bucket-droppable-area').forEach(el => {
    el.classList.remove('bg-indigo-50', 'ring-2', 'ring-indigo-300');
  });
  current_bucket_drag_data = null;
}

function handle_bucket_drag_over(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const drop_zone = e.currentTarget;
  if (drop_zone) {
    drop_zone.classList.add('bg-indigo-50', 'ring-2', 'ring-indigo-300');
  }
}

function handle_bucket_drag_leave(e) {
  const drop_zone = e.currentTarget;
  if (drop_zone) {
    drop_zone.classList.remove('bg-indigo-50', 'ring-2', 'ring-indigo-300');
  }
}

function handle_bucket_drop(e, target_bucket_id) {
  e.preventDefault();
  const drop_zone = e.currentTarget;
  if (drop_zone) {
    drop_zone.classList.remove('bg-indigo-50', 'ring-2', 'ring-indigo-300');
  }

  let drag_data = current_bucket_drag_data;
  if (!drag_data) {
    try {
      drag_data = JSON.parse(e.dataTransfer.getData('text/plain'));
    } catch (err) {
      return;
    }
  }

  if (!drag_data || !drag_data.task_id) return;
  const task_id = drag_data.task_id;
  const source_bucket_id = drag_data.source_bucket_id;

  if (source_bucket_id === target_bucket_id) return;

  // Tentukan sprint_id di database sheet Tasks
  const target_sprint_id = (target_bucket_id === 'BACKLOG')
    ? ('BACKLOG-' + app_state.active_project_id)
    : target_bucket_id;

  // Cari objek task di source bucket
  let moved_task = null;
  if (source_bucket_id === 'BACKLOG') {
    const idx = app_state.backlog_tasks.findIndex(t => t.id === task_id);
    if (idx !== -1) {
      moved_task = app_state.backlog_tasks.splice(idx, 1)[0];
    }
  } else {
    const sp = app_state.sprints.find(s => s.id === source_bucket_id);
    if (sp && sp.tasks) {
      const idx = sp.tasks.findIndex(t => t.id === task_id);
      if (idx !== -1) {
        moved_task = sp.tasks.splice(idx, 1)[0];
        sp.total_hours -= (moved_task.estimate_hours || 0);
      }
    }
  }

  if (!moved_task) return;

  // Masukkan ke target bucket
  moved_task.sprint_id = target_sprint_id;
  if (target_bucket_id === 'BACKLOG') {
    app_state.backlog_tasks.push(moved_task);
  } else {
    const sp = app_state.sprints.find(s => s.id === target_bucket_id);
    if (sp) {
      if (!sp.tasks) sp.tasks = [];
      sp.tasks.push(moved_task);
      sp.total_hours = (sp.total_hours || 0) + (moved_task.estimate_hours || 0);
    }
  }

  // Render perubahan segera (optimistic update)
  render_scrum_planning_view();
  show_notification(`Task ${task_id} dialokasikan ke ${target_bucket_id}`, 'success');

  // Sync ke Backend GAS
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (!response || !response.success) {
          show_notification('Gagal sinkron alokasi task: ' + (response ? response.message : ''), 'error');
          load_scrum_planning_data();
        }
      })
      .withFailureHandler(err => {
        show_notification('Error sinkron alokasi task: ' + err.message, 'error');
        load_scrum_planning_data();
      })
      .move_task_to_sprint(task_id, target_sprint_id);
  }
}

/**
 * Handler membuat bucket Sprint baru (Sprint 2, 3, dst.)
 */
function handle_create_new_sprint_bucket() {
  const next_num = (app_state.sprints ? app_state.sprints.length : 0) + 1;
  const sprint_name = prompt('Masukkan nama bucket Sprint baru:', 'Sprint ' + next_num + ' (Planning)');
  if (!sprint_name || !sprint_name.trim()) return;

  set_loading_state(true);
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        set_loading_state(false);
        if (response && response.success) {
          show_notification(response.message || 'Bucket sprint baru berhasil dibuat!', 'success');
          load_scrum_planning_data();
        } else {
          show_notification('Gagal membuat sprint: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        set_loading_state(false);
        show_notification('Error membuat sprint: ' + err.message, 'error');
      })
      .create_new_sprint_bucket(app_state.active_project_id, sprint_name.trim());
  } else {
    // Mode simulasi lokal
    set_loading_state(false);
    const new_sp = {
      id: 'SPR-00' + (app_state.sprints.length + 1),
      project_id: app_state.active_project_id,
      name: sprint_name.trim(),
      start_date: new Date().toISOString().split('T')[0],
      end_date: new Date(Date.now() + 14 * 86400000).toISOString().split('T')[0],
      tasks: [],
      total_hours: 0
    };
    app_state.sprints.push(new_sp);
    render_scrum_planning_view();
    show_notification('Bucket sprint ' + sprint_name + ' berhasil dibuat!', 'success');
  }
}

/**
 * Membuka Modal Konfirmasi Start Sprint
 */
function open_start_sprint_modal(sprint_id) {
  const modal = document.getElementById('modal-start-sprint');
  if (!modal) return;

  const target_sp = (app_state.sprints || []).find(s => s.id === sprint_id);
  if (!target_sp) {
    show_notification('Data sprint tidak ditemukan.', 'error');
    return;
  }

  document.getElementById('start-sprint-id').value = sprint_id;
  document.getElementById('start-sprint-name').value = target_sp.name || ('Sprint ' + sprint_id);
  document.getElementById('start-sprint-duration').value = '2';
  
  const count_el = document.getElementById('start-sprint-count-label');
  const hours_el = document.getElementById('start-sprint-hours-label');
  if (count_el) count_el.textContent = (target_sp.tasks ? target_sp.tasks.length : 0) + ' Task';
  if (hours_el) hours_el.textContent = (target_sp.total_hours || 0) + ' Jam';

  const goal_el = document.getElementById('start-sprint-goal');
  if (goal_el) goal_el.value = '';

  modal.classList.remove('hidden');
}

/**
 * Menutup Modal Start Sprint
 */
function close_start_sprint_modal() {
  const modal = document.getElementById('modal-start-sprint');
  if (!modal) return;
  modal.classList.add('hidden');
  const form = document.getElementById('form-start-sprint');
  if (form) form.reset();
}

/**
 * Submit form Start Sprint dan mengaktifkannya ke Kanban Board
 */
function handle_submit_start_sprint(e) {
  e.preventDefault();
  const sprint_id = document.getElementById('start-sprint-id').value;
  const sprint_name = document.getElementById('start-sprint-name').value;
  const duration_weeks = document.getElementById('start-sprint-duration').value;
  const sprint_goal = document.getElementById('start-sprint-goal').value;
  const confirm_btn = document.getElementById('btn-confirm-start-sprint');

  if (!sprint_id || !sprint_name.trim()) return;

  const payload = {
    sprint_id: sprint_id,
    sprint_name: sprint_name.trim(),
    duration_weeks: Number(duration_weeks) || 2,
    sprint_goal: sprint_goal.trim()
  };

  if (confirm_btn) {
    confirm_btn.disabled = true;
    confirm_btn.textContent = 'Memulai Sprint...';
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(response => {
        if (confirm_btn) {
          confirm_btn.disabled = false;
          confirm_btn.textContent = '🚀 Mulai Sprint Sekarang';
        }
        if (response && response.success) {
          show_notification('Sprint ' + sprint_name + ' berhasil dimulai!', 'success');
          close_start_sprint_modal();
          // Update active sprint
          app_state.active_sprint_id = sprint_id;
          const header_sp = document.getElementById('header-sprint-name');
          if (header_sp) header_sp.textContent = response.data.sprint_name || sprint_name;
          // Alihkan ke Kanban board aktif
          switch_view('board');
          load_sprint_tasks();
          load_sprint_insights();
        } else {
          show_notification('Gagal memulai sprint: ' + (response ? response.message : ''), 'error');
        }
      })
      .withFailureHandler(err => {
        if (confirm_btn) {
          confirm_btn.disabled = false;
          confirm_btn.textContent = '🚀 Mulai Sprint Sekarang';
        }
        show_notification('Error memulai sprint: ' + err.message, 'error');
      })
      .start_sprint(payload);
  } else {
    // Mode simulasi lokal
    if (confirm_btn) {
      confirm_btn.disabled = false;
      confirm_btn.textContent = '🚀 Mulai Sprint Sekarang';
    }
    show_notification('Sprint ' + sprint_name + ' simulasi aktif!', 'success');
    close_start_sprint_modal();
    app_state.active_sprint_id = sprint_id;
    const header_sp = document.getElementById('header-sprint-name');
    if (header_sp) header_sp.textContent = sprint_name;
    switch_view('board');
  }
}
